## 定位与范围

业务操作发生后，由龙小督以 agent 消息（Mattermost DM 卡片）通知对应协作者。通知的触发逻辑与文案在本页统一梳理；台账原型界面不展示通知本身，仅通过流转记录留痕事项侧动作。

本文仅覆盖本次迭代新增的两个触发场景：打回、撤回；历史业务触发的消息（下发、提交、转办）与既有提醒类通知（到期未填报、中间提醒、DDL 逾期、督办汇总等）不在本文范围。

## 通用规则

- 收件人解析：优先按角色账号解析 AI+ 用户；解析失败跳过该收件人并记录日志，不阻断其他收件人。
- 幂等去重：同一收件人、同一场景、同一事项在同一轮操作中只发一条。
- 推送失败只记录日志，不回滚业务写入。
- 通知正文中的事项信息取自当前事项记录：事项编号、事项名称、交办内容、督办批次号、截止时间。

### 文案占位符

| 占位符 | 含义 |
|---|---|
| `{收件人}` | 消息接收人姓名 |
| `{操作人}` | 触发通知的操作人及其角色 |
| `{事项编号}` | 事项编号 |
| `{事项名称}` | 交办事项 |
| `{交办内容}` | 具体工作要求 |
| `{截止时间}` | 本批填报截止时间 |
| `{打回原因}` / `{撤回原因}` | 操作人在弹窗中填写的必填原因 |
| `{N}` | 打回轮次 |

## 触发逻辑总表

| 场景 | 触发动作 | 接收对象 | 要点 |
|---|---|---|---|
| 打回 | 任一上游打回 | **直接下游临近节点角色** | 更下游不通知；正文必须带打回原因 |
| 撤回 | 督办人撤回 | **全部下游协作者** | 经办人、转办人、次级转办人中实际存在的角色各一条；正文必须带撤回原因；不通知督办人自己 |

## 消息剧本

### 打回

```text
{收件人}，你好，{操作人}将督办事项{事项编号}《{事项名称}》打回给你，请修改后重新提交，原截止时间 {截止时间} 保持不变：
- 交办内容：{交办内容}
- 打回原因：{打回原因}
- 打回轮次：第 {N} 次
谢谢。
```

### 撤回

```text
{收件人}，你好，督办人{操作人}撤回了督办事项{事项编号}《{事项名称}》，该事项不再参与本轮督办，无需继续填报：
- 撤回原因：{撤回原因}
如有疑问请联系督办人，谢谢。
```

## 边界与说明

- 打回只通知直接下游临近节点角色：更下游的有效提交状态不受影响，也不需要被打扰；该角色若继续向下打回，由其负责通知自己的直接下游。
- 撤回通知全部下游协作者：只要协作者面板中该角色实际存在（非「—」）即通知，包括已完成提交的角色。
- 打回、撤回的原因均为必填，文案中必须原样带出，不做截断。
- 已归档事项上的操作不再触发通知。
