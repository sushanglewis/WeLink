> 本文是本次迭代的业务唯一口径，只说明用户、场景、状态、规则和验收标准，不规定技术实现方案。

## 产品背景

龙小督台账用于督办人、经办人、转办人和次转人在同一条事项填报记录上逐级协作。现有系统已按「批次 → 事项卡 → 事项详情」组织内容，本次迭代必须保持该信息设计框架。

## 产品目标

1. 经办人无需返回聊天记录即可理解完整交办内容。
2. 督办人可撤回错误下发记录，并立即重新发起督办。
3. 用户可直接从批次名称识别截止时间和同截止时间下的批次顺序。
4. 督办人可一次合并导出多个合格批次。
5. 用户可通过批次多选在统一台账视图中查看跨批次事项合集。
6. 上游可将不合格填报逐级打回直接下游修改。

## 用户与责任链

- **督办人**：发起督办、查看和修改下游填报、逐项审核、撤回事项、导出归档。
- **经办人**：直接填报或转办；审核转办人的填报；收到打回后可继续打回转办人。
- **转办人**：直接填报或再转；审核次转人的填报；收到打回后可继续打回次转人。
- **次转人**：责任链末端，只负责填报或重新处理打回内容。

## 功能需求

### 1. 交办内容

- 事项详情在交办事项下展示只读「交办内容」。
- 超过三行时默认收起，可展开/收起；空值显示「暂无交办内容」。
- 督办人、经办人、转办人、次转人均可见。

### 2. 督办人撤回

- 仅原发起督办人可在归档前撤回某批次下的具体事项填报记录。
- 撤回原因必填；成功后移除下游待办、锁定表单并通知相关协作者。
- 已撤回记录不参加导出，也不再触发 72 小时内重复督办限制。

### 3. 批次命名

- 批次名称统一为 `YYYY-MM-DD HH:mm-N`。
- 所有批次均带自增序号，从 `-1` 开始；同截止分钟依次为 `-1`、`-2`、`-3`。
- 未提供截止时间时，默认取正式下发后 36 小时。
- 历史批次先补齐截止时间，再按相同规则统一重命名。

### 4. 多批次合并导出

- 批次选择框支持多选，当前选择同时决定事项卡合集和 Excel 导出范围。
- 用户进入台账时默认全选全部未归档批次；已归档批次默认不选中，但可手动选择查看。
- 提供「全选未归档」「仅选可导出」「清空」快捷操作。
- 批次内所有有效记录均为「已填报」或「已审核」时可导出。
- 任一选中批次不满足条件或已经归档时，整体禁止导出；不自动忽略或部分导出。
- 每个批次展示总事项、已撤回、已填报、已审核、已归档和待处理数量；总事项包含已撤回事项。
- 导出弹窗只确认范围和归档影响，不再选择批次。
- 导出即代表督办人认可该批内容；成功后有效记录统一变为「已归档 / 归档」。
- 导出成功后，已归档批次自动取消选择，并重新全选剩余未归档批次。

### 5. 统一台账视图

- 取消「按批次 / 平铺模式」切换，下方直接展示所选批次的全部事项，包括撤回记录。
- 排序顺序：逾期未填报 > 跟进中 > 已填报 > 已审核 > 已归档 > 已撤回。
- 同一状态内按填报截止时间升序，再按批次创建时间和事项编号排序。
- 所有事项卡单行横向排列，可左右拖动，也可用左右按钮逐项切换。
- 所有事项卡显示所属批次。

### 6. 逐级打回

- 提交即表示认可当前内容并向上流转，不增加独立「通过」步骤。
- 待上游提交节点可将记录打回实际直接下游，原因必填，原截止时间不变。
- 收到打回的经办人若仍有转办人，可继续打回转办人；转办人若仍有次转人，可继续打回次转人。
- 每一级打回都单独记录原因、操作人、接收人、时间和轮次。
- 原填报内容保留供修改，每次重新提交形成新的历史版本。

## 两套状态机

### 事项跟进状态（卡片右上角）

`跟进中 / 已填报 / 已审核 / 已归档 / 逾期未填报`

- 下游有效提交后为已填报。
- 督办人逐项提交后为已审核。
- 批次导出成功后为已归档。
- 打回后，截止前为跟进中，截止后为逾期未填报。

### 事项节点状态（卡片左下角）

`待经办人处理 / 待转办人处理 / 待次转人处理 / 待转办人提交 / 待经办人提交 / 待督办人提交 / 督办人已审核 / 归档`

## 督办人终审

- 督办人可逐项润色、修改并提交，事项进入「已审核 / 督办人已审核」。
- 督办人也可不逐项提交，直接导出所有有效记录均为已填报或已审核的批次。
- 导出即批次级认可和本轮归档。

## 明确不做

- 不设计记录评论、评论数量或协作未读徽标。
- 不增加手动刷新功能。
- 不在产品界面内提供角色切换；不同角色通过独立原型场景评审。
- 不改变现有功能栏、会话列表、台账纵向结构、横向事项卡和表单结构。

## 验收标准

- [ ] 六项功能可在同一原型中完整演示。
- [ ] 批次多选默认全选未归档批次，事项合集排序正确，卡片保持单行可拖动切换。
- [ ] 经办人和转办人收到打回后，可在仍有下游时继续向下打回。
- [ ] 任一选中批次不满足条件时整体禁止导出；导出确认不再选择批次。
- [ ] 所有批次名均使用 `-N`，首批也显示 `-1`。
- [ ] 三个待提交节点名称不包含额外括号文案。
- [ ] 页面不存在产品内角色切换和右上角漂移状态。
