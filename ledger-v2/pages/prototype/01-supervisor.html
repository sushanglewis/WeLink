function submitCurrent(){const i=activeItem();if(!i||!canSubmit(i))return;saveFields(i);const who=ROLE_NAMES[state.role];if(!i.validSubmittedRoles.includes(state.role))i.validSubmittedRoles.push(state.role);if(state.role==='supervisor'){i.follow='已审核';i.node='督办人已审核';i.assignee=null;i.events.unshift(`${who}逐项提交 · 已审核`)}else if(state.role==='handler'){i.follow='已填报';i.node='待督办人提交';i.assignee='supervisor';i.events.unshift(`${who}提交 · 待督办人提交`)}else if(state.role==='transfer'){i.follow='已填报';i.node='待经办人提交';i.assignee='handler';i.events.unshift(`${who}提交 · 待经办人提交`)}else{i.follow='已填报';i.node='待转办人提交';i.assignee='transfer';i.events.unshift(`${who}提交 · 待转办人提交`)}i.returnInfo=null;render();toast('提交成功，待办已转移')}
function openModal(type){state.modal=type;state.menuOpen=false;renderBatchMultiSelect();const i=activeItem(),b=activeBatch();$('#modalReason').hidden=type==='export';$('#modalReason').value='';if(type==='return'){const target=ROLE_NAMES[i.downstream]||'直接下游';$('#modalTitle').textContent='打回事项';$('#modalSummary').textContent=`将退回给${target}，原截止时间 ${b.deadline} 保持不变。`;$('#modalConfirm').disabled=true}else if(type==='withdraw'){$('#modalTitle').textContent='撤回事项';$('#modalSummary').textContent='撤回后锁定记录、移除下游待办，并解除本记录的 72 小时限制。';$('#modalConfirm').disabled=true}else{if(!exportState().ok)return;const s=selectedExportSummary();$('#modalTitle').textContent='多批次合并导出';$('#modalSummary').textContent=`将导出 ${s.batches} 个批次，共 ${s.total} 项；其中已撤回 ${s.withdrawn} 项不参与导出，实际导出并归档 ${s.actual} 项。导出即代表认可所选批次，并归档其中全部非撤回事项。`;$('#modalConfirm').disabled=false}$('#modal').classList.add('show')}
function confirmModal(){const i=activeItem();if(state.modal==='return'){const map={supervisor:['handler','待经办人处理'],handler:['transfer','待转办人处理'],transfer:['sub','待次转人处理']},m=map[state.role],round=(i.returnInfo?.round||0)+1,reason=$('#modalReason').value,actor=i.collaborators[state.role]||ROLE_NAMES[state.role],verb=state.role==='supervisor'?'打回':'继续打回';i.follow='跟进中';i.node=m[1];i.assignee=m[0];i.validSubmittedRoles=i.validSubmittedRoles.filter(role=>role!==m[0]);i.hasBeenReturned=true;i.returnInfo={round,actor,reason};i.events.unshift(`第 ${round} 次打回 · ${actor}${verb} · ${reason}`);toast(`已打回，${ROLE_NAMES[m[0]]}待办 +1`)}else if(state.modal==='withdraw'){i.withdrawnAssignee=i.assignee;i.withdrawn=true;i.assignee=null;i.events.unshift(`${ROLE_NAMES[state.role]}撤回 · ${$('#modalReason').value}`);toast('事项已撤回')}else{const summary=selectedExportSummary(),ids=[...state.selectedBatchIds];batches.filter(b=>ids.includes(b.id)).forEach(b=>b.items.filter(i=>!i.withdrawn).forEach(i=>{i.follow='已归档';i.node='归档';i.assignee=null;i.events.unshift('批次导出 · 已归档')}));state.selectedBatchIds=batches.filter(b=>!isBatchArchived(b)).map(b=>b.id);toast(`已导出并归档 ${summary.batches} 个批次，共 ${summary.total} 项；实际导出 ${summary.actual} 项，已撤回 ${summary.withdrawn} 项未导出`)}$('#modal').classList.remove('show');state.modal=null;render()}
$('#batchMultiSelect').onclick=()=>{state.menuOpen=!state.menuOpen;renderBatchMultiSelect()};$('#selectAllActive').onclick=()=>{state.selectedBatchIds=batches.filter(b=>!isBatchArchived(b)).map(b=>b.id);render()};$('#selectExportable').onclick=()=>{state.selectedBatchIds=batches.filter(isEligible).map(b=>b.id);render()};$('#clearBatchSelection').onclick=()=>{state.selectedBatchIds=[];render()};$('#prevCard').onclick=()=>switchCard(-1);$('#nextCard').onclick=()=>switchCard(1);const cardTrack=$('#cards');cardTrack.addEventListener('pointerdown',e=>{cardDrag.active=true;cardDrag.moved=false;cardDrag.captured=false;cardDrag.startX=e.clientX;cardDrag.scrollLeft=cardTrack.scrollLeft;cardTrack.classList.add('dragging')});cardTrack.addEventListener('pointermove',e=>{if(!cardDrag.active)return;const distance=e.clientX-cardDrag.startX;if(Math.abs(distance)>5){if(!cardDrag.captured){try{cardTrack.setPointerCapture(e.pointerId)}catch(_){}cardDrag.captured=true}cardDrag.moved=true;cardTrack.scrollLeft=cardDrag.scrollLeft-distance}});function endCardDrag(){if(!cardDrag.active)return;cardDrag.active=false;cardTrack.classList.remove('dragging');setTimeout(()=>{cardDrag.moved=false;cardDrag.captured=false},0)}cardTrack.addEventListener('pointerup',endCardDrag);cardTrack.addEventListener('pointercancel',endCardDrag);$('#expandBtn').onclick=e=>{$('#assignmentText').classList.toggle('open');e.target.textContent=$('#assignmentText').classList.contains('open')?'收起':'展开全部'};$('#submitBtn').onclick=submitCurrent;$('#returnBtn').onclick=()=>openModal('return');$('#withdrawBtn').onclick=()=>openModal('withdraw');$('#exportBtn').onclick=()=>openModal('export');$('#modalReason').oninput=()=>$('#modalConfirm').disabled=!$('#modalReason').value.trim();$('#modalCancel').onclick=()=>{$('#modal').classList.remove('show');state.modal=null};$('#modalConfirm').onclick=confirmModal;$('#transferBtn').onclick=()=>toast('转办人选择器将在此打开');function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}render();if(actionParam==='return'&&canReturn(activeItem()))openModal('return');
</script>
