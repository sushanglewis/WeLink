<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="doc-title" content="事项看板（EAIC 壳内）">
<meta name="nav-group" content="界面原型">
<meta name="doc-version" content="v0.7-proto">
<meta name="doc-uid" content="proto-shell-kanban">
<title>EAIC 原型 · 主界面 · 事项看板</title>
<link rel="stylesheet" href="../../assets/eaic/tokens.css">
<link rel="stylesheet" href="../../assets/eaic/base.css">
<link rel="stylesheet" href="../../assets/eaic/app.css">
<style>
/* 事项看板 WebView：真实 iframe 替代占位（.wv-body 去居中内边距） */
.wv-kanban iframe{width:100%;height:100%;border:0;display:block}
</style>
<style>
/* 龙小督待办事项徽标（D-41）：区别于未读红点的单一形态督办徽标 */
.sv-wrap{padding:14px 16px;display:flex;flex-direction:column;gap:2px;background:var(--bg,#F2F4F6);height:100%;overflow:auto}
.sv-row{display:flex;gap:12px;padding:12px 12px;border-radius:10px;cursor:pointer;align-items:center}
.sv-row:hover{background:rgba(0,0,0,.04)}
.sv-row.on{background:rgba(0,174,104,.08)}
.sv-av{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0}
.sv-main{flex:1;min-width:0}
.sv-top{display:flex;align-items:center;gap:8px}
.sv-name{font-size:13.5px;font-weight:600}
.sv-time{margin-left:auto;font-size:11.5px;color:var(--sub,#6B7280)}
.sv-preview{font-size:12.5px;color:var(--sub,#6B7280);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv-badge-unread{background:var(--error,#F53F3F);color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
.sv-sup{background:var(--brand-light,#E8F7F0);color:var(--brand-dark,#008D55);border:1px solid var(--brand,#00AE68);border-radius:10px;font-size:11px;padding:1px 8px;white-space:nowrap}
/* 龙小督双徽标（D-25）：红点=未读数、绿 pill=待办数（样式见 app.css 共享层） */
.sv-ava{position:relative}
</style>
</head>
<body>
<div class="window full" id="win"></div>
<script src="../../assets/eaic/js/data.js"></script>
<script src="../../assets/eaic/js/components.js"></script>
<script src="../../assets/eaic/js/proto.js"></script>
<script>
var ui = EAIC.ui;

var q = location.search || '?role=leader';
var kanbanSrc = 'kanban.html' + q;

function wvKanban() {
    return '<div class="wv wv-kanban"><div class="wv-body" style="padding:0;align-items:stretch;justify-content:stretch">'
        + '<iframe id="kanbanFrame" title="事项看板" src="' + kanbanSrc + '"></iframe>'
        + '</div></div>';
}

function svBadgeForRole(role){
    /* D-41 单一形态督办徽标「待处理事项 N」：N=当前节点归属人=该用户的未归档记录数（流转到他头上等待处理）；不做未读红点 */
    if(role==='jb')return {n:3};
    if(role==='zb')return {n:1};
    if(role==='czb')return {n:1};
    return {n:3};
}
function chatListDemo(role){
    var sup=svBadgeForRole(role||'leader');
    return '<div class="sv-wrap">'
        +'<div class="sv-row on"><div class="sv-av" style="background:#00AE68">督</div><div class="sv-main">'
        +'<div class="sv-top"><span class="sv-name">龙小督</span>'+(sup.n?'<span class="sv-sup" title="待处理事项：当前节点归属人=本人的未归档跟进记录数（推进中/已填报/逾期未填报，即流转到你头上等待处理/提交/查收导出的事项）">待处理事项 '+sup.n+'</span>':'')+'<span class="sv-time">09:12</span></div>'
        +'<div class="sv-preview">'+(sup.n?'你有 '+sup.n+' 项督办事项待处理：SJ2609041005 城区道路维修…':'暂无待处理督办事项')+'</div>'
        +'</div></div>'
        +'<div class="sv-row"><div class="sv-av" style="background:#5B6B7C">李</div><div class="sv-main">'
        +'<div class="sv-top"><span class="sv-name">李四</span><span class="sv-badge-unread">3</span><span class="sv-time">14:32</span></div>'
        +'<div class="sv-preview">周报模板我已经更新到 AI 表格里了…</div></div></div>'
        +'<div class="sv-row"><div class="sv-av" style="background:#8A63D2">产</div><div class="sv-main">'
        +'<div class="sv-top"><span class="sv-name">产品评审群</span><span class="sv-badge-unread">2</span><span class="sv-time">13:58</span></div>'
        +'<div class="sv-preview">王五：明天上午十点评审新版原型…</div></div></div>'
        +'<div style="padding:10px 12px;font-size:11.5px;color:var(--sub,#6B7280)">D-41 待办事项徽标（不做未读红点）：仅一种形态「待处理事项 N」，N=当前节点归属人=该用户的未归档跟进记录数（流转到该用户头上等待处理/提交/查收导出），所有人可见，点击直达会话并打开督办 panel；N=0 时不显示徽标。左侧功能菜单可收起为 icon bar（sidebar 底部 ⇤）。</div>'
        +'</div>';
}

var VIEW = (new URLSearchParams(location.search).get('view') || 'kanban');
var content = ui.frameMain(VIEW === 'chat' ? chatListDemo((new URLSearchParams(location.search).get('role') || 'leader')) : wvKanban(), {
    active: VIEW === 'chat' ? 'chat' : 'kanban',
    badge: EAIC.data.unreadTotal,
    base: '../'
});

EAIC.proto.mount(content);

/* 侧栏其它一级功能：原型占位（与主聊天页一致的 WebView 占位） */
document.querySelectorAll('.side-item').forEach(function (el) {
    var href = el.getAttribute('href') || '';
    if (href.indexOf('kanban') >= 0) {
        el.addEventListener('click', function (e) { e.preventDefault(); location.reload(); });
        return;
    }
    el.addEventListener('click', function (e) {
        e.preventDefault();
        var kind = href.match(/main\/(\w+)\.html/);
        kind = kind ? kind[1] : 'chat';
        document.querySelector('.app-main').innerHTML = (kind === 'chat')
            ? chatListDemo((new URLSearchParams(location.search).get('role') || 'leader'))
            : ui.wvPlaceholder(kind);
        document.querySelectorAll('.side-item').forEach(function (x) { x.classList.remove('active'); });
        el.classList.add('active');
    });
});
</script>
</body>
</html>
