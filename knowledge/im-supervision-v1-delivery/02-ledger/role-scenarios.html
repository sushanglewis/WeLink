> 角色与权限的唯一口径来源：操作映射矩阵（附件《事项状态-不同角色操作映射表》定稿）+ 场景闭环（对齐 D-29/D-30/D-31）。矩阵列＝节点状态（台账展示名，D-31），「待转办人审核/待经办人审核/待督办人审核」对应节点状态机「转办人审核中/经办人审核中/督办人审核中」（D-31 列表展示名：待转办人提交/待经办人提交/待督办人提交）。

## 1. 角色定义

| 角色 | 职责 | 交互主通道 |
|------|------|-----------|
| 督办人 | 下发督办任务、跟踪进展、完结标记（上级督办室线下同意后手动改事项状态=完结） | 龙小督 IM + 台账查收/导出视图 |
| 经办人 | 实际跟进任务，填报五要素 | 龙小督 IM + 台账填报 |
| 转办人 / 次级转办人 | 任务的最终执行者；转办人可再转，次级转办人为链路终点（D-8） | 龙小督 IM + 台账填报 |
| 领导 | 总览全部事项与进度风险 | GUI 只读总览（批示过问本期不做，D-17；办结审批线下，D-28） |

协作链：**督办人 → 经办人 →（转办人 → 次级转办人）**，最多三级。

**台账可见性原则（D-34）**：批次 > 事项 > 事项详情层级下，所有人可见所有**与自己有关**的批次、事项和事项详情；**仅可修改当前处理节点在自己头上**的督办事项（下表矩阵的操作列即按此原则展开）。

**责任链路（D-40）**：事项明细表单顶部展示该事项的责任链路「督办人 → 经办人 →（转办人 → 次级转办人）」；某事项无转办人（或无次级转办人）则不显示对应环节；转办后以实际接手人显示；各环节回显该人提交状态——经办人/转办人/次级转办人=已提交/未提交（跟进记录表三字段，D-42），督办人=已终审（归档）/待终审。

## 2. 操作映射矩阵（节点状态 × 角色）

**图例**：可直接操作 ｜ 仅可见/只读 ｜ 不可见。

| 角色＼节点状态 | 在库（未在跟进） | 待经办人处理 | 待转办人处理 | 待次级转办人填报 | 待转办人提交 | 待经办人提交 | 待督办人提交 |
|---|---|---|---|---|---|---|---|
| **督办人** | 上传事项 Excel 要求督办，激活该批事项（创建跟进记录，进入跟进状态=推进中） | 可直接填报提交（提交后经办/转办/次转不可再改） | 可直接填报提交（同上） | 可直接填报提交（同上） | 可直接提交（提交即代表经办人、转办人一并提交） | 可直接提交（同上） | 收到经办人填报通知：① 编辑表单内容 ② 下载 Excel |
| **经办人** | 仅可见本人历史被督办批次及事项；该批次已过完整生命周期（督办人审核并下载 Excel、该批跟进记录已归档）后不可修改编辑 | 收到督办通知，龙小督看板可见该批次下本人待处理事项：① 转办 ② 填报提交 | 可直接填报提交（提交后转办/次转不可再改） | 可直接填报提交（同上） | 可直接提交（提交即代表转办人一并提交） | 收到转办人填报通知：① 编辑表单内容 ② 提交 | 不可修改 |
| **转办人** | 同经办人（仅本人历史批次，归档后只读） | 不可见（经办人转办后才可见被转办事项） | 收到督办通知，看板可见本人待处理事项：① 转办（再转） ② 填报提交 | 可直接填报提交（提交后次转不可再改） | 收到次转人已提交通知：① 编辑表单内容 ② 提交 | 不可修改 | 不可修改 |
| **次级转办人** | 同经办人（仅本人历史批次，归档后只读） | 不可见 | 不可见（转办人再转后才可见） | 收到督办通知，看板可见本人待处理事项：① 填报提交（链路终点，无转办） | 不可修改 | 不可修改 | 不可修改 |

**映射规则（D-30/D-39 提炼）**：处理中状态＝转办（仅经办人/转办人）+ 填报提交；审核中状态＝编辑 + 提交（提交即审核）；上级可越级代提并跨状态直迁（督办人直提→归档、经办人代提→待督办人提交、转办人代提→待经办人提交，仅通知新节点归属人，序列图见 `submission-sequences.html`）；已归档与更高审核态一律只读；表单只含五要素、无批量操作。

## 3. 场景闭环（17 屏原型对照）

### 3.1 督办人（5 屏）

| 步骤 | 原型 | 场景 |
|------|------|------|
| S1 | `prototype/ledger-db-01.html` | 批次 DDL 到达 · 查收 |
| S2 | `prototype/ledger-db-02.html` | 直接修改 · 改评留痕 |
| S3 | `prototype/ledger-db-03.html` | 导出 Excel · 归档本批 |
| S4 | `prototype/ledger-db-04.html` | 逾期未填报 · 查收视图 |
| S5 | `prototype/ledger-db-05.html` | 全量批次浏览 · 节点全貌 |

闭环：任务下发双通道（D-32）——发送 Excel 或口头提供督办任务编号（仅限在库事项，不能新增）+ 自然语言描述反馈 DDL → 解析校验（失败行逐条反馈）→ 生成督办批次 → 启动督办（T1，经办人收通知）→ 跟踪进展（每次提交回执，可改评留痕）→ 批次 DDL 到达查收（可修改/润色，进度评价改评留痕）→ 导出 Excel 归档（T5，前置：批内全部跟进记录=已填报方可导出，否则入口置灰、直接修改/代录补正后再导；本轮关闭：该批次全部跟进记录变更为已归档（终态），节点状态同步归档）→ 完结/延期（线下同意后手动改事项状态=完结，或回改截止时间延期）。

### 3.2 经办人（6 屏）

| 步骤 | 原型 | 场景 |
|------|------|------|
| S1 | `prototype/ledger-jb-01.html` | 新批次待办 · 开始填报 |
| S2 | `prototype/ledger-jb-02.html` | 填报中 · 暂存与润色 |
| S3 | `prototype/ledger-jb-03.html` | 转办给转办人 |
| S4 | `prototype/ledger-jb-04.html` | 审核 · 再上报（提交即审核） |
| S5 | `prototype/ledger-jb-05.html` | 提交 · 必填校验 |
| S6 | `prototype/ledger-jb-06.html` | 逾期未填报 · 加急预警 |

闭环：收「N 项 + 批次 DDL」通知 + 表单卡片（下发即接收，D-1；消息列表徽标 +1）→ 逐条填报五要素（暂存/润色/NL 代填预填）→ 可转办（弹窗选人，责任转移）→ 提交（必填校验，报错「{编号} {字段}不能为空」）→ 该项转只读存档 + 提交存档消息可回看 → 转办人提交后收通知再上报（提交即审核）→ 督办人导出后收「本轮跟进已关闭」。批次 DDL 过点未填报收逾期未填报加急提醒（通知经办人+督办人，D-15）；事项级风险/逾期仅通知督办人、只在 GUI 看板标红，经办人台账面板不加急（D-44）。

### 3.3 转办人（4 屏）

| 步骤 | 原型 | 场景 |
|------|------|------|
| S1 | `prototype/ledger-zb-01.html` | 收转办待办 |
| S2 | `prototype/ledger-zb-02.html` | 填报提交 · 上报经办人审核 |
| S3 | `prototype/ledger-zb-03.html` | 再转次级转办人 |
| S4 | `prototype/ledger-zb-04.html` | 审核次转提交 · 再上报 |

闭环：经办人转办后收同款表单 → 填报提交（记录人=实际填报人）→ 可再转次级转办人（链路终点）→ 次转提交后收通知、查看内容再提交上报经办人。

### 3.4 次级转办人（2 屏）

| 步骤 | 原型 | 场景 |
|------|------|------|
| S1 | `prototype/ledger-czb-01.html` | 收再转待办 · 链路终点 |
| S2 | `prototype/ledger-czb-02.html` | 填报提交 · 上报转办人审核 |

闭环：转办人再转后收待办 → 填报提交（无转办按钮）→ 提交即上报转办人审核。

### 3.5 领导（GUI 只读，不在台账原型范围）

领导走 GUI 看板只读总览，见 `../04-gui-dashboard/`。批示过问本期不做（D-17）。

## 4. 消息列表督办待办徽标（D-41）

- 龙小督会话行督办待办徽标**仅一种形态、不做未读红点**：「**待处理事项 N**」，N=该用户在跟进记录表中**当前节点归属人=本人**的未归档跟进记录数（推进中/已填报/逾期未填报，即以其督办人/经办人/转办人/次级转办人任一角色**流转到他头上**、等待处理/提交/查收导出的事项；已填报待导出项归属督办人；由节点状态+归属人字段判定，D-38）；所有人可见，N=0 时不显示徽标（取代 D-36 黄/红两态设计）。
- 点击徽标直达龙小督会话并定位对应表单卡片。
- 原型见 `chat-list-badge.html`。
