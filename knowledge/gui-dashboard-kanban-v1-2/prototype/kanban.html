<style>
:root{
  --bg:#F2F4F6; --card:#FFFFFF; --line:#E5E8EB; --text:#171918; --sub:#6B7280; --sub3:#9CA3AF;
  --brand:#00AE68; --brand-dark:#008D55; --brand-light:#E8F7F0; --brand-line:#C9EBDA;
  --error:#F53F3F; --error-bg:#FDECEC; --error-dark:#CB2634;
  --warning:#F59E0B; --warning-bg:#FEF3E6; --warning-dark:#B45309;
  --info:#1677FF; --info-bg:#E8F1FF; --info-dark:#0958D9;
  --amber:#D4380D; --amber-bg:#FFF1E8; --amber-dark:#AD4E00;
  --surface-2:#F5F6F7;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:13px}
.metrics{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;padding:14px 20px 0}
.metric{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:default}
.metric .label{color:var(--sub);font-size:12px}
.metric .value{font-size:26px;font-weight:700;margin-top:4px}
.metric.warn .value{color:var(--error)} .metric.orange .value{color:var(--warning)} .metric.green .value{color:var(--brand)}
.metric.blue .value{color:var(--info)} .metric.amber .value{color:var(--amber)}
.filters{display:flex;gap:10px;padding:12px 20px;align-items:center;flex-wrap:wrap}
.filters .f{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--sub)}
.filters input{border:none;outline:none;font-size:12px;background:transparent;color:var(--text);font-family:inherit}
.table-wrap{margin:0 20px 20px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{width:100%;min-width:3000px;border-collapse:collapse}
th{background:var(--surface-2);color:var(--sub);font-weight:500;font-size:12px;padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--brand-dark)}
th .arrow{color:var(--brand);margin-left:4px;font-size:10px}
td{padding:11px 12px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
th:first-child,td:first-child{position:sticky;left:0;z-index:1}
th:first-child{z-index:2;background:var(--surface-2)}
td:first-child{background:var(--card)}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--brand-light)}
.badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11.5px}
.b-blue{background:var(--brand-light);color:var(--brand-dark)} .b-red{background:var(--error-bg);color:var(--error-dark)}
.b-orange{background:var(--warning-bg);color:var(--warning-dark)}
.b-green{background:var(--brand-light);color:var(--brand-dark)} .b-gray{background:#EDF0F2;color:var(--sub)}
.b-info{background:var(--info-bg);color:var(--info-dark)} .b-amber{background:#FFF7E6;color:var(--amber-dark)}
.warnrow td:first-child{border-left:3px solid var(--warning)}
.overdue td:first-child{border-left:3px solid var(--error)}
.msel{position:relative;display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-width:110px}
.msel .chip{background:var(--brand-light);color:var(--brand-dark);border-radius:6px;padding:1px 6px;font-size:11.5px;display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.msel .chip i{cursor:pointer;font-style:normal;opacity:.7}
.msel .chip i:hover{opacity:1}
.msel input{border:none;outline:none;font-size:12px;width:72px;background:transparent;color:var(--text);font-family:inherit}
.msel .sug{position:absolute;top:calc(100% + 4px);left:0;z-index:30;background:#fff;border:1px solid var(--line);border-radius:6px;max-height:180px;overflow:auto;min-width:180px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.msel .sug div{padding:5px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
.msel .sug div:hover{background:var(--brand-light)}
.ckgrp{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ckgrp label{display:inline-flex;gap:3px;align-items:center;font-size:12px;color:var(--text);cursor:pointer;white-space:nowrap}
.pager{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}
.pager .grp{display:flex;align-items:center;gap:6px}
.pager select{border:1px solid var(--line);border-radius:6px;padding:3px 4px;font-size:12px;font-family:inherit;background:#fff;color:var(--text)}
.pg-btn{border:1px solid var(--line);background:#fff;border-radius:6px;min-width:26px;height:24px;cursor:pointer;font-size:12px;color:var(--sub);font-family:inherit}
.pg-btn.on{border-color:var(--brand);color:var(--brand-dark);font-weight:600}
.pg-btn:disabled{opacity:.4;cursor:not-allowed}
.pg-btn:not(:disabled):hover{color:var(--brand-dark);border-color:var(--brand)}
.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;z-index:9}
.drawer{position:fixed;top:0;right:0;width:560px;height:100%;background:#fff;z-index:10;box-shadow:-4px 0 16px rgba(0,0,0,.12);display:none;flex-direction:column}
.drawer.open{display:flex} .drawer-mask.open{display:block}
.drawer-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:10px}
.drawer-head h2{font-size:15px} .drawer-head .close{margin-left:auto;cursor:pointer;color:var(--sub);font-size:18px;border:none;background:none}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px}
.sec-title{font-size:13px;font-weight:600;margin:14px 0 8px;color:var(--text)}
.sec-title:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:110px 1fr;row-gap:7px;font-size:12.5px}
.kv .k{color:var(--sub)}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:16px}
.tl-item{position:relative;padding-bottom:16px}
.tl-item::before{content:"";position:absolute;left:-22px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 2px var(--brand)}
.tl-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px;margin-bottom:5px}
.tl-right{display:flex;align-items:center;gap:5px;color:var(--sub);font-size:12px;white-space:nowrap}
.tl-right .tl-k{color:var(--sub3)}
.tl-right b{color:var(--text)}
.tl-roles{color:var(--sub);font-size:12px;margin-bottom:6px}
.tl-fields{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.7}
.tl-fields .fk{color:var(--sub);margin-top:4px} .tl-fields .fk:first-child{margin-top:0}
</style>
</head>

  {batch:"20260829160500",date:"2026-08-29",sup:"王督办",who:"陈刚（经办人）",jb:"陈刚",zb:"",czb:"",status:"归档",node:"归档",ev:"推进中",yjwc:"—",a:"完成项目建议书批复。",b:"无。",c:"办理规划选址。"}],
 "SJ2607010442":[

  {batch:"20260824110000",date:"2026-08-24",sup:"王督办",who:"张秋缘（经办人）",jb:"张秋缘",zb:"",czb:"",status:"归档",node:"归档",ev:"推进中",yjwc:"—",a:"完成资料收集和现场踏勘。",b:"无。",c:"启动规划初稿编制。"}],
 "SJ2607150330":[
  {batch:"20260720153000",date:"2026-07-20",sup:"王督办",who:"苏尚（经办人）",jb:"苏尚",zb:"",czb:"",status:"归档",node:"归档",ev:"已落实",yjwc:"2026-08-18",a:"已全部拆除并通过验收。",b:"无。",c:"—"}]
};
var COLS=[["idx","序号"],["no","任务编号"],["st1","标签"],["jbDate","交办时间"],["src","任务来源"],["yt","议题名称"],["matter","交办事项"],["jbContent","交办内容"],["ddl","完成时限"],["yjwc","预计完成时间"],["unit","责任单位"],["xb","协办单位"],["qjfzr","区级责任人"],["zyld","部门主要领导"],["fzr","部门责任人"],["ksfzr","科室责任人"],["jbTel","经办人及联系方式"],["fk1","部门反馈工作落实情况"],["fk2","部门反馈存在困难问题"],["fk3","部门反馈下一步工作计划"],["ev","进度评价"],["sx","事项类别"],["bk","板块分类"],["pl","督办频率"],["ps","领导批示"]];
var SX_TITLE="事项类别：A—上级重点工作 B—区级重点工作 C—其他重点工作";
var sortKey="jbDate",sortAsc=false;
var PG={size:20,page:1};
var st1Cls={"正常":"b-gray","风险":"b-orange","逾期":"b-red"};
var evCls={"推进中":"b-info","已落实":"b-green","已滞后":"b-amber"};
var statusCls={"推进中":"b-blue","已填报":"b-orange","逾期未填报":"b-red","归档":"b-gray"};
function latestFollow(t){
 var fs=FOLLOWS[t.no]||[];
 if(!fs.length)return null;
 var best=fs[0];
 for(var i=1;i<fs.length;i++){
  var f=fs[i];
  if(f.date>best.date||(f.date===best.date&&f.batch>best.batch))best=f;
 }
 return best;
}
function latestArchivedFK(t){
 var fs=(FOLLOWS[t.no]||[]).filter(function(f){return f.status==="归档"});
 if(!fs.length)return null;
 fs.sort(function(a,b){return a.date===b.date?(a.batch<b.batch?1:-1):(a.date<b.date?1:-1)});
 return fs[0];
}
var F={kw:"",unit:[],qjfzr:[],fzr:[],zg:[],db:[],jb:[],st1:["正常","风险","逾期"],banj:["未办结","已办结"],stEv:["推进中","已落实","已滞后"]};
var FILTER_DEF=[
 {key:"kw",label:"任务名称或编号",type:"kw"},
 {key:"unit",label:"责任单位",type:"fuzzy",opt:function(){return uniq(TASKS.map(function(t){return t.unit}))}},
 {key:"qjfzr",label:"区级责任人",type:"fuzzy",opt:function(){return uniq(TASKS.map(function(t){return t.qjfzr}))}},
 {key:"fzr",label:"部门责任人",type:"fuzzy",opt:function(){return uniq(TASKS.map(function(t){return t.fzr}))}},
 {key:"zg",label:"部门主管",type:"fuzzy",opt:function(){return uniq(TASKS.map(function(t){return t.ksfzr}))}},
 {key:"db",label:"督办人",type:"fuzzy",opt:function(){return uniq(TASKS.map(function(t){return t.db}).join(",").split(/[,，、]/))}},
 {key:"jb",label:"经办人",type:"fuzzy",opt:function(){return uniq(TASKS.map(function(t){return t.jb}))}},
 {key:"st1",label:"事项状态",type:"check",opt:function(){return ["正常","风险","逾期"]}},
 {key:"banj",label:"办结状态",type:"check",opt:function(){return ["未办结","已办结"]}},
 {key:"stEv",label:"进度评价",type:"check",opt:function(){return ["推进中","已落实","已滞后"]}}
];
function uniq(a){var r=[];a.forEach(function(v){v=(v||"").trim();if(v&&r.indexOf(v)<0)r.push(v)});return r}
function onFilterChange(){PG.page=1;render();}
function buildFilters(){
 var bar=document.getElementById("filterBar");
 bar.innerHTML=FILTER_DEF.map(function(d,i){
  if(d.type==="kw")return '<div class="f">'+d.label+' <input data-kw placeholder="关键词模糊搜索" style="width:140px"></div>';
  if(d.type==="fuzzy")return '<div class="f">'+d.label+' <span class="msel" id="msel_'+i+'"></span></div>';
  return '<div class="f">'+d.label+' <span class="ckgrp" data-i="'+i+'">'+d.opt().map(function(o){return '<label><input type="checkbox" checked value="'+o+'">'+o+'</label>'}).join("")+'</span></div>';
 }).join("");
 bar.querySelector('input[data-kw]').addEventListener("input",function(e){F.kw=e.target.value.trim();onFilterChange();});
 FILTER_DEF.forEach(function(d,i){
  if(d.type==="fuzzy"){
   var box=document.getElementById("msel_"+i);
   function draw(){
    box.innerHTML=F[d.key].map(function(v,vi){return '<span class="chip">'+v+'<i data-vi="'+vi+'">✕</i></span>'}).join("")
     +'<input placeholder="搜索添加">'+(box._sug&&box._sug.length?'<span class="sug">'+box._sug.map(function(o){return '<div>'+o+'</div>'}).join("")+'</span>':"");
   }
   box.addEventListener("input",function(e){
    if(e.target.tagName!=="INPUT")return;
    var q=e.target.value.trim();
    box._sug=q?d.opt().filter(function(o){return o.indexOf(q)>=0&&F[d.key].indexOf(o)<0}).slice(0,8):[];
    draw();var inp=box.querySelector("input");inp.value=q;inp.focus();
   });
   box.addEventListener("click",function(e){
    var item=e.target.closest(".sug div");
    if(item){F[d.key].push(item.textContent);box._sug=[];draw();onFilterChange();return;}
    var x=e.target.closest("i");
    if(x){F[d.key].splice(+x.getAttribute("data-vi"),1);draw();onFilterChange();}
   });
   draw();
  }else if(d.type==="check"){
   bar.querySelector('.ckgrp[data-i="'+i+'"]').addEventListener("change",function(){
    F[d.key]=Array.prototype.map.call(bar.querySelectorAll('.ckgrp[data-i="'+i+'"] input:checked'),function(c){return c.value});
    onFilterChange();
   });
  }
 });
}
function visibleTasks(){
 var rows=TASKS.slice();
 return rows.filter(function(x){
  if(F.kw&&x.name.indexOf(F.kw)<0&&x.no.indexOf(F.kw)<0)return false;
  if(F.unit.length&&F.unit.indexOf(x.unit)<0)return false;
  if(F.qjfzr.length&&F.qjfzr.indexOf(x.qjfzr)<0)return false;
  if(F.fzr.length&&F.fzr.indexOf(x.fzr)<0)return false;
  if(F.zg.length&&F.zg.indexOf(x.ksfzr)<0)return false;
  if(F.db.length&&!F.db.some(function(d){return x.db.indexOf(d)>=0}))return false;
  if(F.jb.length&&F.jb.indexOf(x.jb)<0)return false;
  if(F.st1.length<3&&F.st1.indexOf(x.st1)<0)return false;
  if(F.banj.length<2&&F.banj.indexOf(x.banj)<0)return false;
  if(F.stEv.length<3){var ar=latestArchivedFK(x);if(!ar||F.stEv.indexOf(ar.ev)<0)return false;}
  return true;
 }).sort(function(a,b){
  var va=sortVal(a,sortKey),vb=sortVal(b,sortKey);
  if(va==null||vb==null)return 0;
  if(typeof va==="number")return sortAsc?va-vb:vb-va;
  va=String(va);vb=String(vb);
  return sortAsc?(va<vb?-1:va>vb?1:0):(va<vb?1:va>vb?-1:0);
 });
}
function sortVal(x,k){
 if(k==="idx"||k==="fk1"||k==="fk2"||k==="fk3")return null;
 if(k==="st1")return {"正常":0,"风险":1,"逾期":2}[x.st1];
 if(k==="ev"){var a2=latestArchivedFK(x);return a2?{"推进中":0,"已落实":1,"已滞后":2}[a2.ev]:null;}
 if(k==="jbTel")return x.jb;
 return x[k];
}
function fmtBatch(b){return "批次 · "+b.slice(4,6)+"-"+b.slice(6,8)+" "+b.slice(8,10)+":"+b.slice(10,12);}
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function render(){
 var rows=visibleTasks();
 var cnt1=function(st){return TASKS.filter(function(x){return x.st1===st}).length};
 var cntEv=function(ev){return TASKS.filter(function(x){var f=latestFollow(x);return f&&f.ev===ev}).length};
 var m=[
  {l:"事项总数",v:TASKS.length,c:""},
  {l:"正常",v:cnt1("正常"),c:""},
  {l:"风险",v:cnt1("风险"),c:cnt1("风险")?"orange":""},
  {l:"逾期",v:cnt1("逾期"),c:cnt1("逾期")?"warn":""},
  {l:"推进中",v:cntEv("推进中"),c:"blue"},
  {l:"已落实",v:cntEv("已落实"),c:"green"},
  {l:"已滞后",v:cntEv("已滞后"),c:"amber"}];
 document.getElementById("metrics").innerHTML=m.map(function(x){return '<div class="metric '+x.c+'"><div class="label">'+x.l+'</div><div class="value">'+x.v+'</div></div>'}).join("");
 document.getElementById("theadRow").innerHTML=COLS.map(function(c){
  if(c[0]==="idx"||c[0]==="fk1"||c[0]==="fk2"||c[0]==="fk3")return '<th>'+c[1]+'</th>';
  var arrow=(sortKey===c[0])?('<span class="arrow">'+(sortAsc?"▲":"▼")+'</span>'):"";
  return '<th onclick="setSort(\''+c[0]+'\')">'+c[1]+arrow+'</th>';}).join("");
 var pages=Math.max(1,Math.ceil(rows.length/PG.size));
 if(PG.page>pages)PG.page=pages;
 var slice=rows.slice((PG.page-1)*PG.size,PG.page*PG.size);
 document.getElementById("tbody").innerHTML=slice.map(function(x,i){
  var rowCls=x.st1==="逾期"?"overdue":(x.st1==="风险"?"warnrow":"");
  var cells=COLS.map(function(c){
   if(c[0]==="idx")return '<td>'+((PG.page-1)*PG.size+i+1)+'</td>';
   if(c[0]==="st1")return '<td><span class="badge '+st1Cls[x.st1]+'">'+x.st1+'</span></td>';
   if(c[0]==="ev"){var ar2=latestArchivedFK(x);var ev2=ar2?ar2.ev:"—";return '<td><span class="badge '+(evCls[ev2]||"b-gray")+'">'+ev2+'</span></td>';}
   if(c[0]==="sx")return '<td title="'+SX_TITLE+'">'+esc(x.sx)+'</td>';
   if(c[0]==="jbTel")return '<td title="'+esc(x.jb+" "+x.jbTel)+'">'+esc(x.jb+" "+x.jbTel)+'</td>';
   if(c[0]==="fk1"||c[0]==="fk2"||c[0]==="fk3"){var ar=latestArchivedFK(x);var av=ar?ar[{fk1:"a",fk2:"b",fk3:"c"}[c[0]]]:"";var fv=(av&&av!=="—")?av:"—";return '<td title="'+esc(fv)+'">'+esc(fv)+'</td>';}
   var v=(x[c[0]]==null||x[c[0]]==="")?"—":String(x[c[0]]);
   return '<td title="'+esc(v)+'">'+esc(v)+'</td>';
 }).join("");
  return '<tr class="'+rowCls+'" onclick="openDrawer(\''+x.no+'\')">'+cells+'</tr>';}).join("");
 var pgBtns="";
 for(var pi=1;pi<=pages;pi++){pgBtns+='<button class="pg-btn '+(pi===PG.page?"on":"")+'" onclick="pgGo('+pi+')">'+pi+'</button>';}
 document.getElementById("pager").innerHTML='<div class="grp">共 '+rows.length+' 条</div><div class="grp"><select onchange="pgSize(this.value)">'+[10,20,30,50].map(function(n){return '<option value="'+n+'" '+(n===PG.size?"selected":"")+'>'+n+'</option>'}).join("")+'</select> 条/页</div><div class="grp"><button class="pg-btn" '+(PG.page<=1?"disabled":"")+' onclick="pgPrev()">‹</button>'+pgBtns+'<button class="pg-btn" '+(PG.page>=pages?"disabled":"")+' onclick="pgNext()">›</button></div>';
}
function pgSize(v){PG.size=+v;PG.page=1;render();}
function pgGo(p){PG.page=p;render();}
function pgPrev(){if(PG.page>1){PG.page--;render();}}
function pgNext(){PG.page++;render();}
function onFilter(){PG.page=1;render();}
function setSort(k){if(sortVal(TASKS[0],k)===null)return;if(sortKey===k){sortAsc=!sortAsc;}else{sortKey=k;sortAsc=true;}render();}

function openDrawer(no){
 var t=TASKS.find(function(x){return x.no===no});
 document.getElementById("dTitle").textContent=t.no+" "+t.name;
 document.getElementById("dSub").textContent=t.unit+" · 完成时限 "+t.ddl.slice(5)+" · 标签 "+t.st1;
 var fs=(FOLLOWS[no]||[]).slice().sort(function(a,b){return a.date===b.date?(a.batch<b.batch?1:-1):(a.date<b.date?1:-1)});
 document.getElementById("dBody").innerHTML=
  '<div class="sec-title">事项详情</div><div class="kv">'+
  '<div class="k">任务编号</div><div>'+t.no+'</div><div class="k">责任单位</div><div>'+t.unit+'</div>'+
  '<div class="k">经办人</div><div>'+t.jb+' '+t.jbTel+'</div>'+
  '<div class="k">交办时间</div><div>'+t.jbDate+'</div><div class="k">完成时限</div><div>'+t.ddl+'</div>'+
  '<div class="k">督办频率</div><div>'+t.pl+'</div><div class="k">事项类别</div><div title="'+SX_TITLE+'">'+t.sx+'</div>'+
  '<div class="k">领导批示</div><div style="color:var(--warning-dark)">'+(t.ps&&t.ps!=="—"?t.ps:"—")+'</div></div>'+
  '<div class="sec-title">跟进记录（按创建时间倒序 '+fs.length+' 条）</div>'+
  (fs.length?'<div class="timeline">'+
  fs.map(function(f){
   var fb=function(v){return (v&&v!=="—")?v:"—"};
   return '<div class="tl-item"><div class="tl-top">'
   +'<span class="tl-right"><span class="tl-k">跟进状态</span> <span class="badge '+(statusCls[f.status]||"b-gray")+'">'+f.status+'</span> <span>'+f.node+'</span><span class="tl-k">跟进日期</span> <b>'+f.date.slice(5)+'</b></span></div>'
   +'<div class="tl-roles">督办 '+f.sup+'　经办 '+(f.jb||"—")+'　转办 '+(f.zb||"—")+'　次级转办 '+(f.czb||"—")+'</div>'
   +'<div class="tl-fields"><div class="fk"><b>进度评价：</b><span class="badge '+evCls[f.ev]+'">'+f.ev+'</span>　<b>预计完成时间：</b>'+fb(f.yjwc)+'</div>'
   +'<div class="fk"><b>落实情况：</b>'+fb(f.a)+'</div><div class="fk"><b>困难问题：</b>'+fb(f.b)+'</div><div class="fk"><b>下一步计划：</b>'+fb(f.c)+'</div></div></div>'}).join("")+'</div>':'<div style="color:var(--sub);font-size:12px">暂无跟进记录</div>');
 document.getElementById("drawer").classList.add("open");
 document.getElementById("mask").classList.add("open");
}
function closeDrawer(){document.getElementById("drawer").classList.remove("open");document.getElementById("mask").classList.remove("open");}
buildFilters();
render();
</script>
