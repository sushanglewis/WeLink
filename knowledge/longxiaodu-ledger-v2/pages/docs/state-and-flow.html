## 总览

事项在责任链 `督办人 → 经办人 → 转办人 → 次级转办人` 上流转，由两套正交状态描述：

- **事项跟进状态**（卡片右上）：记录在本轮跟进生命周期中的完成程度，共七值。
- **事项节点状态**（卡片左下）：记录当前应由哪个角色处理或审核，共九值（含已撤回）。

两套状态独立变化：提交与打回按规则联动两套状态；撤回使两套状态同时进入「已撤回」终态（节点状态在卡片左下显示「督办人已撤回」），撤回前的跟进与节点取值保留供回看。

## 事项跟进状态机

`跟进中 / 已退回 / 已填报 / 已审核 / 已归档 / 逾期未填报 / 已撤回`

| 状态 | 含义 | 进入条件 | 退出方式 |
|---|---|---|---|
| 跟进中 | 正在填报 | 批次下发；任一下游提交前 | 下游有效提交 → 已填报；超过填报截止时间仍未有效提交 → 逾期未填报；督办人撤回 → 已撤回 |
| 已退回 | 已被上游打回，等待下游重新提交 | 任一级打回（直接下游及其更下游退出有效提交集合） | 下游重新提交 → 已填报；超过填报截止时间仍未重新提交 → 逾期未填报；督办人撤回 → 已撤回 |
| 已填报 | 已有下游内容提交到当前处理人 | 直接下游有效提交 | 当前处理人提交 → 已审核；被打回 → 已退回；督办人撤回 → 已撤回 |
| 已审核 | 督办人已逐项认可 | 督办人提交 | 批次导出 → 已归档；督办人撤回 → 已撤回 |
| 逾期未填报 | 已过填报截止时间仍需填报或重填 | 超过填报截止时间且未有效提交（含已退回后超时未重新提交） | 重新提交 → 已填报；批次导出 → 已归档；督办人撤回 → 已撤回 |
| 已归档 | 本轮跟进关闭 | 所属批次导出成功 | 终态，仅可查看 |
| 已撤回 | 督办人撤回该记录 | 督办人在归档前撤回 | 终态；记录不参与导出、不产生待办，表单锁定 |

UML 状态图：圆角节点为跟进状态，`[*]` 为本轮起点/终点；箭头标注业务操作，括注为操作主体（协作角色 / 督办人 / 系统·填报截止时间）。

```mermaid
stateDiagram-v2

    s1: 跟进中
    s2: 已填报
    s3: 已审核
    s4: 逾期未填报
    s5: 已归档
    s6: 已撤回
    s7: 已退回
    [*] --> s1: 批次下发
    s1 --> s2: 下游有效提交（协作角色）
    s1 --> s4: 超时未有效提交（系统·填报截止时间）
    s1 --> s6: 撤回（督办人）
    s2 --> s7: 任一级打回（协作角色）
    s7 --> s2: 下游重新提交（协作角色）
    s7 --> s4: 超时未重新提交（系统·填报截止时间）
    s7 --> s6: 撤回（督办人）
    s2 --> s3: 逐项审核提交（督办人）
    s2 --> s6: 撤回（督办人）
    s3 --> s5: 批次导出（督办人）
    s3 --> s6: 撤回（督办人）
    s4 --> s2: 重新提交（协作角色）
    s4 --> s5: 批次导出（督办人）
    s4 --> s6: 撤回（督办人）
    s5 --> [*]
    s6 --> [*]
```

## 事项节点状态机

`待经办人处理 / 待转办人处理 / 待次级转办人处理 / 待转办人提交 / 待经办人提交 / 待督办人审核 / 督办人已审核 / 归档 / 已撤回`

| 状态 | 当前动作承担人 | 含义 |
|---|---|---|
| 待经办人处理 | 经办人 | 需经办人填报或转办，或经办人收到打回后修改重填 |
| 待转办人处理 | 转办人 | 需转办人填报或再转办，或转办人收到打回后修改重填 |
| 待次级转办人处理 | 次级转办人 | 需次级转办人填报，或其收到打回后修改重填 |
| 待转办人提交 | 转办人 | 次级转办人已提交，等待转办人审核并提交或打回 |
| 待经办人提交 | 经办人 | 转办人已提交，等待经办人审核并提交或打回 |
| 待督办人审核 | 督办人 | 经办人已提交，等待督办人逐项审核并提交或打回 |
| 督办人已审核 | 无 | 督办人已逐项认可，等待批次导出 |
| 归档 | 无 | 批次导出后关闭 |
| 已撤回 | 无 | 督办人已撤回该记录，终态；撤回前节点保留供回看 |

## 角色操作对状态机的影响

### 督办人

| 操作 | 前置条件 | 跟进状态 | 节点状态 | 其他影响 |
|---|---|---|---|---|
| 下发批次 | — | 新建记录为跟进中 | 待经办人处理 | 生成协作者与填报截止时间；各协作者为未提交灰态 |
| 提交 | 待督办人审核 | 已填报 → 已审核 | 待督办人审核 → 督办人已审核 | 督办人加入有效提交链；无当前处理人 |
| 打回 | 待督办人审核 | 已填报 → 已退回（超过填报截止时间仍未重新提交 → 逾期未填报） | 待督办人审核 → 待经办人处理 | 移除经办人及其更下游的有效提交（临近下游转黄、更下游转灰）；`hasBeenReturned` 永久为真 |
| 撤回 | 未归档 | → 已撤回 | → 已撤回（卡片左下显示「督办人已撤回」，撤回前节点保留供回看） | 锁定表单、移除待办、不参与导出 |
| 导出批次 | 所选批次全部有效事项为已填报/已审核 | 有效事项 → 已归档；撤回事项保持已撤回 | → 归档 | 批次关闭；已撤回事项不参与导出 |

### 经办人

| 操作 | 前置条件 | 跟进状态 | 节点状态 | 其他影响 |
|---|---|---|---|---|
| 转办 | 待经办人处理，且事项从未被打回 | 不变 | 待经办人处理 → 待转办人处理 | 生成转办人协作者；一旦发生打回，转办永久禁用 |
| 填报并提交 | 待经办人处理 | 跟进中 → 已填报 | → 待督办人审核 | 经办人加入有效提交链；当前处理人变为督办人 |
| 打回转办人 | 收到打回（待经办人处理）且有直接下游 | 已填报 → 已退回 | 待经办人处理 → 待转办人处理 | 移除转办人有效提交；原因必填留痕 |
| 再次提交 | 收到打回后修改完成 | 已退回 → 已填报 | → 待督办人审核 | 重新加入有效提交链 |

### 转办人

| 操作 | 前置条件 | 跟进状态 | 节点状态 | 其他影响 |
|---|---|---|---|---|
| 再转办 | 待转办人处理，且事项从未被打回 | 不变 | 待转办人处理 → 待次级转办人处理 | 生成次级转办人协作者；一旦发生打回，再转办永久禁用 |
| 填报并提交 | 待转办人处理 | 不变（上游已是已填报） | → 待经办人提交 | 转办人加入有效提交链；当前处理人变为经办人 |
| 打回次级转办人 | 收到打回（待转办人处理）且有直接下游 | 已填报 → 已退回 | 待转办人处理 → 待次级转办人处理 | 移除次级转办人有效提交；原因必填留痕 |
| 再次提交 | 收到打回后修改完成 | 已退回 → 已填报 | → 待经办人提交 | 重新加入有效提交链 |

### 次级转办人

| 操作 | 前置条件 | 跟进状态 | 节点状态 | 其他影响 |
|---|---|---|---|---|
| 填报并提交 | 待次级转办人处理 | 跟进中 → 已填报 | → 待转办人提交 | 次级转办人加入有效提交链；当前处理人变为转办人 |
| 再次提交 | 收到打回后修改完成 | 已退回 → 已填报 | → 待转办人提交 | 重新加入有效提交链 |

次级转办人是责任链末端：不可转办、不可打回。

## 协作者角标与状态联动

- **当前处理人**：头像右下黄色圆点，对应节点状态的当前承担人。
- **有效已提交**：头像右下绿色圆点白勾，对应有效提交链 `validSubmittedRoles` 中的角色。
- **未提交或提交已失效**：灰色圆点；打回时被退回节点及其更下游全部移出有效提交集合（被打回人转为当前处理人显示黄色，更下游显示灰色）。
- **角色缺失**：显示「—」且无角标。

## 不变量

- 节点状态的当前承担人与协作者面板黄色角标始终一致。
- 打回将被打回节点及其更下游全部移出有效提交集合：临近下游转黄、更下游转灰。
- `hasBeenReturned` 一旦发生不可逆；经办人、转办人的转办入口随之永久隐藏。
- 已审核和归档无黄色当前处理人；已撤回保留撤回前的协作者状态供回看。
- 撤回事项始终显示「已撤回 / 督办人已撤回」，不参加导出与待办计数。
