function exportFileName(){const chosen=selectedBatches();if(!chosen.length)return'';const latest=[...chosen].sort((a,b)=>b.deadline.localeCompare(a.deadline)||b.name.localeCompare(a.name))[0];return (latest.alias||('督办台账_'+latest.name))+'.xlsx'}
function renderBatchMultiSelect(){const chosen=selectedBatches();$('#batchMultiSelect').textContent=chosen.length?`已选 ${chosen.length} 个批次`:'请选择批次';$('#batchMultiSelect').setAttribute('aria-expanded',state.menuOpen?'true':'false');$('#batchMenu').hidden=!state.menuOpen;$('#batchOptions').innerHTML=batches.map(b=>{const c=batchCounts(b),status=batchStatus(b),label=status==='ready'?'可导出':status==='archived'?'已归档 · 可再导出':'暂不可导出';return`<label class="batch-option" data-bid="${b.id}" data-status="${status}"><input type="checkbox" class="batch-option-check" data-bid="${b.id}" ${state.selectedBatchIds.includes(b.id)?'checked':''}><span class="batch-option-main"><b>${b.name}</b>${b.alias?`<em class="batch-alias">「${b.alias}」</em>`:''}${state.role==='supervisor'?`<button class="alias-btn" data-bid="${b.id}" title="设置批次别名">别名</button>`:''}<small>总数 ${c.total} 项 · 跟进中 ${c['跟进中']} 项 · 已退回 ${c['已退回']} 项 · 已填报 ${c['已填报']} 项 · 已审核 ${c['已审核']} 项 · 已归档 ${c['已归档']} 项 · 逾期未填报 ${c['逾期未填报']} 项 · 已撤回 ${c['已撤回']} 项 · 需处理 ${c.pending} 项</small></span><span class="batch-result ${status==='ready'?'ok':status==='archived'?'archived':'no'}">${label}</span></label>`}).join('');$$('.batch-option-check').forEach(input=>input.onchange=()=>{const id=input.dataset.bid;if(input.checked&&!state.selectedBatchIds.includes(id))state.selectedBatchIds.push(id);if(!input.checked)state.selectedBatchIds=state.selectedBatchIds.filter(x=>x!==id);ensureActiveRecord();render()});$$('.alias-btn').forEach(btn=>btn.onclick=e=>{e.preventDefault();const b=batches.find(x=>x.id===btn.dataset.bid),v=prompt('设置批次别名（仅用于展示和导出命名，不改变批次编号；留空则清除）',b.alias||'');if(v===null)return;b.alias=v.trim()||null;renderBatchMultiSelect();toast(b.alias?'批次别名已保存':'批次别名已清除')})}
function renderCards(){const rows=visibleItems();let selectedIndex=rows.findIndex(x=>x.item.id===state.recordId);if(selectedIndex<0)selectedIndex=0;$('#pager').textContent=rows.length?`${selectedIndex+1}/${rows.length}`:'0/0';$('#prevCard').disabled=!rows.length||selectedIndex===0;$('#nextCard').disabled=!rows.length||selectedIndex===rows.length-1;$('#cards').innerHTML=rows.length?rows.map(({item,batch},noteIdx)=>`<button class="card ${item.id===state.recordId?'on':''}" data-rid="${item.id}"><span class="card-deadline">截止 ${batch.deadline}</span><span class="card-code">${item.code}</span><span class="card-note" data-note="原型模拟场景：${item.scene}" aria-label="原型模拟场景：${item.scene}">${noteIdx+1}</span><span class="follow ${statusClass(item.follow)}">${item.follow}</span><h3>${item.title}</h3><span class="node ${nodeClass(item.node)}" title="事项节点状态">${item.node==='已撤回'?'督办人已撤回':item.node+(item.assignee&&item.collaborators[item.assignee]?` · <b class="node-name">${item.collaborators[item.assignee]}</b>`:'')}</span></button>`).join(''):'<div class="empty">请选择批次查看事项</div>';$$('.card').forEach(c=>c.onclick=()=>{if(cardDrag.moved)return;state.recordId=c.dataset.rid;render()});requestAnimationFrame(()=>$('#cards .card.on')?.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'}))}
function renderMeta(){const chosen=selectedBatches(),items=chosen.flatMap(b=>b.items),withdrawn=items.filter(i=>i.follow==='已撤回').length,returned=items.filter(i=>i.follow!=='已撤回'&&i.follow==='已退回').length,filled=items.filter(i=>i.follow!=='已撤回'&&i.follow==='已填报').length,reviewed=items.filter(i=>i.follow!=='已撤回'&&i.follow==='已审核').length,pending=items.length-withdrawn-returned-filled-reviewed;$('#issueDate').textContent=chosen.length?`所选批次：${chosen.length} 个`:'未选择批次';$('#deadline').textContent=chosen.length?`截止范围：${chosen.map(b=>b.deadline).sort()[0]} 至 ${chosen.map(b=>b.deadline).sort().at(-1)}`:'';$('#batchCounts').textContent=`共 ${items.length} 项 · 已撤回 ${withdrawn} 项 · 已退回 ${returned} 项 · 已填报 ${filled} 项 · 已审核 ${reviewed} 项 · 待处理 ${pending} 项`;const status=exportState();$('#exportBtn').disabled=!status.ok;$('#exportBlockReason').textContent=status.reason;$('#exportBlockReason').classList.toggle('ready',status.ok)}
function collaboratorStatus(i,role){if(!i.collaborators[role])return'missing';if((i.follow==='已撤回'?i.withdrawnAssignee:i.assignee)===role)return'pending';if(i.validSubmittedRoles.includes(role))return'submitted';return'inactive'}
function renderCollaborators(i){const labels={supervisor:'督办人',handler:'经办人',transfer:'转办人',sub:'次级转办人'};$('#collaborators').innerHTML=Object.entries(labels).map(([role,label])=>{const name=i.collaborators[role],status=collaboratorStatus(i,role),mark=status==='submitted'?'✓':'';return`<div class="person" data-role="${role}" data-status="${status}"><div class="avatar">${name?name[0]:'—'}${status==='missing'?'':`<span class="collaborator-status ${status}" aria-label="${status==='pending'?'待处理':status==='submitted'?'已提交':'未提交或提交已失效'}">${mark}</span>`}</div><div><b>${name||'—'}</b><small>${label}${status==='pending'?' · 当前处理':''}</small></div></div>`}).join('')}
const FLOW_FIELD_LABELS=[['implementation','部门反馈工作落实情况'],['difficulties','部门反馈存在困难问题'],['nextPlan','部门反馈下一步工作计划'],['date','预计完成时间']];function flowEntryHtml(e){const op=e.round?`第 ${e.round} 次打回`:e.op,warn=e.op==='打回'||e.op==='撤回',noteLabel=e.op==='打回'?'打回原因':e.op==='撤回'?'撤回说明':'评论',note=e.note?`<div class="flow-note">${noteLabel}：${e.note}</div>`:'',content=e.content?`<details class="flow-content"><summary>提交内容</summary><div class="flow-fields">${FLOW_FIELD_LABELS.map(([k,l])=>`<div class="flow-field"><label>${l}</label><p>${e.content[k]||'—'}</p></div>`).join('')}</div></details>`:'';return `<div class="flow-entry"><div class="flow-head"><b class="flow-who">${e.who}</b><span class="flow-role">${e.role}</span><span class="flow-op${warn?' warn':''}">${op}</span><span class="flow-time">${e.t}</span></div>${content}${note}</div>`}
function renderDetail(){const i=activeItem();if(!i){$('#detail').hidden=true;$('#withdrawBtn').hidden=true;$('#returnBtn').hidden=true;$('#submitBtn').hidden=true;$('#saveBtn').hidden=true;$('#transferBtn').hidden=true;$('#actionNote').textContent='请选择批次和事项';return}$('#detail').hidden=false;$('#detailTitle').textContent=i.title;$('#detailFollow').textContent=i.follow;$('#detailFollow').className=`detail-status ${statusClass(i.follow)}`;$('#followChip').textContent=`事项跟进状态 · ${i.follow}`;$('#detailNode').textContent=i.follow==='已撤回'?'撤回前：'+(i.prevNode||'—'):i.node;$('#assignmentText').textContent=i.content||'暂无交办内容';$('#assignmentText').classList.remove('open');$('#expandBtn').textContent='展开全部';renderCollaborators(i);const locked=i.follow==='已撤回'||i.follow==='已归档'||i.node==='督办人已审核';const d=readDraft(i);if(d){$('#implementation').value=d.implementation;$('#difficulties').value=d.difficulties;$('#nextPlan').value=d.nextPlan;$('#expectedDate').value=d.date}else{$('#implementation').value=i.fields.implementation;$('#difficulties').value=i.fields.difficulties;$('#nextPlan').value=i.fields.nextPlan;$('#expectedDate').value=i.fields.date}$('#saveState').textContent=d?'已保存 '+fmtHM(d.t):(locked?'':'未保存');['#implementation','#difficulties','#nextPlan','#expectedDate'].forEach(s=>$(s).disabled=locked);$('#flowList').innerHTML=i.events.map(flowEntryHtml).join('');renderActions(i)}
function canReturn(i){const reviewing=(state.role==='supervisor'&&i.node==='待督办人审核')||(state.role==='handler'&&i.node==='待经办人提交')||(state.role==='transfer'&&i.node==='待转办人提交');const receivedReturn=['handler','transfer'].includes(state.role)&&i.assignee===state.role&&Boolean(i.returnInfo)&&Boolean(i.downstream);return i.follow!=='已撤回'&&(reviewing||receivedReturn)}
function canSubmit(i){return i.follow!=='已撤回'&&i.follow!=='已归档'&&(i.assignee===state.role||canReturn(i))}
function renderActions(i){$('#saveBtn').hidden=formLocked();$('#withdrawBtn').hidden=state.role!=='supervisor'||i.follow==='已撤回'||i.follow==='已归档'||i.follow==='已审核';$('#returnBtn').hidden=!canReturn(i);$('#submitBtn').hidden=!canSubmit(i);$('#transferBtn').hidden=!(i.follow!=='已撤回'&&!i.hasBeenReturned&&i.assignee===state.role&&['handler','transfer'].includes(state.role)&&i.node.includes('处理'));$('#actionNote').textContent=i.follow==='已撤回'?'事项已撤回，仅可查看历史':i.follow==='已归档'?'事项已归档':state.role==='supervisor'?'提交即逐项审核；导出即认可并归档批次。':i.hasBeenReturned?'打回后的任务不可再次转办；可修改后提交，或继续打回既有下游。':'提交即认可当前内容并向上流转。'}
function ensureActiveRecord(){const rows=visibleItems();if(!rows.some(x=>x.item.id===state.recordId))state.recordId=rows[0]?.item.id||null}
function render(){ensureActiveRecord();renderBatchMultiSelect();renderMeta();renderCards();renderDetail();const n=pendingCount(state.role);$('#todoCount').textContent=`${n}项待办`;$('#chatPreview').textContent=n?`你有 ${n} 项督办事项待处理`:'当前暂无待办';const me=activeItem();$('#userAvatar').textContent=(me?.collaborators[state.role]||ROLE_FALLBACK[state.role]||'—')[0]}
function switchCard(delta){const rows=visibleItems();if(!rows.length)return;let index=rows.findIndex(x=>x.item.id===state.recordId);index=Math.max(0,Math.min(rows.length-1,(index<0?0:index)+delta));state.recordId=rows[index].item.id;render()}
function saveFields(i){i.fields={implementation:$('#implementation').value,difficulties:$('#difficulties').value,nextPlan:$('#nextPlan').value,date:$('#expectedDate').value}}
function currentUser(){const i=activeItem();return (i&&i.collaborators[state.role])||ROLE_FALLBACK[state.role]||'—'}
function draftKey(i){const b=batches.find(x=>x.items.some(r=>r.id===i.id));return 'draft:'+currentUser()+':'+(b?b.name:'')+':'+i.code}
function readDraft(i){try{return JSON.parse(localStorage.getItem(draftKey(i))||'null')}catch(e){return null}}
function formLocked(){const i=activeItem();return !i||i.follow==='已撤回'||i.follow==='已归档'||i.node==='督办人已审核'}
function fmtHM(t){const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')}
function saveDraft(){if(formLocked())return;const i=activeItem();try{localStorage.setItem(draftKey(i),JSON.stringify({implementation:$('#implementation').value,difficulties:$('#difficulties').value,nextPlan:$('#nextPlan').value,date:$('#expectedDate').value,t:Date.now()}))}catch(e){}$('#saveState').textContent='已保存 '+fmtHM(Date.now())}
function submitCurrent(){const i=activeItem();if(!i||!canSubmit(i))return;saveFields(i);const who=i.collaborators[state.role]||ROLE_NAMES[state.role];const snapshot={implementation:$('#implementation').value,difficulties:$('#difficulties').value,nextPlan:$('#nextPlan').value,date:$('#expectedDate').value};i.events.unshift({t:nowStamp(),who,role:ROLE_NAMES[state.role],op:'提交',note:'',content:snapshot});if(!i.validSubmittedRoles.includes(state.role))i.validSubmittedRoles.push(state.role);if(state.role==='supervisor'){i.follow='已审核';i.node='督办人已审核';i.assignee=null;}else if(state.role==='handler'){i.follow='已填报';i.node='待督办人审核';i.assignee='supervisor';}else if(state.role==='transfer'){i.follow='已填报';i.node='待经办人提交';i.assignee='handler';}else{i.follow='已填报';i.node='待转办人提交';i.assignee='transfer';}i.returnInfo=null;render();toast('提交成功，待办已转移')}
function openModal(type){state.modal=type;state.menuOpen=false;renderBatchMultiSelect();const i=activeItem(),b=activeBatch();$('#modalReason').hidden=type==='export';$('#modalReason').value='';if(type==='return'){const target=ROLE_NAMES[i.downstream]||'直接下游';$('#modalTitle').textContent='打回事项';$('#modalSummary').textContent=`将退回给${target}，原截止时间 ${b.deadline} 保持不变。`;$('#modalConfirm').disabled=true}else if(type==='withdraw'){$('#modalTitle').textContent='撤回事项';$('#modalSummary').textContent='撤回后锁定记录、移除下游待办，并解除本记录的 72 小时限制。';$('#modalConfirm').disabled=true}else{if(!exportState().ok)return;const s=selectedExportSummary();$('#modalTitle').textContent='多批次合并导出';$('#modalSummary').textContent=`文件名：${exportFileName()}（取所选最新批次的别名，无别名时使用默认命名）。将导出 ${s.batches} 个批次，共 ${s.total} 项；其中已撤回 ${s.withdrawn} 项不参与导出，实际导出 ${s.actual} 项（含已归档 ${s.already} 项仅重新导出、不重复归档）。导出即代表认可所选批次，并归档其中未归档的非撤回事项。`;$('#modalConfirm').disabled=false}$('#modal').classList.add('show')}
function confirmModal(){const i=activeItem();if(state.modal==='return'){const map={supervisor:['handler','待经办人处理'],handler:['transfer','待转办人处理'],transfer:['sub','待次级转办人处理']},m=map[state.role],round=(i.returnInfo?.round||0)+1,reason=$('#modalReason').value,actor=i.collaborators[state.role]||ROLE_NAMES[state.role],verb=state.role==='supervisor'?'打回':'继续打回';i.follow='已退回';i.node=m[1];i.assignee=m[0];const chain=['supervisor','handler','transfer','sub'],cutIdx=chain.indexOf(m[0]);i.validSubmittedRoles=i.validSubmittedRoles.filter(role=>chain.indexOf(role)<cutIdx);i.hasBeenReturned=true;i.returnInfo={round,actor,reason};i.events.unshift({t:nowStamp(),who:actor,role:ROLE_NAMES[state.role],op:'打回',round,note:reason,content:null});toast(`已打回，${ROLE_NAMES[m[0]]}待办 +1`)}else if(state.modal==='withdraw'){i.withdrawnAssignee=i.assignee;i.prevFollow=i.follow;i.prevNode=i.node;i.follow='已撤回';i.node='已撤回';i.assignee=null;const wReason=$('#modalReason').value,wActor=i.collaborators[state.role]||ROLE_NAMES[state.role];i.events.unshift({t:nowStamp(),who:wActor,role:ROLE_NAMES[state.role],op:'撤回',note:wReason,content:null});toast('事项已撤回')}else{const summary=selectedExportSummary(),ids=[...state.selectedBatchIds];let newly=0;batches.filter(b=>ids.includes(b.id)).forEach(b=>b.items.filter(i=>i.follow!=='已撤回').forEach(i=>{if(i.follow!=='已归档'){i.follow='已归档';i.node='归档';i.assignee=null;newly++;i.events.unshift({t:nowStamp(),who:i.collaborators.supervisor||'督办人',role:'督办人',op:'导出归档',note:'',content:null})}}));state.selectedBatchIds=batches.filter(b=>!isBatchArchived(b)).map(b=>b.id);toast(`已导出 ${summary.batches} 个批次，共 ${summary.total} 项；实际导出 ${summary.actual} 项（新归档 ${newly} 项，已撤回 ${summary.withdrawn} 项未导出；文件：${exportFileName()}`)}$('#modal').classList.remove('show');state.modal=null;render()}
$('#batchMultiSelect').onclick=()=>{state.menuOpen=!state.menuOpen;renderBatchMultiSelect()};$('#selectAllActive').onclick=()=>{state.selectedBatchIds=batches.filter(b=>!isBatchArchived(b)).map(b=>b.id);render()};$('#selectExportable').onclick=()=>{state.selectedBatchIds=batches.filter(isEligible).map(b=>b.id);render()};$('#clearBatchSelection').onclick=()=>{state.selectedBatchIds=[];render()};$('#prevCard').onclick=()=>switchCard(-1);$('#nextCard').onclick=()=>switchCard(1);const cardTrack=$('#cards');cardTrack.addEventListener('pointerdown',e=>{cardDrag.active=true;cardDrag.moved=false;cardDrag.captured=false;cardDrag.startX=e.clientX;cardDrag.scrollLeft=cardTrack.scrollLeft;cardTrack.classList.add('dragging')});cardTrack.addEventListener('pointermove',e=>{if(!cardDrag.active)return;const distance=e.clientX-cardDrag.startX;if(Math.abs(distance)>5){if(!cardDrag.captured){try{cardTrack.setPointerCapture(e.pointerId)}catch(_){}cardDrag.captured=true}cardDrag.moved=true;cardTrack.scrollLeft=cardDrag.scrollLeft-distance}});function endCardDrag(){if(!cardDrag.active)return;cardDrag.active=false;cardTrack.classList.remove('dragging');setTimeout(()=>{cardDrag.moved=false;cardDrag.captured=false},0)}cardTrack.addEventListener('pointerup',endCardDrag);cardTrack.addEventListener('pointercancel',endCardDrag);$('#expandBtn').onclick=e=>{$('#assignmentText').classList.toggle('open');e.target.textContent=$('#assignmentText').classList.contains('open')?'收起':'展开全部'};$('#submitBtn').onclick=submitCurrent;$('#saveBtn').onclick=()=>{if(formLocked()){toast('当前记录不可编辑');return}saveDraft();toast('填报内容已保存')};setInterval(()=>{if(!formLocked())saveDraft()},3000);$('#returnBtn').onclick=()=>openModal('return');$('#withdrawBtn').onclick=()=>openModal('withdraw');$('#exportBtn').onclick=()=>openModal('export');$('#modalReason').oninput=()=>$('#modalConfirm').disabled=!$('#modalReason').value.trim();$('#modalCancel').onclick=()=>{$('#modal').classList.remove('show');state.modal=null};$('#modalConfirm').onclick=confirmModal;$('#transferBtn').onclick=()=>toast('转办人选择器将在此打开');function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}render();
</script>
