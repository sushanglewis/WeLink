# 需求文档: 2026-08-24-issue-17

<!-- status: draft -->

> 2026-09-03 整合 2026-09-02 领导会议纪要后修订范围与版本规划，待 PM 重新确认。

## 背景

- Issue: #17
- 访谈摘要: `issue-17/interviews/2026-08-24-issue-17/summary.md`
- 会议纪要（2026-09-02）: `issue-17/interviews/2026-09-02-roadmap-meeting/summary.md`
- 来源：GitHub Issue [#17](https://github.com/sushanglewis/WeLink/issues/17)「新版本需求」

WeLink（龙智协同）正在建设「数字员工」能力：在 Mattermost IM 中，人类员工可以与数字员工（agent）进行对话并协同完成任务。当前对话窗口是单一线性上下文，随着任务复杂度提升，存在以下问题：

1. 缺乏对多任务并行上下文的显式管理，历史话题难以回溯、切换和继续。
2. Agent 面对模糊需求时无法结构化澄清，导致反复猜测、效率低下。
3. 复杂任务缺少公开透明的执行计划（Plan）及人类审批机制。
4. Agent 无法直接引用和操作企业数据（多维表格），无法将表格数据/表单以自然方式嵌入对话。
5. 对话中产生的待办/日程无法自动落入个人日程看板，agent 也无法邀请其他成员参与。

2026-09-02 与领导的产品路线会议将 issue-17 的定位从「数字员工 IM 窗口增强」扩展为「数字员工 + 工作台首页 + 组织化管理 + 企微替换」的企业协同系统主线，关键输入：

- 员工日常工作 = **待办**（流程审批、他人艾特的督办任务）+ **通知**（组织公告/活动/规则）+ **知识**（邮件/文档/文章）三模块，工作台首页是承载这三模块的第一界面（PM 决策：独立工作台首页，默认落地页）。
- **督办全闭环**：数字员工自动完成录入、催办、状态更新；责任人 IM 回复自动同步数据表；管理员每日仅看汇总报告。9/9 督办 V1 方案定稿。
- **组织化数字员工**：创建走审批流（业务部门 → HR → 通讯录 → 数字赋能部），定位初级岗位，权限分散到业务系统，仅人事配置技能。
- **企微替换**：现有 SaaS 版企微核心功能为审批、考勤、工资条（聊天频率极低，具备替换条件）；11 月启创全员试用，1 月底完全替换，同步部署启创专属 EIC 版本。
- **邮箱**：网易邮件接入替换腾讯邮件（用户邮件）；163 邮箱接入（管理端场景）。

## 问题

1. **聊天上下文管理不足**：现有 IM 对话是单一连续流，人与数字员工讨论多个任务时上下文混杂，无法像 AI 工作台一样按话题组织。
2. **需求澄清效率低**：Agent 对模糊需求只能文本反问，缺少 Codex 式的多选项澄清弹窗，用户表达意图成本高。
3. **复杂任务缺乏计划与审批**：Agent 直接执行复杂任务，缺少 Plan.md 形式的前因后果说明和人类审批闭环。
4. **企业数据难以在对话中操作**：Teable 多维表格数据无法以胶囊/表单形式进入聊天，agent 不能通过 skills 操作表格。
5. **日程与对话割裂**：对话中产生的待办无法自动创建为日程，agent 不能替人类安排会议并邀请成员。
6. **员工日常工作缺少统一入口（9/2 会议新增）**：待办散落在流程系统与 IM 艾特中，通知与知识无个人级聚合界面，员工需要打开多个系统才能掌握全天工作。
7. **督办依赖人工闭环（9/2 会议新增）**：于福帅手工维护 Excel 督办台账，催办靠人工发消息，责任人回复需人工二次录入，无每日汇总。
8. **数字员工缺少组织化管理（9/2 会议新增）**：创建无审批流，未纳入企业通讯录，权限集中在平台侧管理复杂，存在随意创建冗余 Agent 的风险。
9. **企业邮箱依赖腾讯邮件（9/2 会议新增）**：用户邮件依赖腾讯邮件，管理端场景需要 163 邮箱接入。
10. **SaaS 版企微使用率低但功能被依赖（9/2 会议新增）**：审批、考勤、工资条三类核心功能仍跑在 SaaS 企微上，需要在新系统重建并完成替换。

## 目标

为 WeLink 数字员工对话窗口引入 AI 工作台化能力，并实现 AI 日程：

1. **话题管理**：在 IM 对话中提供话题列表，支持人与 agent 创建、切换、继续话题，每个话题有独立窗口与历史。
2. **Clarify 工具**：需求模糊时，agent 以底部弹窗提出多选题（3 推荐 + 1 自定义），用户选择后作为 user message 发送。
3. **Plan 模式**：复杂任务生成 Plan.md，以 markdown 展示并支持通过/修改按钮迭代，审批通过后 agent 执行。
4. **Teable 集成**：输入框支持选择 teable 表格并以胶囊插入消息；支持将 teable 表单视图作为 iframe 嵌入消息并填报提交。
5. **AI 日程**：每人拥有日程看板，agent 可从对话中识别待办并创建日程（时间/事项/参与人），支持邀请成员；选择开源、agent-friendly 的日历后端。
6. **龙小督督办场景**：支持龙小督通过持续澄清收集督办要素、调用行文风格 skill 润色、用户确认后填报 Teable；支持基于 Teable 数据问答；支持龙小督独立 Teable 账号与用户 Token 代操作；支持按「批次-事项」主动创建/延续话题通知；**（9/2 会议扩展）支持自动催办、责任人 IM 回复自动同步数据表、每日汇总报告**。
7. **工作台首页（9/2 会议新增）**：建设独立工作台首页作为默认落地页，聚合待办（流程审批 + 艾特督办）、通知、知识三模块；数字员工 IM 为对外协同交流入口。详见 [`workbench-home-p0.md`](./workbench-home-p0.md)。
8. **组织化数字员工管理（9/2 会议新增）**：创建审批流（业务部门 → HR → 通讯录 → 数字赋能部）、初级岗位定位、防冗余创建、权限分散到业务系统、仅人事技能配置。详见 [`org-agent-management-p0.md`](./org-agent-management-p0.md)。
9. **企业邮箱接入（9/2 会议新增）**：网易邮件接入替换腾讯邮件（用户邮件）；163 邮箱接入（管理端场景）。详见 [`email-p0.md`](./email-p0.md)。
10. **企微替换（9/2 会议新增）**：重建审批、考勤、工资条；11 月启创全员试用，1 月底完全替换 SaaS 企微；部署启创专属 EIC 版本。详见 [`wework-replacement-p0.md`](./wework-replacement-p0.md)。

## 用户

- **普通员工**：通过数字员工完成日常任务，需要清晰的话题管理、需求澄清、计划审批。
- **数字员工（agent）**：需要结构化上下文、澄清工具、计划执行协议、数据操作 skills、日程创建能力。
- **团队协作者**：被 agent 邀请加入日程的其他成员。

## 方案（初定）

### 总体架构

延续 WeLink「薄外壳 + iframe/WebView 嵌入 + token SSO」的集成模式：

- **数字员工 IM 窗口即 AI 工作台**：不再单独建设独立工作台页面，而是将现有 IM 对话窗口直接 AI 工作台化。
- 数字员工聊天表面复用 issue-14 已建设的 Mattermost/OpenClaw 运行时。
- 话题、Clarify、Plan、各类胶囊（skills / MCP / 插件 / 多维表格）在聊天消息层扩展。
- 日程看板通过 iframe 嵌入开源日历产品；agent 通过 CalDAV/JMAP MCP server 或官方 CLI 操作日程。

### 话题管理

- 在聊天窗口侧边或顶部提供「话题列表」组件。
- 每个话题 = 一个 Mattermost thread = 独立的消息窗口 + 独立上下文。
- 人和 agent 均可创建新话题；点击历史话题可继续对话。
- 话题支持标题、创建时间、最后活跃时间、摘要。

### Clarify 工具

- 当 agent 识别到需求模糊时，通过定制化开发的 Clarify agent 工具生成澄清问题列表。
- agent 对该 thread 发起 Clarify 工具调用时，Mattermost 前端在该话题聊天窗口中弹出选项卡。
- 每个问题提供 3 个推荐选项 + 1 个「自定义」输入框；用户选择/填写后，以 user message 形式发送给 agent。
- Clarify 可单轮或多轮，直到需求明确。

### Plan 模式

- 当任务较复杂时，agent 生成 Plan.md（markdown），包含背景、目标、步骤、依赖、验收标准、风险。
- 前端以定制 Plan 消息卡片形式展示 Plan.md，附带「通过」「需要修改」按钮。
- agent 后端将 Plan.md 存储在该 thread 对应的文件中，便于版本管理与审批历史追溯。
- 用户点击「通过」后，通过 Mattermost 自定义 action / webhook / postMessage 回调 agent，agent 按 Plan 执行；点击「需要修改」或在输入框描述修改意见，agent 更新 Plan.md 文件并重新渲染卡片。
- Plan 审批通过前，agent 不执行 Plan 中的具体动作（除澄清外）。

### 胶囊系统（ skills / MCP / 插件 / 多维表格 ）

在输入框或 agent 消息中支持插入多种类型的胶囊，用于显式指定一个 skill、MCP server、插件或 teable 表格：

- **Skills 胶囊**：显示指定 skill 名称、描述、输入参数预览；点击后可将该 skill 及其上下文注入当前对话，agent 可调用。
- **MCP 胶囊**：显示指定 MCP server 名称、可用工具数量、关键工具预览；点击后可将 MCP 工具集接入当前 agent 上下文。
- **插件胶囊**：显示指定插件名称、版本、功能摘要；点击后激活插件能力。
- **Teable 胶囊**：显示指定 teable 表格关键信息（base_id、table_id、view_id、表名、权限范围）；点击后 agent 可通过 teable skills 操作数据。
- 四类胶囊采用统一的自定义 JSON schema，agent 解析后分发到 skill / MCP / 插件 / teable skills 调用。
- 胶囊统一支持：消息中渲染为可点击/展开的卡片、携带元数据、可被 agent 解析、支持删除/替换。

> 注：Teable 多维表格的集成与表单 iframe 能力已在 issue-6 实现，本次 #17 直接复用，不再重新评估 Teable 本身；重点是扩展胶囊类型到 skills、MCP、插件。

### Teable 表单 iframe

- 直接复用 issue-6 已实现的 teable 表单视图 iframe 嵌入能力。
- 表单以 iframe 形式嵌入消息，保持 teable 原样式。
- 用户在 iframe 中填写/修改字段并提交；提交结果通过 postMessage 回传聊天窗口，并同步到 teable。

### AI 日程

- 日程需要同时具备**前端 UI**和**后端服务**，且对人、对 agent 都友好。
- 为每个用户维护一个个人日程看板；看板通过 iframe 嵌入开源日历 UI。
- Agent 在对话中识别待办事项后，调用日历后端**帮助用户**创建、更新、删除事件（时间、标题、描述、参与人）。
- 事件支持邀请其他成员；被邀请的成员均可在自己的日程看板中看到该事件。
- **Agent 本身作为组织成员拥有独立日历身份**，可以管理自己的日程，并能在自己的事件触发时被唤醒执行动作。
- 用户侧只关注个人日程，无需与 Outlook / Google 日历互通。
- Agent 通过 token（app password / OAuth token）访问日历后端；操作封装为 CLI / MCP server / skill。
- 日历后端候选：Nextcloud Calendar（AGPL-3.0，主选，具备完整前后端）、Stalwart（AGPL-3.0，备选，后端强但需自研 UI）、Cal.com（需核实 2026 许可证变化）。

### 龙小督督办场景（P0 / 1.3.0）

龙小督作为数字员工在督办业务场景下的核心能力，已拆分为独立子需求 [`supervision-p0.md`](./supervision-p0.md)。概要如下：

- **持续澄清 + 行文润色 + 表单填报**
  - 龙小督识别督办事项关键要素（总体情况、具体进展、存在困难/待协调问题、下一步计划）。
  - 关键要素缺失时，通过 Clarify 工具持续提问，直到要素完整。
  - 调用「督办事项行文风格 Skill」将原始文本改写为标准公文格式。
  - 润色后的文本必须经用户确认，确认后方可视为完成。
  - 用户确认后，使用用户本人的 Teable Token 将数据填报到 Teable 督办台账。
- **表格数据筛选与问答**
  - 用户用自然语言查询督办数据（如按编号、按名称、查最新状态、查历史反馈、查批次列表）。
  - 龙小督将查询意图转化为 Teable 筛选条件或查询请求，基于结果直接回答。
- **Teable 独立账号与 Token 机制**
  - 为龙小督创建独立 Teable 账号与 Token，用于系统级只读/管理操作。
  - 为每个用户默认初始化 Teable Token；龙小督代用户填写、修改或操作任何 Teable 数据时，必须使用用户 Token，留下真实操作痕迹。
  - Token 管理界面支持查看、轮换、撤销。
- **主动通知与话题控制**
  - 督办业务按「批次-事项」一对多关系组织。
  - 龙小督主动通知用户时，优先查找该「批次-事项」已有话题；存在则延续，不存在则主动创建新话题。
  - 话题创建/选择规则可配置，支持按批次聚合或按事项拆分。
- **自动催办闭环（9/2 会议新增，S-5）**
  - 按可配置规则（截止时间、逾期天数、批次节奏）自动生成催办任务。
  - 龙小督主动向责任人发送 IM 消息或邮件催办，并记录催办历史。
  - 责任人在 IM 中回复后，系统自动解析回复内容并更新督办台账对应记录，无需人工二次录入。
  - 每日向管理员（于福帅）推送汇总报告，覆盖当日全部督办事项（约 15 个）的更新、逾期与待办情况。

### 工作台首页（P0 / 1.3.1-1.4.0，9/2 会议新增）

独立工作台首页作为系统默认落地页，聚合员工日常三模块，已拆分为独立子需求 [`workbench-home-p0.md`](./workbench-home-p0.md)。概要如下：

- **待办**：聚合流程审批事项与他人艾特的督办任务，支持按来源、紧急程度筛选，点击进入处理。
- **通知**：组织发布的公告、活动、规则等需要全员或相关人员知晓的信息流。
- **知识**：支撑个人工作的邮件、文档、文章等知识内容，从组织级知识库落地到个人工作支撑。
- **数字员工入口**：首页保留数字员工 IM 协同入口，工作台处理个人工作，数字员工负责对外协同与任务分配（边界遵循会议纪要）。

### 组织化数字员工管理（P0 / 1.4.0，9/2 会议新增）

已拆分为独立子需求 [`org-agent-management-p0.md`](./org-agent-management-p0.md)。概要如下：

- **创建审批流**：业务部门提交创建需求（岗位画像、职责）→ 人力资源部完成基础配置 → 纳入企业通讯录 → 数字赋能部配置账号、权限与岗位职责。
- **初级岗位定位**：数字员工优先处理登记、分发、归集等无需复杂判断的基础事务，不追求全知全能。
- **防冗余创建**：禁止单个用户随意创建数字员工，避免组织内短期出现大量冗余 Agent。
- **权限分散**：平台侧仅控制数字员工「能访问哪些系统」；系统内数据权限由各业务系统自行管理；仅人事岗位开放技能配置权限。

### 企业邮箱接入（P1 / 1.4.1-1.5.1，9/2 会议新增）

两个独立需求，已拆分为 [`email-p0.md`](./email-p0.md)：

- **网易邮件接入（用户邮件，1.4.1）**：接入网易邮件服务，完成从腾讯邮件的迁移，支撑 MVP 邮件需求。
- **163 邮箱接入（管理端场景，1.5.1，源自九月计划）**：管理端邮件场景接入 163 邮箱。

### 企微替换（P0 / 1.5.1-1.7.x，9/2 会议新增）

已拆分为独立子需求 [`wework-replacement-p0.md`](./wework-replacement-p0.md)。概要如下：

- 盘点现有 SaaS 版企微核心功能：审批、考勤、工资条（聊天频率极低，具备替换条件）。
- 11 月在启创内部全员试用可正常使用版本，抓住企微使用低频的切换窗口期。
- 按倒排计划推进，1 月底完全替换 SaaS 版企微；新系统上线后引导全员在新平台完成聊天交互，快速暴露问题、快速迭代。
- 同步部署启创专属 EIC 版本，配置适配启创业务的流程，实现与启创现有业务的深度整合。

## 非目标

- 本次不替换 Mattermost 作为 IM 底层。
- ~~不单独建设独立 AI 工作台页面；数字员工 IM 窗口即工作台。~~（2026-09-03 按 9/2 会议纪要 PM 决策撤销：建设独立工作台首页，见 `workbench-home-p0.md`）
- Teable 多维表格集成与表单 iframe 已在 issue-6 实现，本次仅扩展胶囊类型，不重新评估 Teable 本身。
- 不要求日程后端支持移动端原生 SDK（Web/iframe 足够）。
- 不实现通用 AI 工作台的代码编辑/终端等能力，聚焦对话协作场景。
- 不替代企业现有 Outlook/Google 日历，本次也不与其互通。
- 9 月计划中的平台管理端/企业管理端整体、在线文档、移动端（打卡、IM，伊莎负责）、音视频会议等条目不进 issue-17 范围，仅作背景引用（PM 决策：以会议纪要为准）。
- 不建设通用统一权限平台；数字员工数据权限分散到各业务系统管理（会议纪要原则）。

## 验收标准

### 话题管理

- [ ] 聊天窗口中可看到话题列表。
- [ ] 人类用户可创建新话题并进入新话题窗口。
- [ ] Agent 可主动建议/创建新话题。
- [ ] 点击历史话题可加载该话题历史消息并继续对话。
- [ ] 话题切换不丢失上下文，且不同话题间消息隔离。
- [ ] 详细规格与验收标准见 [`topic-windows-p0.md`](./topic-windows-p0.md)。

### Clarify 工具

- [ ] Agent 识别到模糊需求时，在聊天底部弹出 Clarify 选项卡。
- [ ] 每个问题至少展示 3 个推荐选项和 1 个自定义输入。
- [ ] 用户选择/填写后，以 user message 发送给 agent。
- [ ] 支持多轮 Clarify，直到需求明确。

### Plan 模式

- [ ] 复杂任务触发 Plan 模式，生成 Plan.md 消息卡片。
- [ ] Plan.md 以 markdown 渲染，包含背景、目标、步骤、依赖、验收标准、风险。
- [ ] 卡片提供「通过」和「需要修改」按钮。
- [ ] 用户可在输入框描述修改意见，agent 据此更新 Plan.md。
- [ ] Plan 未通过前，agent 不执行 Plan 中的关键动作。
- [ ] Plan 通过后，agent 按 Plan 执行并反馈进度。

### 胶囊系统

- [ ] 输入框「+」菜单支持选择 skills / MCP / 插件 / 多维表格并插入对应胶囊。
- [ ] Skills 胶囊展示 skill 名称、描述、输入参数预览；点击后可注入当前对话供 agent 调用。
- [ ] MCP 胶囊展示 MCP server 名称、可用工具数量、关键工具预览；点击后接入 agent 上下文。
- [ ] 插件胶囊展示插件名称、版本、功能摘要；点击后激活插件能力。
- [ ] Teable 胶囊展示表名、base_id / table_id / view_id 等关键信息；agent 可读取并调用 teable skills。
- [ ] 胶囊在消息中统一渲染为可点击/展开的卡片，支持删除/替换。

### Teable 表单 iframe

- [ ] 复用 issue-6 已实现的 teable 表单视图 iframe 嵌入。
- [ ] iframe 保持 teable 表单样式。
- [ ] 用户可在 iframe 中填写并提交。
- [ ] 提交后数据同步回 teable，并在聊天中反馈提交结果。

- [ ] 每人有一个日程看板入口，可通过 iframe 查看。

## 已确认决策与待决策问题

1. **话题持久化模型** ✅ 已确认：每个话题映射到一个 **Mattermost thread**。
2. **多窗口形态** ✅ 已确认：单 IM 窗口内通过顶部/侧边 tab 栏打开多个话题；通过「历史话题」icon 展开列表选择话题；关闭 tab 不删除数据。详细规格见 [`topic-windows-p0.md`](./topic-windows-p0.md)。
3. **Plan.md 存储与审批回调** ✅ 已确认：前端使用定制 Plan 消息卡片展示；agent 后端将 Plan.md 存储在该 thread 对应的文件中；审批按钮通过 Mattermost 自定义 action / webhook / postMessage 回调 agent。
3. **Clarify 工具宿主** ✅ 已确认：定制化开发一个 Clarify agent 工具；agent 对该 thread 发起 Clarify 工具调用时，Mattermost 前端在该话题聊天窗口中弹出选项卡。
4. **胶囊元数据协议** ✅ 已确认：采用统一的**自定义 JSON schema**，四类胶囊由 agent 解析后分发调用。
5. **日程范围** ✅ 已确认：用户侧只关注**个人日程**；事件涉及多人时所有参与人均可见；**不与 Outlook / Google 日历互通**。
6. **日程 OSS 最终选择** ✅ 已决策：**暂缓最终选择，进入 `product-design-docs` 阶段后通过 PoC 再定**。当前路线：
   - **主选：Nextcloud Calendar（AGPL-3.0，fit 5/5）**——自带完整前后端与成熟日历 UI，最贴合「人+agent 共用」场景。
   - **备选：Stalwart（AGPL-3.0，fit 4/5）**——JMAP 对 agent 最友好，但缺少日历 UI，需自研看板。
   - **Fallback：sabre/dav + 自研 UI（MIT）**——若 AGPL 合规成本不可接受时启用。
7. **版本规划** ✅ 已确认：1.3.0 上线话题管理、Clarify、Teable 表单 iframe、龙小督督办场景；1.4.0 上线 Plan 模式、胶囊系统、AI 日程、话题摘要 P1。
8. **Mattermost BOT 对话窗口方案** ✅ 已确认：Mattermost 官方 Agents 插件 v2.x 已提供多会话/多话题能力，但 WeLink 继续基于 **OpenClaw + Mattermost thread** 自研；DM 中需自研会话管理层（按 `root_id` 或自建会话表）。
9. **Agent 框架** ✅ 已确认：**保留 OpenClaw**，不替换为 DeepSeek Harness 或 Codex Harness；OpenClaw 已原生支持 sub-agent 扇出/扇入与多 agent 协作。详见 [`issue-17/docs/research/agent-framework-decision.md`](../../docs/research/agent-framework-decision.md)。
10. **龙小督督办场景** ✅ 已确认：拆分为独立 P0 子需求 [`supervision-p0.md`](./supervision-p0.md)，纳入 1.3.0。
11. **9/2 会议范围并入** ✅ 已确认（2026-09-03 PM 决策）：会议纪要对标范围全面扩入 issue-17，以会议纪要为准；9 月计划独有的管理端/移动端/音视频等仅作背景引用。
12. **工作台形态** ✅ 已确认（2026-09-03 PM 决策）：**独立工作台首页**（待办/通知/知识，默认落地页），数字员工 IM 为协同入口。与纪要「工作台入口不得比数字员工更明显」发言存在张力，按 PM 决策执行并记录。
13. **督办 V1 范围** ✅ 已确认（2026-09-03 PM 决策）：全闭环纳入 9/9 定稿——现有收集/润色/填报/查询 + 自动催办 + 责任人回复自动入库 + 每日汇总报告。
14. **issue-70 旧包处理** ✅ 已确认（2026-09-03 PM 决策）：仅保留 IM/督办相关（GUI 策略研究 + gui-strategy 设计原型），opencode/TeamAI/harness 相关全部丢弃。
15. **版本节奏** ✅ 已确认（2026-09-03 PM 决策）：每月两个版本，1 月底前共 8 个版本；R1–R8 具体映射为 agent 拟定初稿，待 PM 确认。
16. **邮箱需求** ✅ 已确认（2026-09-03 PM 决策）：163 邮箱接入（管理端）与网易邮件替换腾讯邮件（用户邮件）是两个独立需求，都进 issue-17。

(function () {
    'use strict';

    var THEME_KEY = 'lincoln-theme';

    function getQueryTheme() {
        var m = window.location.search.match(/[?&]theme=(light|dark)(?:&|$)/);
        return m ? m[1] : null;
    }

    function getStoredTheme() {
        try {
            return localStorage.getItem(THEME_KEY);
        } catch (err) {
            return null;
        }
    }

    function setStoredTheme(theme) {
        try {
            localStorage.setItem(THEME_KEY, theme);
        } catch (err) {
            // ignore
        }
    }

    function applyTheme(theme) {
        if (theme !== 'light' && theme !== 'dark') return;
        document.documentElement.setAttribute('data-theme', theme);
        setStoredTheme(theme);
    }

    function initTheme() {
        var theme = getQueryTheme() || getStoredTheme() || 'light';
        applyTheme(theme);

        window.addEventListener('message', function (e) {
            var data = e.data || {};
            if (data.type === 'lincoln-theme' && (data.theme === 'light' || data.theme === 'dark')) {
                applyTheme(data.theme);
            }
        });

        window.addEventListener('load', function () {
            if (window.parent) {
                window.parent.postMessage({ type: 'lincoln-theme-ready' }, '*');
            }
        });
    }

    function renderMarkdown(src) {
        var lines = src.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        var html = '';
        var inCode = false;
        var codeLang = '';
        var codeBuffer = [];
        var inTable = false;
        var tableBuffer = [];

        function flushCode() {
            if (!inCode) return;
            html += '<pre><code class="language-' + (codeLang || 'text') + '">' + escapeHtml(codeBuffer.join('\n')) + '</code></pre>\n';
            inCode = false;
            codeLang = '';
            codeBuffer = [];
        }

        function flushTable() {
            if (!inTable || tableBuffer.length < 2) return;
            html += '<table>\n<thead><tr>';
            var headers = tableBuffer[0].split('|').map(function (s) { return s.trim(); }).filter(Boolean);
            headers.forEach(function (h) { html += '<th>' + inlineRender(h) + '</th>'; });
            html += '</tr></thead>\n<tbody>\n';
            for (var i = 2; i < tableBuffer.length; i++) {
                html += '<tr>';
                var cells = tableBuffer[i].split('|').map(function (s) { return s.trim(); }).filter(Boolean);
                cells.forEach(function (c) { html += '<td>' + inlineRender(c) + '</td>'; });
                html += '</tr>\n';
            }
            html += '</tbody>\n</table>\n';
            inTable = false;
            tableBuffer = [];
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function inlineRender(str) {
            return escapeHtml(str)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>');
        }

        function blockRender(line) {
            if (/^#{1,6}\s+/.test(line)) {
                var level = line.match(/^(#{1,6})\s+/)[1].length;
                var text = line.replace(/^#{1,6}\s+/, '');
                return '<h' + level + '>' + inlineRender(text) + '</h' + level + '>';
            }
            if (/^\s*>\s*(.*)/.test(line)) {
                return '<blockquote><p>' + inlineRender(line.replace(/^\s*>\s*/, '')) + '</p></blockquote>';
            }
            if (/^\s*[-*+]\s+/.test(line)) {
                return '<li>' + inlineRender(line.replace(/^\s*[-*+]\s+/, '')) + '</li>';
            }
            if (/^\s*\d+\.\s+/.test(line)) {
                return '<li>' + inlineRender(line.replace(/^\s*\d+\.\s+/, '')) + '</li>';
            }
            return '<p>' + inlineRender(line) + '</p>';
        }

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i];

            if (/^```/.test(line)) {
                if (inCode) {
                    flushCode();
                } else {
                    flushTable();
                    inCode = true;
                    codeLang = line.replace(/^```\s*/, '').trim();
                }
                continue;
            }

            if (inCode) {
                codeBuffer.push(line);
                continue;
            }

            if (/^\|/.test(line)) {
                inTable = true;
                tableBuffer.push(line);
                continue;
            } else {
                flushTable();
            }

            if (/^\s*$/.test(line)) {
                continue;
            }

            html += blockRender(line) + '\n';
        }
        flushCode();
        flushTable();

        // Wrap consecutive list items
        html = html.replace(/(<li>[^<]*<\/li>\n)+/g, function (match) {
            return '<ul>\n' + match + '</ul>\n';
        });

        return html;
    }

    initTheme();

    var sourceEl = document.getElementById('docSource');
    var contentEl = document.getElementById('docContent');
    if (sourceEl && contentEl) {
        var src = sourceEl.textContent;
        contentEl.innerHTML = renderMarkdown(src);
    }
})();
