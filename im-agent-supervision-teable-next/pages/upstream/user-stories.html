# 用户故事: 2026-08-24-issue-17

> 注（2026-08-24）：#17 不单独建设独立 AI 工作台页面，而是将数字员工 IM 窗口直接 AI 工作台化。
>
> 注（2026-09-03）：按 2026-09-02 领导会议纪要 PM 决策撤销上述定位——**独立工作台首页**纳入范围（故事十八），数字员工 IM 为对外协同入口；同时新增督办闭环（故事十九）、组织化管理（故事二十）、邮箱（故事二十一）、企微替换（故事二十二）四组故事。

## 用户故事一：创建话题以开始新任务

- **作为**：企业内部员工
- **我希望**：在与数字员工的聊天窗口中创建一个新话题
- **以便**：围绕一个新任务开始独立讨论，而不混入当前对话上下文
- **验收标准**：
  - 聊天界面提供「新建话题」入口。
  - 创建后自动进入新话题窗口，历史消息为空或仅显示系统提示。
  - 新话题在话题列表中可见，包含标题和创建时间。

## 用户故事二：切换并继续历史话题

- **作为**：企业内部员工
- **我希望**：在话题列表中点击一个历史话题
- **以便**：查看该话题的历史对话并继续讨论
- **验收标准**：
  - 话题列表展示所有历史话题及最后活跃时间。
  - 点击话题后，聊天窗口加载该话题的全部历史消息。
  - 继续发送的消息归属到该话题，不影响其他话题。

## 用户故事三：Agent 主动创建话题

- **作为**：数字员工（agent）
- **我希望**：当用户提出一个与当前话题明显不同的新任务时，主动建议或创建新话题
- **以便**：将不同任务隔离到不同上下文，提高协作效率
- **验收标准**：
  - Agent 可在对话中提示用户「是否创建新话题讨论 X」。
  - 用户确认后创建新话题并迁移上下文；agent 也可在特定规则下自动创建。
  - 新话题自动携带必要的上下文摘要（可选）。
  - 已拆分至 [`topic-windows-p0.md`](./topic-windows-p0.md)，以其为准。

## 用户故事四：通过 Clarify 澄清模糊需求

- **作为**：企业内部员工
- **我希望**：当我的需求不够明确时，agent 以底部弹窗列出多个选项供我选择
- **以便**：快速澄清意图，减少反复沟通
- **验收标准**：
  - 每个问题提供 3 个推荐选项 + 1 个自定义输入框。
  - 我可以单选或多选（视问题类型而定）。
  - 提交后，我的选择以 user message 形式发送给 agent。
  - 支持多轮 Clarify。

## 用户故事五：审阅并批准 Agent 的执行计划

- **作为**：企业内部员工
- **我希望**：对于复杂任务，agent 先生成 Plan.md 供我审阅
- **以便**：了解任务前因后果、步骤和风险，确认后再执行
- **验收标准**：
  - Plan.md 以 markdown 消息卡片展示，包含背景、目标、步骤、依赖、验收标准、风险。
  - 卡片提供「通过」和「需要修改」按钮。
  - 我可以在输入框描述修改意见，agent 据此更新 Plan.md。
  - Plan 通过前，agent 不执行关键动作；通过后按 Plan 执行。

## 用户故事六：在消息中插入多维表格胶囊

- **作为**：企业内部员工
- **我希望**：在输入框点击「+」并选择我的多维表格（teable）
- **以便**：以胶囊形式将表格关键信息插入消息，让 agent 操作表格数据
- **验收标准**：
  - 「+」菜单支持选择已接入的多维表格。
  - 仅展示我有权限的表格。
  - 插入的 Teable 胶囊显示表名等可读信息，并携带 base_id / table_id / view_id。
  - Agent 可解析胶囊并调用 teable skills。
  - 注：Teable 多维表格集成已在 issue-6 实现，本次直接复用。

## 用户故事十二：在消息中插入 Skills 胶囊

- **作为**：企业内部员工
- **我希望**：在输入框点击「+」并选择一个 skill
- **以便**：以胶囊形式将该 skill 引入当前对话，让 agent 明确知道我要调用它
- **验收标准**：
  - 「+」菜单支持浏览并选择可用 skills。
  - Skills 胶囊展示 skill 名称、描述、输入参数预览。
  - 点击胶囊后，skill 及其上下文被注入当前对话。
  - Agent 可识别胶囊并调用对应 skill。

## 用户故事十三：在消息中插入 MCP 胶囊

- **作为**：企业内部员工
- **我希望**：在输入框点击「+」并选择一个 MCP server
- **以便**：以胶囊形式将 MCP 工具集接入当前 agent 上下文
- **验收标准**：
  - 「+」菜单支持浏览并选择已配置的 MCP servers。
  - MCP 胶囊展示 MCP server 名称、可用工具数量、关键工具预览。
  - 点击胶囊后，对应 MCP 工具集对当前 agent 可用。
  - Agent 可解析胶囊并调用 MCP 工具。

## 用户故事十四：在消息中插入插件胶囊

- **作为**：企业内部员工
- **我希望**：在输入框点击「+」并选择一个插件
- **以便**：以胶囊形式激活插件能力，让 agent 在对话中调用插件功能
- **验收标准**：
  - 「+」菜单支持浏览并选择已安装的插件。
  - 插件胶囊展示插件名称、版本、功能摘要。
  - 点击胶囊后，插件能力在当前对话中激活。
  - Agent 可解析胶囊并通过插件执行操作。

## 用户故事七：在聊天中填写并提交 Teable 表单

- **作为**：企业内部员工
- **我希望**：Agent 发送的 teable 表单以 iframe 嵌入消息
- **以便**：我无需离开聊天窗口即可填报数据
- **验收标准**：
  - 表单 iframe 保持 teable 原样式。
  - 我可以在 iframe 中填写字段并提交。
  - 提交后数据同步到 teable，并在聊天中显示提交成功/失败提示。
  - iframe 权限受控，仅允许访问指定 teable 域名。

## 用户故事八：Agent 从对话中创建日程

- **作为**：企业内部员工
- **我希望**：当对话中产生待办事项时，agent 自动为我创建日程
- **以便**：待办落入个人日程看板，避免遗漏
- **验收标准**：
  - Agent 识别对话中的时间、事项、参与人信息。
  - Agent 调用日历后端创建事件并返回确认信息。
  - 事件出现在我的日程看板中。

## 用户故事九：邀请成员加入日程

- **作为**：企业内部员工
- **我希望**：Agent 创建日程时可以将其他成员加入并发送邀请
- **以便**：相关同事收到通知并能在自己的看板中看到事件
- **验收标准**：
  - Agent 可通过用户名/邮箱添加参与人。
  - 受邀人收到通知（IM 消息或邮件，视后端能力而定）。
  - 受邀人在其日程看板中可见该事件（至少为共享/受邀视图）。

## 用户故事十：查看个人日程看板

- **作为**：企业内部员工
- **我希望**：在 WeLink 中打开我的日程看板
- **以便**：查看、编辑、管理我的日程事件
- **验收标准**：
  - 提供日程看板入口（侧边栏或聊天内入口）。
  - 看板通过 iframe 嵌入开源日历 UI，支持月/周/日视图。
  - 我可以在看板中查看、编辑、删除事件。

## 用户故事十一：为 Agent 签发日程访问 Token

- **作为**：企业内部员工 / 管理员
- **我希望**：为 agent 签发访问我日程后端的 token
- **以便**：agent 可以代我创建和管理日程，同时 token 可独立回收
- **验收标准**：
  - Token 签发界面清晰说明权限范围（读写日程、邀请成员）。
  - Token 可独立生成、查看、撤销。
  - Agent 使用 token 调用日历后端 API/CLI/MCP。

## 用户故事十五：Agent 帮我管理日程

- **作为**：企业内部员工
- **我希望**：Agent 能从对话中识别我的待办，并帮我创建、更新、删除日程事件
- **以便**：我不用手动切换应用到日历，待办能自动落入个人日程看板
- **验收标准**：
  - Agent 识别对话中的时间、事项、参与人信息。
  - Agent 调用日历后端替我创建/更新/删除事件。
  - 事件出现在我的日程看板中。

## 用户故事十六：Agent 作为组织成员管理自己的日程

- **作为**：数字员工（agent）
- **我希望**：我拥有独立的日历身份，能够管理自己的日程
- **以便**：我可以像普通成员一样被邀请参加会议，或主动安排自己的任务时间
- **验收标准**：
  - Agent 在日历后端拥有独立账户/身份。
  - Agent 可以创建、查看、更新、删除自己的事件。
  - 其他成员可以把 Agent 添加为事件参与人。

## 用户故事十七：Agent 被自己的日程触发

- **作为**：数字员工（agent）
- **我希望**：当我的日程事件到达触发条件时（如会议开始前 5 分钟），我能被唤醒并执行对应动作
- **以便**：我可以主动为用户推送准备材料、加入会议或执行后续任务
- **验收标准**：
  - 日历后端支持事件触发机制（webhook / push / 定时轮询）。
  - Agent 能在事件触发时收到通知并执行预设动作。
  - 触发动作可配置（如发送提醒、推送会议材料、调用 skill）。

## 用户故事十八：在工作台首页掌握全天工作（9/2 会议新增）

- **作为**：企业内部员工
- **我希望**：打开系统默认落地的工作台首页，看到我的待办（流程审批 + 他人艾特的督办任务）、组织通知、与我工作相关的知识
- **以便**：不用打开多个系统就能掌握全天工作，从首页直接进入处理或发起协同
- **验收标准**：
  - 工作台首页为系统默认落地页，含待办、通知、知识三模块。
  - 待办聚合流程审批与艾特督办，支持筛选与跳转处理。
  - 通知模块展示组织公告/活动/规则。
  - 知识模块聚合与个人工作相关的邮件、文档、文章。
  - 首页提供数字员工 IM 协同入口。
  - 详细规格见 [`workbench-home-p0.md`](./workbench-home-p0.md)。

## 用户故事十九：龙小督自动催办并同步责任人回复（9/2 会议新增）

- **作为**：督办管理员（于福帅）
- **我希望**：龙小督按规则自动向责任人催办，责任人在 IM 回复后自动更新台账，我每天只看一份汇总报告
- **以便**：摆脱手工维护 Excel 台账和逐人催办，降低督办运营成本
- **验收标准**：
  - 催办规则可配置（截止时间、逾期天数、批次节奏）。
  - 龙小督主动向责任人发送 IM/邮件催办并保留催办历史。
  - 责任人 IM 回复自动解析并更新督办台账，无需人工二次录入。
  - 每日推送汇总报告，覆盖当日更新、逾期与待办（约 15 个事项）。
  - 详细规格见 [`supervision-p0.md`](./supervision-p0.md) S-5。

## 用户故事二十：按组织流程创建数字员工（9/2 会议新增）

- **作为**：业务部门负责人
- **我希望**：提交数字员工创建需求（岗位画像、职责），由人力资源部和数字赋能部完成配置后纳入企业通讯录
- **以便**：数字员工像正式员工一样有规范的入职流程和明确的岗位职责，不产生冗余 Agent
- **验收标准**：
  - 创建必须经过审批流：业务部门 → HR 基础配置 → 通讯录纳入 → 数字赋能部配置账号/权限/岗位职责。
  - 普通用户无法自行创建数字员工。
  - 数字员工在通讯录中可见，与人类员工同体系管理。
  - 平台侧仅配置系统级访问范围，系统内数据权限由各业务系统管理；仅人事岗位有技能配置权限。
  - 详细规格见 [`org-agent-management-p0.md`](./org-agent-management-p0.md)。

## 用户故事二十一：企业邮箱接入与迁移（9/2 会议新增）

- **作为**：企业内部员工 / 管理员
- **我希望**：用户邮件迁移到网易邮件（替换腾讯邮件），管理端场景接入 163 邮箱
- **以便**：企业邮箱能力自主可控，不再依赖腾讯邮件
- **验收标准**：
  - 网易邮件接入完成，历史邮件迁移可校验、可回滚，双轨期不丢信。
  - 163 邮箱接入管理端场景。
  - 详细规格见 [`email-p0.md`](./email-p0.md)。

## 用户故事二十二：从企微切换到新系统（9/2 会议新增）

- **作为**：企业内部员工
- **我希望**：11 月开始在启创内部试用新系统，1 月底前审批、考勤、工资条都跑在新系统上，完全停用 SaaS 版企微
- **以便**：企业内部办公沟通体系统一到低使用成本、自主可控的新平台
- **验收标准**：
  - 11 月启创全员试用版本可用（IM 基础功能 + 工作台首页 + 督办闭环 + 邮件）。
  - 审批、考勤、工资条三件套重建并通过业务验收，历史数据迁移完成。
  - 1 月底完全替换 SaaS 版企微，替换后全员在新平台完成聊天交互。
  - 启创专属 EIC 版本部署并适配本地业务流程。
  - 详细规格见 [`wework-replacement-p0.md`](./wework-replacement-p0.md)。

## 非功能性验收

- **License 合规**：日程后端必须采用 MIT / Apache-2.0 / AGPL 协议；GPL 家族排除。
- **Agent 友好**：日历后端需提供 CLI、REST API、MCP server 或 JMAP 中至少一种可编程接口。
- **国产化兼容**：优先选择国内可部署或有商业买断路径的开源方案。
- **安全性**：iframe 嵌入启用 HTTPS、CSP、postMessage 白名单；token 不硬编码、可轮换。

<script>
(function () {
    'use strict';

    var THEME_KEY = 'lincoln-theme';

    function getQueryTheme() {
        var m = window.location.search.match(/[?&]theme=(light|dark)(?:&|$)/);
        return m ? m[1] : null;
    }

    function getStoredTheme() {
        try {
            return localStorage.getItem(THEME_KEY);
        } catch (err) {
            return null;
        }
    }

    function setStoredTheme(theme) {
        try {
            localStorage.setItem(THEME_KEY, theme);
        } catch (err) {
            // ignore
        }
    }

    function applyTheme(theme) {
        if (theme !== 'light' && theme !== 'dark') return;
        document.documentElement.setAttribute('data-theme', theme);
        setStoredTheme(theme);
    }

    function initTheme() {
        var theme = getQueryTheme() || getStoredTheme() || 'light';
        applyTheme(theme);

        window.addEventListener('message', function (e) {
            var data = e.data || {};
            if (data.type === 'lincoln-theme' && (data.theme === 'light' || data.theme === 'dark')) {
                applyTheme(data.theme);
            }
        });

        window.addEventListener('load', function () {
            if (window.parent) {
                window.parent.postMessage({ type: 'lincoln-theme-ready' }, '*');
            }
        });
    }

    function renderMarkdown(src) {
        var lines = src.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        var html = '';
        var inCode = false;
        var codeLang = '';
        var codeBuffer = [];
        var inTable = false;
        var tableBuffer = [];

        function flushCode() {
            if (!inCode) return;
            html += '<pre><code class="language-' + (codeLang || 'text') + '">' + escapeHtml(codeBuffer.join('\n')) + '</code></pre>\n';
            inCode = false;
            codeLang = '';
            codeBuffer = [];
        }

        function flushTable() {
            if (!inTable || tableBuffer.length < 2) return;
            html += '<table>\n<thead><tr>';
            var headers = tableBuffer[0].split('|').map(function (s) { return s.trim(); }).filter(Boolean);
            headers.forEach(function (h) { html += '<th>' + inlineRender(h) + '</th>'; });
            html += '</tr></thead>\n<tbody>\n';
            for (var i = 2; i < tableBuffer.length; i++) {
                html += '<tr>';
                var cells = tableBuffer[i].split('|').map(function (s) { return s.trim(); }).filter(Boolean);
                cells.forEach(function (c) { html += '<td>' + inlineRender(c) + '</td>'; });
                html += '</tr>\n';
            }
            html += '</tbody>\n</table>\n';
            inTable = false;
            tableBuffer = [];
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function inlineRender(str) {
            return escapeHtml(str)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>');
        }

        function blockRender(line) {
            if (/^#{1,6}\s+/.test(line)) {
                var level = line.match(/^(#{1,6})\s+/)[1].length;
                var text = line.replace(/^#{1,6}\s+/, '');
                return '<h' + level + '>' + inlineRender(text) + '</h' + level + '>';
            }
            if (/^\s*>\s*(.*)/.test(line)) {
                return '<blockquote><p>' + inlineRender(line.replace(/^\s*>\s*/, '')) + '</p></blockquote>';
            }
            if (/^\s*[-*+]\s+/.test(line)) {
                return '<li>' + inlineRender(line.replace(/^\s*[-*+]\s+/, '')) + '</li>';
            }
            if (/^\s*\d+\.\s+/.test(line)) {
                return '<li>' + inlineRender(line.replace(/^\s*\d+\.\s+/, '')) + '</li>';
            }
            return '<p>' + inlineRender(line) + '</p>';
        }

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i];

            if (/^```/.test(line)) {
                if (inCode) {
                    flushCode();
                } else {
                    flushTable();
                    inCode = true;
                    codeLang = line.replace(/^```\s*/, '').trim();
                }
                continue;
            }

            if (inCode) {
                codeBuffer.push(line);
                continue;
            }

            if (/^\|/.test(line)) {
                inTable = true;
                tableBuffer.push(line);
                continue;
            } else {
                flushTable();
            }

            if (/^\s*$/.test(line)) {
                continue;
            }

            html += blockRender(line) + '\n';
        }
        flushCode();
        flushTable();

        // Wrap consecutive list items
        html = html.replace(/(<li>[^<]*<\/li>\n)+/g, function (match) {
            return '<ul>\n' + match + '</ul>\n';
        });

        return html;
    }

    initTheme();

    var sourceEl = document.getElementById('docSource');
    var contentEl = document.getElementById('docContent');
    if (sourceEl && contentEl) {
        var src = sourceEl.textContent;
        contentEl.innerHTML = renderMarkdown(src);
    }
})();
</script>
</body>
</html>
