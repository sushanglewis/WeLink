<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="doc-title" content="龙小督会话 · 台账面板壳">
<meta name="nav-group" content="界面原型">
<meta name="doc-version" content="v0.8-proto">
<meta name="doc-uid" content="proto-shell-chat-panel">
<title>EAIC 原型 · 龙小督会话 · 台账面板</title>
<link rel="stylesheet" href="../../assets/eaic/tokens.css">
<link rel="stylesheet" href="../../assets/eaic/base.css">
<link rel="stylesheet" href="../../assets/eaic/app.css">
<style>
/* 应用壳加宽：默认 .window max-width:1024 导致右侧台账 panel 过窄显示错乱，本原型放宽至 1440 */
.window{max-width:1440px;height:min(880px,calc(100vh - 40px));min-height:660px}
.cp-wrap{display:flex;flex-direction:column;height:100%;min-height:0;background:#fff}
/* D-25 四态布局：L0 默认三栏（聊天记录+插件面板+横跨输入窗口）；L1 收插件面板；L2 收聊天面板 */
.cp-main{display:flex;flex:1;min-height:0}
.cp-chat{flex:1;display:flex;flex-direction:column;min-width:0;min-width:280px}
/* 收起态：面板收成 26px 窄条，窄条本身即展开按钮（hover 整条条可点） */
.cp-chat.collapsed,.cp-panel.collapsed{width:26px!important;min-width:26px!important;overflow:hidden;cursor:pointer}
.cp-chat.collapsed .cp-tabs,.cp-chat.collapsed .cp-conv,
.cp-panel.collapsed .cp-p-head,.cp-panel.collapsed .cp-ph{display:none}
.cp-restore{display:none;width:26px;height:100%;border:none;background:#F2F4F6;color:#646A73;font-size:11px;cursor:pointer;font-family:inherit;align-items:center;justify-content:center;flex-direction:column;gap:6px;padding:10px 0}
.cp-restore span{writing-mode:vertical-rl;letter-spacing:2px}
.cp-chat.collapsed > .cp-restore,.cp-panel.collapsed > .cp-restore{display:flex}
.cp-restore:hover{background:rgba(0,174,104,.1);color:#00875A}
.cp-collapse{border:1px solid #E5E7EB;background:#fff;border-radius:7px;padding:4px 10px;font-size:11.5px;color:#646A73;cursor:pointer;font-family:inherit;margin-left:6px}
.cp-collapse:hover{color:#00875A;border-color:rgba(0,174,104,.5)}
/* 插件 tab 栏：聊天窗口上方 */
.cp-tabs{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid #E5E7EB;background:#FAFBFC}
.cp-tab{display:flex;align-items:center;gap:7px;border:1px solid transparent;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:600;color:#1F2329;background:transparent;cursor:pointer}
.cp-tab:hover{background:rgba(0,174,104,.06)}
.cp-tab.on{background:rgba(0,174,104,.1);border-color:rgba(0,174,104,.35);color:#00875A}
.cp-tab .ic{font-size:14px}
.cp-count{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#00AE68;color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center}
.cp-count.urgent{background:#F53F3F}
.cp-count.zero{display:none}
/* 对话区 */
.cp-conv{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:14px;background:#F7F8FA}
.msg{display:flex;gap:10px;max-width:78%}
.msg .av{width:34px;height:34px;border-radius:9px;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.msg .bubble{background:#fff;border:1px solid #E8EAED;border-radius:10px;padding:10px 13px;font-size:13px;line-height:1.75}
.msg .who{font-size:11.5px;color:#969BA1;margin-bottom:4px}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bubble{background:#00AE68;border-color:#00AE68;color:#fff}
.msg .card{border:1px solid rgba(0,174,104,.4);background:rgba(0,174,104,.05);border-radius:8px;padding:8px 11px;margin-top:8px;font-size:12.5px;line-height:1.7}
/* 提交留痕消息（D-28）：填报提交以用户消息存档，过长默认收起 */
.mdrec-tag{font-size:11px;opacity:.85;margin-bottom:6px;letter-spacing:.5px}
.mdrec pre{margin:0;white-space:pre-wrap;font-family:inherit;font-size:12.5px;line-height:1.8}
.mdrec.collapsed pre{max-height:60px;overflow:hidden}
.mdrec-toggle{margin-top:6px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.55);color:inherit;border-radius:6px;padding:2px 10px;font-size:11px;cursor:pointer;font-family:inherit}
/* 输入区：横跨聊天记录+插件面板两栏（D-25 L0~L2 任一收起态下持久显示） */
.cp-input{border-top:1px solid #E5E7EB;padding:12px 16px;display:flex;gap:10px;align-items:center;background:#fff}
.cp-input .box{flex:1;border:1px solid #E5E7EB;border-radius:9px;padding:9px 13px;font-size:13px;color:#646A73;background:#FAFBFC}
.cp-send{width:36px;height:36px;border-radius:9px;background:#00AE68;color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
/* 右侧台账 panel */
.cp-panel{width:480px;border-left:1px solid #E5E7EB;display:flex;flex-direction:column;background:#fff;flex-shrink:0;position:relative}
/* D-24：Splitter 拖拽调宽（可覆盖聊天区，聊天区最小 320px） */
.cp-split{width:6px;cursor:col-resize;background:transparent;flex-shrink:0}
.cp-split:hover,.cp-split.on{background:rgba(0,174,104,.35)}
/* D-30：台账嵌入占位——壳内仅示意内嵌龙小督台账（批次>事项>详情），不装真实原型（PM 2026-09-14） */
.cp-ph{flex:1;display:flex;gap:10px;padding:12px;background:#F7F8FA;min-height:0}
.cp-ph .col{background:#fff;border:1px solid #E8EAED;border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:11px;overflow:hidden}
.cp-ph .c1{width:168px;flex-shrink:0}
.cp-ph .c2{flex:1;min-width:0}
.cp-ph .c3{width:238px;flex-shrink:0}
.cp-ph .bar{height:13px;border-radius:7px;background:linear-gradient(90deg,#EDEFF1 25%,#F6F7F8 50%,#EDEFF1 75%);background-size:200% 100%;animation:cpsh 1.5s linear infinite}
.cp-ph .bar.card{height:36px}
.cp-ph .bar.area{height:46px}
.cp-ph .row{display:flex;align-items:center;gap:8px}
.cp-ph .badge{width:28px;height:14px;border-radius:7px;background:#E5E9EC;flex-shrink:0}
@keyframes cpsh{0%{background-position:100% 0}100%{background-position:-100% 0}}
.cp-p-head{padding:13px 16px;border-bottom:1px solid #EEF0F2;display:flex;align-items:center;gap:9px}
.cp-p-head .dot{width:8px;height:8px;border-radius:50%;background:#00AE68}
.cp-p-head .t{font-size:13.5px;font-weight:600}
.cp-p-head .tag{margin-left:auto;font-size:11px;color:#00875A;background:rgba(0,174,104,.1);border-radius:9px;padding:2px 9px}
.cp-p-body{flex:1;padding:16px;display:flex;flex-direction:column;gap:11px;overflow:auto}
.sk{border-radius:8px;background:#F2F4F6}
.sk.l1{height:16px;width:62%}
.sk.l2{height:34px}
.sk.l3{height:34px}
.sk.l4{height:34px}
.sk.l5{height:16px;width:45%}
.sk.gap{height:6px;background:transparent}
.sk.btn{height:32px;width:96px;align-self:flex-end;background:rgba(0,174,104,.16)}
</style>
</head>
<body>
<div class="window full" id="win"></div>
<script src="../../assets/eaic/js/data.js"></script>
<script src="../../assets/eaic/js/components.js"></script>
<script src="../../assets/eaic/js/proto.js"></script>
<script>
var ui = EAIC.ui;
var qs = new URLSearchParams(location.search);
var N = Math.max(0, parseInt(qs.get('n') || '2', 10) || 0);
var URGENT = qs.get('urgent') === '1';
/* D-28：有待办督办事项进入会话时默认展开台账 panel（?panel= 可覆盖演示） */
var PANEL = (qs.get('panel') || (N > 0 ? 'open' : 'closed')) !== 'closed';

function convHTML() {
    return '<div class="cp-conv">'
        + '<div class="msg"><div class="av" style="background:#00AE68">督</div><div><div class="who">龙小督 · 09:12</div><div class="bubble">詹少鹏，你有 <b>2 项</b>督办事项待反馈：① SJ2609041005 城区道路维修 ② SJ2608261503 背街小巷照明。<div class="card">右侧「龙小督台账」已打开，可直接逐条填报；也可以直接在对话里告诉我进展，我帮你实时填进台账。</div></div></div></div>'
        + '<div class="msg me"><div class="av" style="background:#5B6B7C">詹</div><div><div class="who" style="text-align:right">詹少鹏 · 09:20</div><div class="bubble">背街小巷照明那条，灯具这周能装完，就是管线老化协调有点慢</div></div></div>'
        + '<div class="msg"><div class="av" style="background:#00AE68">督</div><div><div class="who">龙小督 · 09:20</div><div class="bubble">收到，已按你的口述实时填到右侧台账（SJ2608261503）：<br>· 落实情况：完成两条巷道灯具采购招标，本周开始安装<br>· 存在困难：部分巷道管线老化，改造协调中<br>· 下一步：先易后难分批安装<br>你核对无误后在台账点<b>「提交」</b>即可——提交后跟进记录会存档，并在会话里留一条填报记录方便回看。需要我润色成规范行文吗？</div></div></div>'
        + '<div class="msg me"><div class="av" style="background:#5B6B7C">詹</div><div><div class="who" style="text-align:right">詹少鹏 · 09:24</div><div class="bubble">润色一下</div></div></div>'
        + '<div class="msg"><div class="av" style="background:#00AE68">督</div><div><div class="who">龙小督 · 09:24</div><div class="bubble">已润色（规范行文），替换进台账了，你过目：<br>「已完成两条巷道灯具采购招标工作，本周内启动安装；部分巷道存在管线老化问题，需同步实施改造，目前正在协调；下一步将按照先易后难原则分批组织安装。」<br>确认无误后，在台账里点<b>「提交」</b>即可上报——提交需你本人确认，我无权代你提交；提交内容会以<b>你的消息</b>留在会话里，随时可回看。</div></div></div>'
        + '<div class="msg me"><div class="av" style="background:#5B6B7C">詹</div><div><div class="who" style="text-align:right">詹少鹏 · 09:28</div><div class="bubble"><div class="mdrec collapsed" id="mdrec1"><div class="mdrec-tag">填报记录 · 已提交（提交后自动生成）</div><pre>**SJ2608261503 背街小巷照明** · 跟进记录\n- 落实情况：已完成两条巷道灯具采购招标工作，本周内启动安装\n- 存在困难：部分巷道存在管线老化问题，需同步实施改造，目前正在协调\n- 下一步计划：按照先易后难原则分批组织安装\n- 预计完成时间：2026-09-22\n- 进度评价：已滞后</pre><button class="mdrec-toggle" onclick="toggleRec(\'mdrec1\')">展开全文</button></div></div></div></div>'
        + '<div class="msg"><div class="av" style="background:#00AE68">督</div><div><div class="who">龙小督 · 09:28</div><div class="bubble">已提交 ✓ 台账同步更新（SJ2608261503 → 已填报），填报记录已作为你的消息存档（过长默认收起，可展开回看）。</div></div></div>'
        + '</div>';
}

function toggleRec(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.classList.toggle('collapsed');
    var b = el.querySelector('.mdrec-toggle');
    if (b) b.textContent = el.classList.contains('collapsed') ? '展开全文' : '收起';
}

function panelHTML() {
    return '<div class="cp-panel' + (PANEL ? '' : ' collapsed') + '" id="cpPanel">'
        + '<div class="cp-p-head"><span class="dot"></span><span class="t">龙小督台账</span><span class="tag">督办事项 · ' + N + ' 项待办</span></div>'
        + '<div class="cp-ph" title="龙小督台账嵌入占位">'
        + '<div class="col c1"><div class="bar card"></div><div class="bar card"></div><div class="bar card"></div><div class="bar"></div></div>'
        + '<div class="col c2"><div class="row"><div class="badge"></div><div class="bar" style="flex:1"></div></div><div class="row"><div class="badge"></div><div class="bar" style="flex:1"></div></div><div class="row"><div class="badge"></div><div class="bar" style="flex:1"></div></div><div class="row"><div class="badge"></div><div class="bar" style="flex:1"></div></div><div class="row"><div class="badge"></div><div class="bar" style="flex:1"></div></div></div>'
        + '<div class="col c3"><div class="bar" style="width:55%"></div><div class="bar"></div><div class="bar"></div><div class="bar area"></div><div class="bar"></div><div class="bar" style="width:70%"></div></div>'
        + '</div>'
        + '<button class="cp-restore" onclick="togglePanel()" title="展开台账面板">⇤<span>台账</span></button>'
        + '</div>';
}

function contentHTML() {
    var badge = N > 0 ? ('<span class="cp-count' + (URGENT ? ' urgent' : '') + '">' + N + '</span>') : '<span class="cp-count zero">0</span>';
    return '<div class="cp-wrap">'
        + '<div class="cp-main">'
        + '<div class="cp-chat" id="cpChat">'
        + '<button class="cp-restore" onclick="toggleChat()" title="展开聊天记录"><span>聊天记录</span>⇥</button>'
        + '<div class="cp-tabs"><button class="cp-tab on" id="cpTab" onclick="togglePanel()"><span class="ic">▦</span>台账 ' + badge + '</button>'
        + '<button class="cp-collapse" onclick="toggleChat()" title="收起/展开聊天记录（D-25 L2）">⇥ 收聊天</button>'
        + '<button class="cp-collapse" onclick="togglePanel()" title="收起/展开台账插件面板（D-25 L1）">⇥ 收台账</button></div>'
        + convHTML()
        + '</div>'
        + '<div class="cp-split" id="cpSplit" title="拖拽调整宽度（可覆盖聊天区）"></div>'
        + panelHTML()
        + '</div>'
        /* 底部输入窗口与聊天窗口共用（PM：面板内不再单独内嵌输入框） */
        + '<div class="cp-input"><div class="box">与龙小督对话（可口述进展代填台账），或 @ 它开始新的督办协作…</div><div class="cp-send">➤</div></div>'
        + '</div>';
}

/* 收起/展开：收起态为 26px 窄条（窄条即展开按钮）；splitter 常显，任一侧收起时禁止拖拽 */
function toggleChat() {
    var c = document.getElementById('cpChat');
    if (c) c.classList.toggle('collapsed');
}
function togglePanel() {
    var p = document.getElementById('cpPanel');
    if (p) p.classList.toggle('collapsed');
    var t = document.getElementById('cpTab');
    if (t) t.classList.toggle('on');
}
function anyCollapsed() {
    var p = document.getElementById('cpPanel'), c = document.getElementById('cpChat');
    return (p && p.classList.contains('collapsed')) || (c && c.classList.contains('collapsed'));
}

/* D-24：Splitter 拖拽 */
(function(){
    document.addEventListener('mousedown', function(e){
        if(!e.target.classList||!e.target.classList.contains('cp-split'))return;
        if(anyCollapsed())return;
        e.preventDefault(); e.target.classList.add('on');
        var panel=document.getElementById('cpPanel'), wrap=panel.parentElement;
        var move=function(ev){
            var w=wrap.getBoundingClientRect().right-ev.clientX;
            var max=wrap.getBoundingClientRect().width-320;
            w=Math.max(320,Math.min(max,w));
            panel.style.width=w+'px';
        };
        var up=function(){ document.removeEventListener('mousemove',move); document.removeEventListener('mouseup',up);
            var sp=document.getElementById('cpSplit'); if(sp)sp.classList.remove('on'); };
        document.addEventListener('mousemove',move); document.addEventListener('mouseup',up);
    });
})();

var content = ui.frameMain(contentHTML(), { active: 'chat', badge: EAIC.data.unreadTotal, base: '../' });
EAIC.proto.mount(content);
</script>
</body>
</html>
