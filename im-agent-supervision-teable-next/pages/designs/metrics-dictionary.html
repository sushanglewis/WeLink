# 指标口径字典：事项看板

<!-- status: draft -->

- **日期**: 2026-09-09 v0.6（v0.5 按 D-22 拆双字段、M6「紧急」→「逾期未填报」；**v0.6 按 PM 修正**：两字段完全独立——M2/M3/M4/M6 挂**状态2**（4 值：暂存/推进中/已填报/逾期未填报，去除办结），M5/M7 挂**状态1**（4 值：正常/风险/逾期/完结，纯按当前时间×截止时间计算、与填报无关）；M1 排除状态1=完结；状态定义见 `state-machine.md` v0.6；进度评价三枚举不变）
- **上游**: `gui-dashboard-spec.md`、`prd.md`（D-5/D-10）
- **适用范围**: 事项看板 7 个指标卡 + 列表 2 个统计列；全部指标在 BFF 聚合，前端只展示。状态口径 = 主表双字段（D-22，两字段独立）：**状态2**（跟进状态）单选 4 值（暂存/推进中/已填报/逾期未填报）+ **状态1**（时间状态）单选 4 值（正常/风险/逾期/完结）。
- **数据底座**: 督办任务表 `tblaVFnl1xiS8fLVGYD`（字段 ID 已对照现网提取结果核实）；跟进记录表 `tbl3Tq7pdThgmvcde7j` 仅用于下钻与「跟进次数」。

## 0. 全局约定（所有指标共用）

| 约定 | 定义 |
|------|------|
| 统计对象 | 督办任务表未删除记录（`deletedTime = null`） |
| 时区 | Asia/Shanghai（与 Teable 字段 formatting 一致）；「今天」= 当日 00:00（本地） |
| 角色过滤先行 | 经办人/转办人/次级转办人：先按身份过滤行集合，再计算全部指标（本人口径）；领导/督办人：全量 |
| 身份过滤字段 | 经办人视角：`经办人账号 fldHPLJangSHWtOnkld`(user 多选) 含本人，或 `经办人 fld5QJsm541oXIaJVDK`(文本) = 本人姓名；转办人视角：`转办人 fldMkwE6oLgcJsfBUXo` = 本人；次级转办人视角：`次级转办人 fldFs3fExW588EbZths` = 本人；已转办出去的事项经办人仍可见（只读） |
| 状态2 字段 | `状态 fldgIYI60Lz5ztzMANG`：当前为自由文本，**依赖 D-10/D-22 改造为单选**（4 值：暂存/推进中/已填报/逾期未填报）；改造前本字典所有按状态过滤的指标以清洗映射表为准 |
| 状态1 字段 | 主表**新增单选**（4 值：正常/风险/逾期/完结，D-22/v0.6），由 BFF 按截止时间锚点定时计算（与状态2、与填报与否无关）；完结由督办人手动修改、锁定后不再参与计算；空截止时间不参与状态1 计算，但计入总数 |
| 日期字段 | `截止时间（完成时限）fldWqgJSlAiUoXFY7WY`（date，YYYY-MM-DD）——**状态1 风险/逾期判定锚点（D-21）**；`督办DDL`（本轮反馈截止，主表新增/复用）——**逾期未填报判定锚点（D-22，挂状态2）**；空值不参与对应计算，但计入总数 |

## 1. 指标卡（7 项）

### M1 事项总数
- **业务口径**: 当前角色可见的**未完结**督办事项总量（领导/督办人=全表；经办人=本人经办；转办人=本人经办+本人被转办；次级转办人=本人执行+本人被转办）；状态1=完结 的事项不再被督办，不计入（D-22/v0.6）。
- **技术口径**: `count(状态1 != "完结")`；先行身份过滤。
- **可计算**: ✅ 依赖状态1 字段新增（D-22）。

### M2 推进中
- **业务口径**: 督办人已启动本轮跟进、等待填报五要素的事项数。
- **技术口径**: `count(状态2 == "推进中")`。
- **可计算**: ✅ 依赖状态2 单选改造（D-22）。

### M3 已填报
- **业务口径**: 填报人已提交五字段、等待本轮关闭（督办人导出 Excel 后回暂存）的事项数。
- **技术口径**: `count(状态2 == "已填报")`。
- **可计算**: ✅。

### M4 暂存（在库）
- **业务口径**: 已落库但督办人尚未启动本轮跟进（或上一轮导出关闭回到在库）的事项数。
- **技术口径**: `count(状态2 == "暂存")`。
- **可计算**: ✅。

### M5 风险
- **业务口径**: **当前时间进入截止时间前 7 天**且未完结的事项数（D-21 锚点不变；状态1 纯时间口径，与是否填报无关）。
- **技术口径**: `count(状态1 == "风险")`；由 BFF 定时判定 `今天 >= 截止 - 7d` 且未完结（见 `state-machine.md` T7）。
- **可计算**: ✅ 依赖状态1 字段新增（D-22）。

### M6 逾期未填报（超期未反馈）
- **业务口径**: **超过督办人设定的反馈 DDL 仍未填报**的事项数——即 **超期未反馈**（状态2 口径；已通知督办人跟进）。
- **技术口径**: `count(状态2 == "逾期未填报")`；由 BFF 定时判定 `今天 > 督办DDL` 且未填报（见 `state-machine.md` T3）。
- **可计算**: ✅。看板卡片标题「逾期未填报」，副标题/悬浮说明标注「超期未反馈（过督办反馈 DDL）」口径。

### M7 逾期
- **业务口径**: **当前时间晚于截止时间**且未完结的事项数（D-21 口径：逾期挂任务完成时限字段，不挂督办反馈 DDL）。
- **技术口径**: `count(状态1 == "逾期")`；由 BFF 定时判定 `今天 > 截止` 且未完结（见 `state-machine.md` T8）。
- **边界**: 逾期（状态1）后仍可填报（只影响状态2）；完结后状态1 锁定退出。
- **可计算**: ✅。

## 2. 列表统计列（2 项）

### C1 跟进次数
- **业务口径**: 该事项在跟进记录表的填报记录条数。
- **技术口径**: `len(跟进记录 link字段 fldtlBTGjscwsUjNfiU 的关联记录数组)`；Teable API 返回 link 单元格为记录数组，直接取长度。
- **可计算**: ✅ link 字段现网已存在。

### C2 催办次数（暂不可计算，需数据改造）
- **业务口径**: 该事项被催办的总次数。
- **现状**: `已催办时间 fldTT1NyS43RYDiHTUD` 为自由文本单字段，无法结构化计数。
- **技术方案（二选一，建议 A）**:
  - A. 对齐 S-5 新建「催办记录表」（事项 link + 催办时间 + 渠道 + 操作人），`count(催办记录 where 事项=本记录)`；
  - B. 过渡方案：BFF 催办接口将时间追加写入 `已催办时间`（分号分隔时间戳），BFF 解析计数。
- **可计算**: ❌ 现状不可；按方案 A/B 改造后可算。原型中展示为静态 mock。

## 3. 口径与原型 Mock 数据对照（验证）

原型 TODAY=2026-09-08，mock 10 条（D-22 双字段：状态1 4 值 + 状态2 4 值，两字段独立赋值，演示固定值，实际由 BFF 按锚点实时判定）：状态2=推进中 4（SJ2609041005、SJ2608261503、SJHRM20260812T001、SJ2608150733）、已填报 2（SJ2608311909、SJ2609020815）、暂存 3（SJ2609061012、SJ2608200901、SJ2607010442）、逾期未填报 1（SJ2608311922，督办DDL 09-07 已过）；状态1=风险 1（SJ2608150733，截止 09-13，09-06 起进入风险窗）、逾期 1（SJ2608261503，截止 09-05 已过）、正常 8。

| 指标 | 手算结果 | 原型展示 |
|------|----------|----------|
| 事项总数 | 10 | 10 ✅ |
| 推进中 | 3 | 3 ✅ |
| 已填报 | 2 | 2 ✅ |
| 暂存（在库） | 3 | 3 ✅ |
| 逾期未填报 | 1 | 1 ✅ |
| 风险 | 1 | 1 ✅ |
| 逾期 | 1 | 1 ✅ |
| 跟进次数（行） | 0~6 各行 link 数 | mock 静态值 |

角色视角重算：经办人·詹少鹏（041005 推进中 / 1909 已填报 / 1503 推进中）：总数 3、推进中 3；转办人·李良龙（041005 推进中 / 150733 推进中）：总数 2、推进中 2；次级转办人·王强（041005 推进中 / 1503 推进中）：总数 2、推进中 2——两字段独立后，「已填报但临期」类事项照常计入风险/逾期，原型按身份过滤后实时重算，与口径一致。

**D-22/v0.6 口径演算示例**（TODAY=2026-09-08）：事项 A 截止 09-20、督办DDL 09-15 → 状态1=正常（09-13 起风险，09-21 起逾期，与是否填报无关）；若 09-15 后仍未填报 → 状态2=逾期未填报（通知督办人跟进）；若督办人手动将状态1 改为完结 → 锁定，不再计入风险/逾期/总数；事项 B 截止 09-11、督办DDL 09-10 → 状态1 处于风险窗（09-04 起），09-11 后逾期；事项 C 截止 09-05 → 状态1=逾期。

## 4. 待复核

1. **两字段并存的展示口径**：状态1=逾期 且 状态2=已填报（先报后超期）等事项，看板/表单的状态展示与边条优先级需业务确认（现约定：状态1 异常态以边条/角标呈现，状态2 为主状态列）。
2. **催办次数数据改造方案**（C2 A/B）——建议 A（催办记录表，对齐 S-5）。
3. **截止时间为空**的历史数据量——实现期跑数确认，必要时督办人补录（空值不参与状态1 风险/逾期计算，计入总数）。

<script>
(function () {
    'use strict';

    var THEME_KEY = 'lincoln-theme';

    function getQueryTheme() {
        var m = window.location.search.match(/[?&]theme=(light|dark)(?:&|$)/);
        return m ? m[1] : null;
    }

    function getStoredTheme() {
        try {
            return localStorage.getItem(THEME_KEY);
        } catch (err) {
            return null;
        }
    }

    function setStoredTheme(theme) {
        try {
            localStorage.setItem(THEME_KEY, theme);
        } catch (err) {
            // ignore
        }
    }

    function applyTheme(theme) {
        if (theme !== 'light' && theme !== 'dark') return;
        document.documentElement.setAttribute('data-theme', theme);
        setStoredTheme(theme);
    }

    function initTheme() {
        var theme = getQueryTheme() || getStoredTheme() || 'light';
        applyTheme(theme);

        window.addEventListener('message', function (e) {
            var data = e.data || {};
            if (data.type === 'lincoln-theme' && (data.theme === 'light' || data.theme === 'dark')) {
                applyTheme(data.theme);
            }
        });

        window.addEventListener('load', function () {
            if (window.parent) {
                window.parent.postMessage({ type: 'lincoln-theme-ready' }, '*');
            }
        });
    }

    function renderMarkdown(src) {
        var lines = src.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        var html = '';
        var inCode = false;
        var codeLang = '';
        var codeBuffer = [];
        var inTable = false;
        var tableBuffer = [];

        function flushCode() {
            if (!inCode) return;
            if (codeLang === 'mermaid') {
                html += '<div class="mermaid">' + escapeHtml(codeBuffer.join('\n')) + '</div>\n';
            } else {
                html += '<pre><code class="language-' + (codeLang || 'text') + '">' + escapeHtml(codeBuffer.join('\n')) + '</code></pre>\n';
            }
            inCode = false;
            codeLang = '';
            codeBuffer = [];
        }

        function flushTable() {
            if (!inTable || tableBuffer.length < 2) return;
            html += '<table>\n<thead><tr>';
            var headers = tableBuffer[0].split('|').map(function (s) { return s.trim(); }).filter(Boolean);
            headers.forEach(function (h) { html += '<th>' + inlineRender(h) + '</th>'; });
            html += '</tr></thead>\n<tbody>\n';
            for (var i = 2; i < tableBuffer.length; i++) {
                html += '<tr>';
                var cells = tableBuffer[i].split('|').map(function (s) { return s.trim(); }).filter(Boolean);
                cells.forEach(function (c) { html += '<td>' + inlineRender(c) + '</td>'; });
                html += '</tr>\n';
            }
            html += '</tbody>\n</table>\n';
            inTable = false;
            tableBuffer = [];
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function inlineRender(str) {
            return escapeHtml(str)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>');
        }

        function blockRender(line) {
            if (/^#{1,6}\s+/.test(line)) {
                var level = line.match(/^(#{1,6})\s+/)[1].length;
                var text = line.replace(/^#{1,6}\s+/, '');
                return '<h' + level + '>' + inlineRender(text) + '</h' + level + '>';
            }
            if (/^\s*>\s*(.*)/.test(line)) {
                return '<blockquote><p>' + inlineRender(line.replace(/^\s*>\s*/, '')) + '</p></blockquote>';
            }
            if (/^\s*[-*+]\s+/.test(line)) {
                return '<li>' + inlineRender(line.replace(/^\s*[-*+]\s+/, '')) + '</li>';
            }
            if (/^\s*\d+\.\s+/.test(line)) {
                return '<li>' + inlineRender(line.replace(/^\s*\d+\.\s+/, '')) + '</li>';
            }
            return '<p>' + inlineRender(line) + '</p>';
        }

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i];

            if (/^```/.test(line)) {
                if (inCode) {
                    flushCode();
                } else {
                    flushTable();
                    inCode = true;
                    codeLang = line.replace(/^```\s*/, '').trim();
                }
                continue;
            }

            if (inCode) {
                codeBuffer.push(line);
                continue;
            }

            if (/^\|/.test(line)) {
                inTable = true;
                tableBuffer.push(line);
                continue;
            } else {
                flushTable();
            }

            if (/^\s*$/.test(line)) {
                continue;
            }

            html += blockRender(line) + '\n';
        }
        flushCode();
        flushTable();

        // Wrap consecutive list items
        html = html.replace(/(<li>[^<]*<\/li>\n)+/g, function (match) {
            return '<ul>\n' + match + '</ul>\n';
        });

        return html;
    }

    initTheme();

    function mermaidFallback(list) {
        list.forEach(function (el) {
            if (el.getAttribute('data-fb')) return;
            el.setAttribute('data-fb', '1');
            var pre = document.createElement('pre');
            pre.textContent = el.textContent;
            el.parentNode.replaceChild(pre, el);
        });
    }
    function runMermaid(diagrams) {
        diagrams.forEach(function (el, i) { el.id = 'mmd-' + i; });
        try {
            mermaid.initialize({ startOnLoad: false, theme: 'neutral', flowchart: { htmlLabels: true } });
            mermaid.run({ querySelector: '#docContent .mermaid' });
        } catch (e) { mermaidFallback(diagrams); }
    }
    var sourceEl = document.getElementById('docSource');
    var contentEl = document.getElementById('docContent');
    if (sourceEl && contentEl) {
        var src = sourceEl.textContent;
        contentEl.innerHTML = renderMarkdown(src);
        var diagrams = contentEl.querySelectorAll('.mermaid');
        if (diagrams.length) {
            if (window.mermaid) { runMermaid(diagrams); }
            else {
                var ms = document.createElement('script');
                ms.src = 'https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.min.js';
                ms.onload = function () { if (window.mermaid) { runMermaid(diagrams); } else { mermaidFallback(diagrams); } };
                ms.onerror = function () { mermaidFallback(diagrams); };
                document.head.appendChild(ms);
                setTimeout(function () { if (!window.mermaid) { mermaidFallback(diagrams); } }, 8000);
            }
        }
    }
})();
</script>
