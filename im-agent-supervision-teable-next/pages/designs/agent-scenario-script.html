# 场景剧本：龙小督 × 督办全角色

<!-- status: draft -->

- **日期**: 2026-09-09 v0.10（v0.8 按 PM 决策 D-20：第三幕由「审核闭环」改为「DDL 查收」；v0.9 按 D-22 双字段化、新增「标记办结」；**v0.10 按 PM 修正 D-22**：两字段完全独立——状态1（正常/风险/逾期/完结，纯时间计算）+ 状态2（暂存/推进中/已填报/逾期未填报，无办结）；完结由督办人在 Teable 手动修改状态1（表单内无办结操作）；T 编号对齐 `state-machine.md` v0.6（提交=T2、关闭=T5、重启=T6）；第九幕改为「完结与延期」）（v0.7 按 PM 决策 D-1~D-19 扩展全角色剧本；新增 DDL 查收 D-11、持久化与提交存档 D-12、Excel 唯一下发 D-13、消息列表督办徽标 D-14、催办加急可视化 D-15）
- **上游**: `prd.md`、`embed-form-spec.md`、`role-scenarios.md`
- **角色**: 龙小督（agent）、督办人（如 张秋缘）、经办人（如 詹少鹏）、转办人/次级转办人、领导（GUI 只读 + IM 审批）
- **铁则**（S-1/S-5）: 不脑补、不篡改、保留负面事实；润色与代填**必须经用户确认**

## 剧本总览

```
触发 → 汇总待办 → 推送「N项+deadline」+表单卡片 → k/N 逐条填报(可润色/暂存/转办)
   → 批量提交/逐条提交 → 已填报(存填报消息可回看) → 到 DDL 督办人查收(改数据/保存/导Excel/催逾期) → 本轮关闭回暂存(D-20 无审核)
分支A 表单打不开 → 降级链接；分支B 口头回复 → 润色→确认→代填
分支C 临期/逾期催办 → 原表单加急+push+加急可视化(D-15) → 逾期未填报通知督办人跟进(T2)/逾期升级督办人(只读视图+催办手动入口→IM+邮箱)
分支D 24h 填报监督（下发即接收，D-1）；分支E 转办流（最多三级）；分支F 完结与延期（D-22/v0.6）：上级督办室线下审批 → 督办人在 Teable 手动改状态1=完结/回改截止时间(延期，状态1 重置)
```

## 第一幕：触发与通知（T-0）

**触发源**（任一）：催办规则扫描；管理员/督办人指令「催一下詹少鹏」；**督办人发送 Excel 表格导入完成（唯一下发方式，D-13）**。

**agent 内部动作**：查该执行人进行中事项（按截止时间升序）→ 生成批次 `batch_id` + 签名 URL（24h）→ 发 `supervision_form_card`（`view_mode=edit`）。

**推送话术**：

> 【龙小督 · 督办提醒】詹少鹏，你好。你目前有 **5 项**督办事项需要反馈进展，最早督办 DDL（填报截止）**9 月 9 日**：
> 1. SJ2609041005 城区道路维修（督办DDL 09-10 · 任务截止 09-12）
> 2. SJ2608311909 老旧小区管线改造（督办DDL 09-11 · 任务截止 09-15）
> 3. SJ2608311922 污水管网排查（督办DDL 09-11 · 任务截止 09-15）
> 4. SJ2608261503 背街小巷照明（督办DDL 09-12 · 任务截止 09-18）
> 5. SJHRM20260812T001 绿地养护招标（督办DDL 09-09 · 任务截止 09-20）
>
> 请在下方表单逐条填写，每项已预填上次反馈内容，可直接修改后提交；填写中可用「龙小督润色」将内容转为规范公文。有困难请直接回复我。
>
> [表单卡片：督办事项进展填报 · 共 5 项 · 最近截止 09-12]

（下发即接收，D-1；同一经办人同类催办集中在同一话题，S-4）

同时：经办人**消息列表中龙小督会话旁出现督办状态徽标**「督办 · 5 项待填报」（区别于未读红点，D-14），点击直达本会话表单卡片。

## 第二幕：经办人逐条填报（正常流）

1. 默认停第 1 项；每项：预填三反馈可改 → 预计完成时间 → 进度评价；可点「龙小督润色」规范行文（弹窗确认后替换，可撤销）。
2. 「暂存」断点续填；「提交」单项提交 → 该项 ✓ + 卡片角标「已提交 k/5」。
3. 左侧多选 → 「批量提交」：若有空项，报错「**SJ2608261503 部门反馈工作落实情况不能为空；SJHRM20260812T001 进度评价不能为空**」，补全后可再提交（D-1）；提交后事项转为**已填报**（状态机 T6）。
4. 某项需他人执行 → 该项「转办」→ 选转办人 → 确认 → 转办人收到同款表单（最多再转一次至次级转办人，D-8）。
5. 全部完成 → 卡片完成态 + agent 汇总回执（无汇总页，D-20；各项以填报消息留在会话可回看）。
6. **状态持久化（D-12）**：填报中任意切换会话/重进聊天窗口，表单仍在原处（已填内容、暂存稿、k/N 位置完整恢复），直至批次提交完成或卡片关闭。
7. **提交存档（D-12/D-20）**：每提交一项，该项表单转为只读存档，同时以詹少鹏身份在聊天 session 生成一条**提交存档消息**（事项+五字段摘要+进度评价+提交时间，算作用户发送的一次聊内表单消息）；**点击该消息可呼出只读表单**回看当时提交的全部内容，与跟进记录表一致。

**agent 收尾话术**：

> 【龙小督】已收到你全部 5 项反馈：3 项推进中、1 项已落实、1 项已滞后（SJ2608261503 背街小巷照明，预计 09-22 完成）。滞后项已同步督办人张秋缘。辛苦了！

同时：结果通知督办人；数据进入每日汇总报告数据源（S-5）。

## 第三幕：DDL 查收与本轮关闭（D-11 + D-20，无审核）

到达督办人设定的 DDL 后，龙小督将该批事项（已填报 + 逾期未填报）以 supervisor **查收表单**推送给督办人——**只做数据交互，不做审核**：

> 【龙小督 · 填报查收】张秋缘，你好。本批 5 项督办事项已到 DDL：4 项已填报（3 项推进中、1 项已滞后），1 项逾期未填报（SJ2609070612 行道树补植）。可在下方表单直接查看、修改并保存，也可一键导出 Excel：
> [查收表单卡片：提交（保存到 Teable）/ 导出 Excel / 催办（逾期项）]

- **直接改数据**：已填报项明细可修改（预填最新跟进记录，含龙小督润色，进度评价改评留痕 D-6）；「提交（保存到 Teable）」→ 写跟进记录表（创建人=督办人）→ 卡片回执「已保存」。
- **导出 Excel**：点「导出 Excel」→ BFF 生成本批 .xlsx → 导出成功后**龙小督以文件消息发送至本会话**（可点击下载，含编号/名称/五字段/进度评价/状态）。
- **催办**：仅对**逾期未填报/逾期项**可点（已填报项按钮禁用「已填报无需催办」）→ IM+邮件通知经办人，留痕「已催办时间」；逾期未填报项五字段也可由督办人**代录补正**。
- **完结（状态1，表单外操作）**：上级督办室**线下**同意后，督办人在 Teable **手动将状态1 改为完结**（D-22/v0.6）→ 经办人收「事项已完结」通知；该项此后退出待填报/预警/催办全部链路（不再被督办）。聊内不做审批（D-20 不变），查收表单内无办结按钮。
- **本轮关闭（T5）**：督办人**导出 Excel**（D-21 触发不变）→ 已填报事项回到**暂存**（在库）→ 通知填报人「本轮跟进已关闭」；逾期未填报项保持原状态（留痕），下轮启动回推进中（T6）。
- 查收与修改全程留痕（跟进时间线可见）。

## 第四幕：分支 A/B —— 降级与口头回复

- **A 表单打不开**：iframe 8s 未加载自动降级链接卡片；agent 感知无 `submitted` 且用户点击链接时：
  > 【龙小督】若上方表单无法显示，可点这里在新窗口打开（内容一致）：<form_url>。填完任何一项我都会同步进度。
- **B 口头/文字回复**：识别覆盖事项 → 润色（行文风格 Skill）→ **确认稿必须经用户确认** → 缺失要素 Clarify 追问，不猜测不代编 → 用户「确认」后用**用户 Token** 代填。负面事实（如「对方拒绝施工」）原样保留。

## 第五幕：DDL 填报情况查收（D-11）

到达督办人设定的 DDL 时，不再发送 Teable 筛选视图链接，改为在督办人 IM 会话推送**填报情况表单（supervisor 视图）**：

> 【龙小督 · 填报情况查收】张秋缘，你好。你督办的 3 项事项已到督办 DDL（填报截止），本次填报情况：SJ2609041005 推进中（预计 09-12 完成）、SJ2608311909 已滞后（设计图纸未出具，预计 09-16）、SJ2608261503 已滞后（预计 09-22）。可在下方表单直接查看、修改并保存；需要规范行文可用「龙小督润色」，进度评价改评将留痕（D-6）。
> [表单卡片：督办事项 · 督办人查收 · 共 3 项]

- 督办人在表单内直接修改 → 「保存」→ BFF 用**督办人托管 Token** 写跟进记录表（创建人=督办人，改评留痕）→ 主表自动化同步 → 卡片回执「已保存」。
- 督办人点「催办」→ 同逾期链路，立即 IM+邮件通知经办人。

## 第六幕：分支 C —— 催办与逾期升级（D-4/D-7）

- **① 风险自动催（进入完成时限前 7 天，T4/D-15）**：**不生成新表单**——原表单升级加急状态：卡片角标转「已加急」、表单内该项截止标红 + 加急横幅、消息列表督办徽标转红；龙小督另发一条 push 消息（每日催办类 ≤2 条；22:00–8:00 延迟至次日 8:30）：

> 【龙小督 · 催办加急】詹少鹏，你的 5 项督办反馈中 **SJ2609041005 城区道路维修距完成时限（09-12）只剩 4 天仍未反馈**，该项已在上方的表单中加急标红，请优先填报。表单没有变，还是原来那个，继续填就行。

- **② 逾期未填报（过督办 DDL 未填报，T2）**：原表单持续加急 + push 经办人，同时**通知督办人跟进**：

> 【龙小督 · 超期未反馈】张秋缘，SJ2608311922 污水管网排查已过督办 DDL（09-07）仍未填报，已持续催办并加急。请在查收表单中跟进（可代录补正/催办）。

- **③ 逾期升级督办人（过完成时限，T5/D-4）**：不再直接纠缠经办人，而是向督办人推送该事项的**只读表单视图**（含「催办」手动入口，供督办人主动再催；自动路径无需人工点击）：

> 【龙小督 · 逾期升级】张秋缘，SJ2608261503 背街小巷照明已逾期 2 天，经办人詹少鹏尚未反馈（已自动催办 2 次并加急）。可在下方表单查看事项详情；如需立即再催，点「催办」我将即时向经办人发送 IM 和邮件通知。
> [只读表单卡片]

督办人点「催办」（可选）→ IM+邮件即时发出 → 「已催办时间」留痕 → 回执督办人「已催办」。逾期仍无反馈：按同一链路每日提醒督办人一次，由督办人决策（改派/上报）。

## 第七幕：分支 D —— 24h 填报监督（D-1）

- 任务下发 24h 后，BFF 检查该经办人是否对批次内所有事项完成五字段提交。
- 未填齐（假设缺 2 项）：

> 【龙小督】提醒：你本次 5 项督办反馈还有 **2 项**未提交（SJ2608261503、SJHRM20260812T001），其中 SJ2608261503 明天截止。请在上方表单补报；确有困难请回复我说明。

- 同步向督办人发未填清单；此提醒计入每日 ≤2 条频控。

## 第八幕：领导侧（D-5/D-9）

- **LD-01 只读 GUI**：领导打开看板 → 指标卡（总数/推进中/已填报/暂存(在库)/逾期未填报/风险/逾期，D-22 双字段口径）→ 列表筛选条件框组合筛选、表头点击排序 → 点击行下钻跟进记录时间线。GUI 无编辑入口。
- **批示过问本期不做（D-17）**：原「LD-02 批示」场景移出本期，「领导批示」字段保留存储、二期再做。

## 第九幕：分支 F —— 完结与延期（D-22/v0.6）

- **完结**：到达完成时限、经办人已上报材料 → 督办人携材料报**上级督办室**（线下审批，聊内/系统内无审批流，D-20 不变）。同意后督办人在 Teable **手动将状态1 改为完结**：

> 【龙小督 · 完结确认】张秋缘，SJ2608311909 老旧小区管线改造已按上级督办室意见完结（状态1 已置为完结），该项此后不再纳入督办与预警；经办人詹少鹏已同步通知。

- **延期**：上级督办室不同意完结，或督办人/经办人认为不该完结 → 督办人在 Teable **回改截止时间** → BFF 按新锚点重置状态1（新截止−7d / 新截止）→ 下一轮由督办人重新设定督办 DDL 并启动（T1/T6）：

> 【龙小督 · 延期确认】已将 SJ2608261503 背街小巷照明的截止时间调整为 10-15，状态1 按新时限重新计算；下一轮督办启动时会重新设定督办 DDL。

| 15 | 消息列表徽标 | 龙小督会话旁显示「督办 · N 项待填报」（≠未读红点）；提交一项徽标 -1；全部完成徽标消失（D-14） |
| 16 | 临期自动催办 | 无新表单；原表单该项截止标红+加急横幅、卡片角标「已加急」、消息列表徽标转红 + push 消息（D-15） |
| 17 | 上级督办室同意完结 | 督办人在 Teable 手动将状态1 改为完结 → 审计留痕 → 经办人收完结通知；该项不再出现在待填报/预警/催办链路 |
| 18 | 不同意完结，回改截止时间 | 截止时间更新 → 状态1 按新锚点重置；下轮启动重新生成批次（T1/T6） |
</script>

<script src="../../assets/app.js"></script>
<script>
(function () {
    'use strict';

    var THEME_KEY = 'lincoln-theme';

    function getQueryTheme() {
        var m = window.location.search.match(/[?&]theme=(light|dark)(?:&|$)/);
        return m ? m[1] : null;
    }

    function getStoredTheme() {
        try {
            return localStorage.getItem(THEME_KEY);
        } catch (err) {
            return null;
        }
    }

    function setStoredTheme(theme) {
        try {
            localStorage.setItem(THEME_KEY, theme);
        } catch (err) {
            // ignore
        }
    }

    function applyTheme(theme) {
        if (theme !== 'light' && theme !== 'dark') return;
        document.documentElement.setAttribute('data-theme', theme);
        setStoredTheme(theme);
    }

    function initTheme() {
        var theme = getQueryTheme() || getStoredTheme() || 'light';
        applyTheme(theme);

        window.addEventListener('message', function (e) {
            var data = e.data || {};
            if (data.type === 'lincoln-theme' && (data.theme === 'light' || data.theme === 'dark')) {
                applyTheme(data.theme);
            }
        });

        window.addEventListener('load', function () {
            if (window.parent) {
                window.parent.postMessage({ type: 'lincoln-theme-ready' }, '*');
            }
        });
    }

    function renderMarkdown(src) {
        var lines = src.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        var html = '';
        var inCode = false;
        var codeLang = '';
        var codeBuffer = [];
        var inTable = false;
        var tableBuffer = [];

        function flushCode() {
            if (!inCode) return;
            if (codeLang === 'mermaid') {
                html += '<div class="mermaid">' + escapeHtml(codeBuffer.join('\n')) + '</div>\n';
            } else {
                html += '<pre><code class="language-' + (codeLang || 'text') + '">' + escapeHtml(codeBuffer.join('\n')) + '</code></pre>\n';
            }
            inCode = false;
            codeLang = '';
            codeBuffer = [];
        }

        function flushTable() {
            if (!inTable || tableBuffer.length < 2) return;
            html += '<table>\n<thead><tr>';
            var headers = tableBuffer[0].split('|').map(function (s) { return s.trim(); }).filter(Boolean);
            headers.forEach(function (h) { html += '<th>' + inlineRender(h) + '</th>'; });
            html += '</tr></thead>\n<tbody>\n';
            for (var i = 2; i < tableBuffer.length; i++) {
                html += '<tr>';
                var cells = tableBuffer[i].split('|').map(function (s) { return s.trim(); }).filter(Boolean);
                cells.forEach(function (c) { html += '<td>' + inlineRender(c) + '</td>'; });
                html += '</tr>\n';
            }
            html += '</tbody>\n</table>\n';
            inTable = false;
            tableBuffer = [];
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function inlineRender(str) {
            return escapeHtml(str)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>');
        }

        function blockRender(line) {
            if (/^#{1,6}\s+/.test(line)) {
                var level = line.match(/^(#{1,6})\s+/)[1].length;
                var text = line.replace(/^#{1,6}\s+/, '');
                return '<h' + level + '>' + inlineRender(text) + '</h' + level + '>';
            }
            if (/^\s*>\s*(.*)/.test(line)) {
                return '<blockquote><p>' + inlineRender(line.replace(/^\s*>\s*/, '')) + '</p></blockquote>';
            }
            if (/^\s*[-*+]\s+/.test(line)) {
                return '<li>' + inlineRender(line.replace(/^\s*[-*+]\s+/, '')) + '</li>';
            }
            if (/^\s*\d+\.\s+/.test(line)) {
                return '<li>' + inlineRender(line.replace(/^\s*\d+\.\s+/, '')) + '</li>';
            }
            return '<p>' + inlineRender(line) + '</p>';
        }

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i];

            if (/^```/.test(line)) {
                if (inCode) {
                    flushCode();
                } else {
                    flushTable();
                    inCode = true;
                    codeLang = line.replace(/^```\s*/, '').trim();
                }
                continue;
            }

            if (inCode) {
                codeBuffer.push(line);
                continue;
            }

            if (/^\|/.test(line)) {
                inTable = true;
                tableBuffer.push(line);
                continue;
            } else {
                flushTable();
            }

            if (/^\s*$/.test(line)) {
                continue;
            }

            html += blockRender(line) + '\n';
        }
        flushCode();
        flushTable();

        // Wrap consecutive list items
        html = html.replace(/(<li>[^<]*<\/li>\n)+/g, function (match) {
            return '<ul>\n' + match + '</ul>\n';
        });

        return html;
    }

    initTheme();

    function mermaidFallback(list) {
        list.forEach(function (el) {
            if (el.getAttribute('data-fb')) return;
            el.setAttribute('data-fb', '1');
            var pre = document.createElement('pre');
            pre.textContent = el.textContent;
            el.parentNode.replaceChild(pre, el);
        });
    }
    function runMermaid(diagrams) {
        diagrams.forEach(function (el, i) { el.id = 'mmd-' + i; });
        try {
            mermaid.initialize({ startOnLoad: false, theme: 'neutral', flowchart: { htmlLabels: true } });
            mermaid.run({ querySelector: '#docContent .mermaid' });
        } catch (e) { mermaidFallback(diagrams); }
    }
    var sourceEl = document.getElementById('docSource');
    var contentEl = document.getElementById('docContent');
    if (sourceEl && contentEl) {
        var src = sourceEl.textContent;
        contentEl.innerHTML = renderMarkdown(src);
        var diagrams = contentEl.querySelectorAll('.mermaid');
        if (diagrams.length) {
            if (window.mermaid) { runMermaid(diagrams); }
            else {
                var ms = document.createElement('script');
                ms.src = 'https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.min.js';
                ms.onload = function () { if (window.mermaid) { runMermaid(diagrams); } else { mermaidFallback(diagrams); } };
                ms.onerror = function () { mermaidFallback(diagrams); };
                document.head.appendChild(ms);
                setTimeout(function () { if (!window.mermaid) { mermaidFallback(diagrams); } }, 8000);
            }
        }
    }
})();
</script>
</body>
</html>
