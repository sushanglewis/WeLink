# 角色细分场景与业务闭环：龙小督督办全角色

<!-- status: draft -->

- **日期**: 2026-09-14 v0.14（v0.14 按 PM 2026-09-14 对齐轮（D-31）：**督办人台账无催办按钮**（PM：无此功能）——D-4 手动催办入口、DB-03/DB-04 催办操作全部移除，逾期未填报项改为督办人直接修改/代录补正；经办人侧提醒均为系统自动发出（D-15 自动加急保留）；督办人职责表去「催办」）（v0.13 按 PM 2026-09-14 操作映射表（D-30）：D-1 批量操作作废——表单只含五要素、无批量提交/批量转办，操作按钮按 事项状态×角色 映射渲染（含越级代提、已归档只读）；JB-02 同步）（v0.12 按 PM 2026-09-11 决策 D-29 审查修订：v0.12 按 PM 2026-09-11 决策 D-29 审查修订：新增 **D-29 决策行**（督办批次/节点状态 7 值/提交即审核/三级看板）；全文督办 DDL 口径改**批次 DDL 双轨**——推进中事项 DDL=所属批次 DDL，无批次单事项场景保留单事项 DDL）（v0.11 按 PM 2026-09-10 决策 D-28：系统内不做线上审批——办结审批在上级督办室线下完成，办结后由督办人在多维表格手动将事项状态改为已办结；领导仅 GUI 只读总览）v0.10 按 PM 2026-09-10 决策 D-26/D-27 回填：事项状态/事项跟进状态 更名事项状态/事项跟进状态；填报表单命名「龙小督台账」）（v0.9 按 PM 2026-09-10 决策回填：D-23 风险必须通知经办人 + 看板时间线五要素；D-24 表单载体改为 DM 右侧扩展 panel（可拖宽覆盖聊天区、底部持久 NL 输入、NL 代填+手填）；D-25 桌面端外壳收起 + 待办数徽标，见 `desktop-shell-spec.md`）（v0.6 按 PM 2026-09-08 决策回填 D-1~D-19；v0.7 按 PM 决策 D-22 回填双字段；**v0.8 按 PM 修正 D-22**：两字段完全独立——事项状态（正常/风险/逾期/完结，纯时间计算）+ 事项跟进状态（暂存/推进中/已填报/逾期未填报，去除办结）；完结并入事项状态、由督办人在 Teable 手动修改；D-19/D-21 被 D-22 取代，见 `state-machine.md` v0.6；Excel 唯一下发、消息列表督办徽标、催办加急可视化、困难仅填报内容、批示过问移出本期）
- **上游**: `prd.md`、`embed-form-spec.md`、`agent-scenario-script.md`、`supervision-p0.md`（S-1~S-5）
- **定位**: 四类角色（督办人/经办人/转办人/领导）细分场景与闭环。技术已确认可落地，本文保证场景闭环与体验。

## 1. 角色定义与数据落点

| 角色 | 职责 | 主表字段（督办任务 `tblaVFnl1xiS8fLVGYD`） | 交互主通道 |
|------|------|-------------------------------------------|-----------|
| 督办人 | 下发督办任务、跟踪进展、完结标记（Teable 手动修改事项状态，上级督办室线下同意后） | 督办人姓名 `fldk2GSOhDo2iAwmFH0` / 督办人账号 `fldh9Ztg81w9x2rquZZ` | 龙小督 IM + 表单视图（supervisor 查收 / 逾期只读视图） |
| 经办人 | 实际跟进任务，提供进展三要素（落实/困难/下一步） | 经办人 `fld5QJsm541oXIaJVDK` / 经办人账号 `fldHPLJangSHWtOnkld` | 龙小督 IM + 填报表单 |
| 转办人 / 次级转办人 | 任务的最终执行者 | 转办人 `fldMkwE6oLgcJsfBUXo`(user) / 次级转办人 `fldFs3fExW588EbZths`(user) | 龙小督 IM + 填报表单 |
| 领导 | 总览全部事项与进度风险 | 领导批示 `fldw7V7xueFXDWK89NR` | **GUI 只读总览**（办结审批为线下流程，D-28） |

协作链：**督办人 → 经办人 →（转办人 → 次级转办人）**，最多三级，转办止于次级转办人（D-8）。进展由当前执行人口径填报，领导只读总览（批示过问本期不做，D-17；办结审批为线下流程、系统不做线上审批，D-28）。

| D-25 | 桌面端外壳收起 + 待办徽标 | 功能菜单收起为 icon bar、聊天列表可收起；龙小督条目=未读红点+待办事项数量徽标（`desktop-shell-spec.md`） |
| D-22 | 状态机双字段 + 完结/延期（v0.6 修正） | **事项状态**（时间状态，4 值：正常/风险/逾期/完结）+ **事项跟进状态**（跟进状态，4 值：暂存/推进中/已填报/逾期未填报），两字段**完全独立**：事项状态 仅按当前时间×截止时间计算（与是否填报无关）；**去除「紧急」**（与业务风险定义冲突），其「超期未反馈/通知督办人跟进」职责归「推进中→逾期未填报」（T3）；**完结并入事项状态**：上级督办室线下同意后督办人**在 Teable 手动修改**，终态、不再被督办；延期不设状态值=督办人回改截止时间、事项状态 重判；通知/监控逻辑不变（见 `state-machine.md` v0.6） |
| D-29 | 督办批次/节点状态/三级看板 | 台账信息层级=**督办批次**（文件来源编号+督办日期+批次 DDL，口头约定默认 36h；1:N 事项，事项级不设 DDL，无批次单事项场景保留单事项 DDL）；新增**节点状态** 7 值（落跟进记录表；提交即审核、系统无审核按钮；逐级通知不跨级；导出归档回「事项暂存中」）；看板统一**批次>事项编号>详情**三级层级、修改仅暂存、必须提交才以提交人 Token 落库 |
| D-20 | 聊内不做审核 | 聊内弹窗=数据交互 GUI：无审核/打回/申请办结/汇总页；督办人查收表单直接改数据+提交（保存 Teable）+导出 Excel（文件消息送达）；提交存为填报消息可只读回看；已填报→暂存由本轮批次关闭触发（见 `embed-form-spec.md`/`state-machine.md`；表单载体自 D-24 起为 DM 右侧扩展 panel） |

## 3. 场景地图（触发 → 触达 → 办理 → 回执 → 数据落点 → 下游可见）

### 3.1 督办人（6 场景）

| 编号 | 场景 | 闭环流程 |
|------|------|----------|
| DB-01 | Excel 下发新任务（唯一方式，D-13） | 督办人给龙小督发送 **Excel 表格** → 龙小督解析校验（编号唯一/经办人匹配，失败行逐条反馈修正、不得丢行）→ 落主表（事项跟进状态=暂存）→ 督办人启动督办（T1）后经办人收表单卡片（下发即接收，D-1） |
| DB-02 | 跟踪进展 | 经办人/转办人每次提交 → 龙小督向督办人推回执（事项+进度评价+预计完成时间变化）→ 可一键追问；**进度评价督办人可改评**（留痕，D-6） |
| DB-03 | 提醒与逾期升级 | **风险窗（完成时限前 7 天）系统自动提醒经办人**（T4）：不生成新表单，原表单加急 + push 消息 + 加急可视化（D-15，每日提醒类 ≤2 条）；**过批次 DDL 未填报→逾期未填报（T2，D-29）**：持续提醒经办人 + **通知督办人跟进**（继承原「紧急」通知）；**逾期升级督办人（T5）**：督办人收表单只读视图（可查看/代录补正）→ 系统自动 IM+邮箱通知经办人（D-4）→ 提醒历史落「已催办时间」 |
| DB-04 | 填报查收与本轮关闭 | DDL 到达后龙小督推 supervisor **查收**表单（已填报+逾期未填报项）→ 督办人**直接修改数据并提交**（保存 Teable，留痕）/ **导出 Excel**（龙小督发文件消息）/ 逾期未填报项可由督办人**直接修改/代录补正**（表单内无办结操作、无催办按钮，D-31）→ **导出 Excel 后本轮关闭：已填报→暂存**，填报人收「本轮跟进已关闭」通知（T5，D-20/D-21 无审核）；逾期未填报项保持原状态留痕，下轮启动回推进中（T6） |
| DB-05 | DDL 填报情况查收（D-11） | 到达批次 DDL（D-29）→ 龙小督推 supervisor 表单（可修改保存+润色）→ 督办人改评/补正留痕（创建人=督办人）→ 主表自动化同步 |
| DB-06 | 完结与延期（D-22/v0.6） | 到达完成时限后督办人汇总经办人材料报**上级督办室**：同意 → 督办人在 Teable **手动将事项状态 改为完结**（终态，该项不再被督办/预警/催办，经办人收完结通知）；不同意或暂缓 → 督办人**回改截止时间**（延期，事项状态 按新锚点重置），下一轮重新启动督办（新一轮批次 DDL 随新 Excel 生成，D-29） |

### 3.2 经办人（6 场景）

| 编号 | 场景 | 闭环流程 |
|------|------|----------|
| JB-01 | 接收填报通知 | 新任务下发/批次到期触发 → 推送「N 项 + 批次 DDL（D-29）」+ 表单卡片（k/N）；消息列表龙小督会话旁出现**督办状态徽标**（待填报事项数，D-14） |
| JB-02 | 逐条填报 | 右侧明细逐条填五字段（「存在困难」仅为填报内容，D-16）→ 「龙小督润色」按钮规范行文（确认后回填，D-2）→ 暂存或提交（单项提交，空项报错「{编号} {字段}不能为空」，D-1/D-30）；已转办项标记「↷ 已转办」，经办人可按映射越级代提；提交项转只读并存为聊天历史提交存档消息（D-12）；中途离开再回表单仍在（D-12） |
| JB-03 | 转办分派 | 当前项点「转办」→ 选转办人 → 写主表「转办人」字段 → 转办人收同款表单；转办人可再转次级转办人（D-8）；转办后原填报责任转移到新执行人 |
| JB-04 | 临期/延期 | 进入风险窗自动催办：原表单加急 + push 消息（D-15，无新表单）→ 补报；需延期由督办人**回改完成时限**（D-22，预警按新时限重置），下轮随新 Excel 生成新批次与批次 DDL（D-29） |
| JB-05 | 填报与本轮关闭 | 提交五字段 → 已填报（转只读存档 + **存为填报消息**，点击消息可只读回看）→ 批次 DDL 后督办人查收（可修改留痕）→ 本轮关闭回暂存收「本轮跟进已关闭」通知、节点回「事项暂存中」（D-20 无审核/打回，D-29 提交即审核） |

### 3.3 转办人 / 次级转办人（2 场景）

| 编号 | 场景 | 闭环流程 |
|------|------|----------|
| ZB-01 | 接收转办 | 主表转办人字段写入触发 → 龙小督通知执行要求+deadline → 同款表单直接填报（D-2，记录创建人=实际填报人）；按钮：暂存/提交/转办（转办人）或 暂存/提交（次级转办人，无转办；D-20 无申请办结） |
| ZB-02 | 再转办 | 转办人可将当前项再转次级转办人（链路终点）；不可再向下转 |

### 3.4 领导（3 场景）

| 编号 | 场景 | 闭环流程 |
|------|------|----------|
| LD-01 | GUI 只读总览 | 全部事项列表（**筛选条件框组合筛选**，D-9）+ 指标卡 + 点击行下钻跟进记录时间线；GUI 不开放编辑，保持只读（D-5） |
| LD-02 | ——（领导本期不参与审批） | D-20 起聊内无审核环节；领导侧保持 GUI 只读总览，逾期未填报/风险/逾期事项在 GUI 上直接可见（D-22 双字段口径） |

> **本期不做批示过问（D-17）**：原 LD-02（批示过问）与督办人「响应领导批示」场景移出本期；「领导批示」字段保留存储，二期再做。

## 3.5 消息列表督办状态徽标（D-14，IM 客户端通用）

- **位置**：IM 消息列表（会话列表）龙小督会话行，头像/名称旁；与未读红点**并存但语义独立**（徽标 ≠ 未读数）。
- **计数口径**：当前用户**待填报表的事项数**——经办人/转办人/次级转办人 = 本人未提交批次的进行中事项数；督办人 = 待查收（DDL 到达）+ 逾期未填报事项数；无待办时徽标隐藏。
- **数据源**：BFF 聚合接口（`GET /supervision/badge`，登录态映射身份），客户端轮询/WS 刷新；与表单卡片 `submitted` 回执同源。
- **联动**：催办加急时徽标转红并附「加急」角标（D-15）；点击徽标/会话直达龙小督会话并定位到对应表单卡片。
- 原型演示：壳页面 `?view=chat`（见界面原型 · 事项看板 EAIC 壳内）。

## 5. 风险与对策（决策后残余）

| # | 风险 | 对策 |
|---|------|------|
| R-1 | 邮箱催办通道 1.4.1 前未就绪（D-4 要求 IM+邮箱） | 先 IM 即时发，邮件通道就绪后自动补发；BFF 通知层做渠道抽象 |
| R-2 | 历史状态自由文本清洗（D-10/D-22）可能误归并 | 清洗前导出备份，人工确认映射表（如「已完成」→办结；双字段映射见 `state-machine.md` §5） |
| R-3 | 完结依赖上级督办室线下审批，时延不可控（D-22） | 完结为督办人在 Teable 手动修改事项状态，不阻塞其他事项；未完结项按事项状态 时间口径正常计入风险/逾期 |
| R-4 | 转办后原经办人不再看到进展 | 表单视图按「当前执行人」过滤；转办后经办人保留只读可见 + 汇总口径 |
| R-5 | 润色按钮被误当作自动改写（铁则） | 润色结果必须用户确认后替换，保留原文可撤销（对齐 S-1 铁则） |
| R-6 | 多端同时打开同一表单并发保存 | 服务端批次+用户维度乐观锁（版本号），后保存者收冲突提示并刷新（D-12） |
| R-7 | 提交存档消息被误解为可编辑回执 | 存档消息为只读历史消息；需更正时走「修改保存」（督办人）或新一次填报（执行人），均留痕 |

<script>
(function () {
    'use strict';

    var THEME_KEY = 'lincoln-theme';

    function getQueryTheme() {
        var m = window.location.search.match(/[?&]theme=(light|dark)(?:&|$)/);
        return m ? m[1] : null;
    }

    function getStoredTheme() {
        try {
            return localStorage.getItem(THEME_KEY);
        } catch (err) {
            return null;
        }
    }

    function setStoredTheme(theme) {
        try {
            localStorage.setItem(THEME_KEY, theme);
        } catch (err) {
            // ignore
        }
    }

    function applyTheme(theme) {
        if (theme !== 'light' && theme !== 'dark') return;
        document.documentElement.setAttribute('data-theme', theme);
        setStoredTheme(theme);
    }

    function initTheme() {
        var theme = getQueryTheme() || getStoredTheme() || 'light';
        applyTheme(theme);

        window.addEventListener('message', function (e) {
            var data = e.data || {};
            if (data.type === 'lincoln-theme' && (data.theme === 'light' || data.theme === 'dark')) {
                applyTheme(data.theme);
            }
        });

        window.addEventListener('load', function () {
            if (window.parent) {
                window.parent.postMessage({ type: 'lincoln-theme-ready' }, '*');
            }
        });
    }

    function renderMarkdown(src) {
        var lines = src.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        var html = '';
        var inCode = false;
        var codeLang = '';
        var codeBuffer = [];
        var inTable = false;
        var tableBuffer = [];

        function flushCode() {
            if (!inCode) return;
            if (codeLang === 'mermaid') {
                html += '<div class="mermaid">' + escapeHtml(codeBuffer.join('\n')) + '</div>\n';
            } else {
                html += '<pre><code class="language-' + (codeLang || 'text') + '">' + escapeHtml(codeBuffer.join('\n')) + '</code></pre>\n';
            }
            inCode = false;
            codeLang = '';
            codeBuffer = [];
        }

        function flushTable() {
            if (!inTable || tableBuffer.length < 2) return;
            html += '<table>\n<thead><tr>';
            var headers = tableBuffer[0].split('|').map(function (s) { return s.trim(); }).filter(Boolean);
            headers.forEach(function (h) { html += '<th>' + inlineRender(h) + '</th>'; });
            html += '</tr></thead>\n<tbody>\n';
            for (var i = 2; i < tableBuffer.length; i++) {
                html += '<tr>';
                var cells = tableBuffer[i].split('|').map(function (s) { return s.trim(); }).filter(Boolean);
                cells.forEach(function (c) { html += '<td>' + inlineRender(c) + '</td>'; });
                html += '</tr>\n';
            }
            html += '</tbody>\n</table>\n';
            inTable = false;
            tableBuffer = [];
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');
        }

        function inlineRender(str) {
            return escapeHtml(str)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
                .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                .replace(/\*([^*]+)\*/g, '<em>$1</em>');
        }

        function blockRender(line) {
            if (/^#{1,6}\s+/.test(line)) {
                var level = line.match(/^(#{1,6})\s+/)[1].length;
                var text = line.replace(/^#{1,6}\s+/, '');
                return '<h' + level + '>' + inlineRender(text) + '</h' + level + '>';
            }
            if (/^\s*>\s*(.*)/.test(line)) {
                return '<blockquote><p>' + inlineRender(line.replace(/^\s*>\s*/, '')) + '</p></blockquote>';
            }
            if (/^\s*[-*+]\s+/.test(line)) {
                return '<li>' + inlineRender(line.replace(/^\s*[-*+]\s+/, '')) + '</li>';
            }
            if (/^\s*\d+\.\s+/.test(line)) {
                return '<li>' + inlineRender(line.replace(/^\s*\d+\.\s+/, '')) + '</li>';
            }
            return '<p>' + inlineRender(line) + '</p>';
        }

        for (var i = 0; i < lines.length; i++) {
            var line = lines[i];

            if (/^```/.test(line)) {
                if (inCode) {
                    flushCode();
                } else {
                    flushTable();
                    inCode = true;
                    codeLang = line.replace(/^```\s*/, '').trim();
                }
                continue;
            }

            if (inCode) {
                codeBuffer.push(line);
                continue;
            }

            if (/^\|/.test(line)) {
                inTable = true;
                tableBuffer.push(line);
                continue;
            } else {
                flushTable();
            }

            if (/^\s*$/.test(line)) {
                continue;
            }

            html += blockRender(line) + '\n';
        }
        flushCode();
        flushTable();

        // Wrap consecutive list items
        html = html.replace(/(<li>[^<]*<\/li>\n)+/g, function (match) {
            return '<ul>\n' + match + '</ul>\n';
        });

        return html;
    }

    initTheme();

    function mermaidFallback(list) {
        list.forEach(function (el) {
            if (el.getAttribute('data-fb')) return;
            el.setAttribute('data-fb', '1');
            var pre = document.createElement('pre');
            pre.textContent = el.textContent;
            el.parentNode.replaceChild(pre, el);
        });
    }
    function runMermaid(diagrams) {
        diagrams.forEach(function (el, i) { el.id = 'mmd-' + i; });
        try {
            mermaid.initialize({ startOnLoad: false, theme: 'neutral', flowchart: { htmlLabels: true } });
            mermaid.run({ querySelector: '#docContent .mermaid' });
        } catch (e) { mermaidFallback(diagrams); }
    }
    var sourceEl = document.getElementById('docSource');
    var contentEl = document.getElementById('docContent');
    if (sourceEl && contentEl) {
        var src = sourceEl.textContent;
        contentEl.innerHTML = renderMarkdown(src);
        var diagrams = contentEl.querySelectorAll('.mermaid');
        if (diagrams.length) {
            if (window.mermaid) { runMermaid(diagrams); }
            else {
                var ms = document.createElement('script');
                ms.src = 'https://cdn.jsdelivr.net/npm/mermaid@10.9.3/dist/mermaid.min.js';
                ms.onload = function () { if (window.mermaid) { runMermaid(diagrams); } else { mermaidFallback(diagrams); } };
                ms.onerror = function () { mermaidFallback(diagrams); };
                document.head.appendChild(ms);
                setTimeout(function () { if (!window.mermaid) { mermaidFallback(diagrams); } }, 8000);
            }
        }
    }
})();
</script>
