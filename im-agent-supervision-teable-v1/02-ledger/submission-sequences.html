> 对应操作映射矩阵的流转规则：任一节点处理后，以**龙小督消息**通知下一节点归属人；**提交即审核**——每次提交（含代提）由提交人经 API 将五要素写入跟进记录，代表提交人认可所提交内容。节点状态与跟进记录 1-1（D-38），状态值见《状态机说明》§4。代提直迁只取决于**提交者级别**，与事项当前处于哪个未归档节点无关（示例统一取「待次级转办人填报」为起点）。

## 1. 正常逐级提交-审核链（无代提）

```mermaid
sequenceDiagram
    autonumber
    participant S as 督办人
    participant A as 龙小督
    participant J as 经办人
    participant Z as 转办人
    participant C as 次级转办人
    participant R as 跟进记录表
    S->>A: 启动督办批次（Excel/口头编号 + 反馈 DDL）
    A->>R: 创建跟进记录（节点=待经办人处理）
    A->>J: 消息「N 项待填报 + 批次 DDL」
    J->>A: 转办给转办人
    A->>R: 节点=待转办人处理（事件留痕）
    A->>Z: 消息通知待办
    Z->>A: 再转次级转办人
    A->>R: 节点=待次级转办人填报
    A->>C: 消息通知待办
    C->>A: 填报提交五字段
    A->>R: 写入跟进记录（记录人=C）+ 节点=待转办人提交
    A->>Z: 消息「待你查看并提交」
    Z->>A: 查看并提交（提交即审核）
    A->>R: 写入跟进记录（记录人=Z）+ 节点=待经办人提交
    A->>J: 消息「待你查看并提交」
    J->>A: 查看并提交
    A->>R: 写入跟进记录（记录人=J）+ 节点=待督办人提交
    A->>S: 消息「待你查收」
    S->>A: 导出 Excel 归档
    A->>R: 节点=归档（终态）
    A-->>J: 消息「本轮跟进已关闭」
```

## 2. 提交即审核 · 通用写入机制（任意角色每次提交都走这一段）

```mermaid
sequenceDiagram
    autonumber
    participant U as 提交人（任意角色）
    participant A as 龙小督
    participant R as 跟进记录表
    U->>A: 点击「提交」
    A->>A: 必填校验（空项报错「{任务编号} {字段名}不能为空」）
    A->>R: 以提交人身份写入跟进记录（五要素 + 前后节点 + 协作者信息）
    Note over A,R: 该写入即「审核」：提交人认可所提交内容，系统不设审核按钮
    A->>R: 节点状态按规则迁移（逐级推进，或代提直迁见 §3~§5）
    A-->>U: 提交回执（卡片角标「已填报 k/N」，该项转只读存档）
    A->>A: 龙小督消息通知下一节点归属人（仅通知新归属人，不跨级）
```

## 3. 越级代提 · 例 A：督办人直提（当前节点=待次级转办人填报 → 归档）

```mermaid
sequenceDiagram
    autonumber
    participant S as 督办人（王督办）
    participant A as 龙小督
    participant J as 经办人（詹少鹏）
    participant Z as 转办人（李良龙）
    participant C as 次级转办人（王强）
    participant R as 跟进记录表
    Note over S,R: 前置：批次已下发，事项经 经办人→转办人 逐级转办；当前节点=待次级转办人填报，归属人=次级转办人
    S->>A: 打开台账，选中该事项（可见性：与本督办人有关）
    A-->>S: 预填表单（最新跟进记录 + 主表当前值）
    opt 润色
        S->>A: 点击「龙小督润色」
        A-->>S: 规范文本弹窗（确认后替换、可撤销）
    end
    S->>A: 修改五要素后点击「提交」（代提）
    activate A
    A->>R: 写入跟进记录（记录人=督办人）
    Note over A,R: 提交即审核：督办人是链路最高级，本次提交视为 次级转办人处理 + 转办人审核 + 经办人审核 全部通过
    A->>R: 节点跨状态直迁：待次级转办人填报 → 归档（终态）<br/>不经过 待转办人提交 / 待经办人提交 / 待督办人提交
    par 知会原链路成员
        A-->>C: 消息「该事项已由督办人代提并归档，你无需再处理」
    and
        A-->>Z: 消息「本轮该事项已由督办人关闭归档」
    and
        A-->>J: 消息「本轮该事项已由督办人关闭归档」
        A-->>S: 回执「已提交并归档」（该项只读；批次卡片仍可导出 Excel 留痕）
    end
    deactivate A
    Note over J,C: 权限收敛：经办人/转办人/次级转办人对该项均转为只读，不可再修改
```

## 4. 越级代提 · 例 B：经办人代提（当前节点=待次级转办人填报 → 待督办人提交）

```mermaid
sequenceDiagram
    autonumber
    participant J as 经办人（詹少鹏）
    participant A as 龙小督
    participant Z as 转办人（李良龙）
    participant C as 次级转办人（王强）
    participant S as 督办人（王督办）
    participant R as 跟进记录表
    Note over J,R: 前置：经办人已转办给转办人，转办人已再转给次级转办人；当前节点=待次级转办人填报，归属人=次级转办人
    J->>A: 打开台账，选中该事项（本人相关：本人经办 + 已转办）
    A-->>J: 预填表单（最新跟进记录）
    opt 润色
        J->>A: 点击「龙小督润色」
        A-->>J: 规范文本弹窗（确认后替换、可撤销）
    end
    J->>A: 填报五要素后点击「提交」（代提）
    activate A
    A->>R: 写入跟进记录（记录人=经办人）
    Note over A,R: 提交即审核：经办人提交视为 次级转办人处理 + 转办人审核 两级通过；不经过 待转办人提交 / 待经办人提交
    A->>R: 节点跨状态直迁：待次级转办人填报 → 待督办人提交（提交者上一级）
    par 通知新节点归属人
        A->>S: 消息「SJ… 待你查看并提交」
    and 知会被越过的成员
        A-->>C: 消息「该事项已由经办人代提上报，你无需再处理」
    and
        A-->>Z: 消息「该事项已由经办人代提上报，你无需再处理」
        A-->>J: 回执「已提交」（卡片角标「已填报 k/N」，该项转只读）
    end
    deactivate A
    Note over C,Z: 权限收敛：次级转办人/转办人对该项只读，不可再改
    Note over S: 后续：督办人查看并提交 → 写入跟进记录（记录人=督办人）→ 节点=归档，本轮关闭
```

## 5. 越级代提 · 例 C：转办人代提（当前节点=待次级转办人填报 → 待经办人提交）

```mermaid
sequenceDiagram
    autonumber
    participant Z as 转办人（李良龙）
    participant A as 龙小督
    participant C as 次级转办人（王强）
    participant J as 经办人（詹少鹏）
    participant S as 督办人（王督办）
    participant R as 跟进记录表
    Note over Z,R: 前置：转办人已再转给次级转办人；当前节点=待次级转办人填报，归属人=次级转办人
    Z->>A: 打开台账，选中该事项（本人相关：本人被转办）
    A-->>Z: 预填表单（最新跟进记录）
    opt 润色
        Z->>A: 点击「龙小督润色」
        A-->>Z: 规范文本弹窗（确认后替换、可撤销）
    end
    Z->>A: 填报五要素后点击「提交」（代提）
    activate A
    A->>R: 写入跟进记录（记录人=转办人）
    Note over A,R: 提交即审核：转办人提交视为 次级转办人处理 通过；不经过 待转办人提交
    A->>R: 节点跨状态直迁：待次级转办人填报 → 待经办人提交（提交者上一级）
    par 通知新节点归属人
        A->>J: 消息「SJ… 待你查看并提交」
    and 知会被越过的成员
        A-->>C: 消息「该事项已由转办人代提上报，你无需再处理」
        A-->>Z: 回执「已提交」（卡片角标「已填报 k/N」，该项转只读）
    end
    deactivate A
    Note over C: 权限收敛：次级转办人对该项只读
    Note over J: 后续：经办人查看并提交 → 待督办人提交 → 督办人提交 → 归档，本轮关闭
```

## 6. 代提直迁规则速查

| 代提提交者 | 事项当前节点（示例，任意未归档节点均可） | 直迁目标节点 | 通知对象 |
|---|---|---|---|
| 督办人 | 待经办人处理 / 待转办人处理 / 待次级转办人填报 / 待转办人提交 / 待经办人提交 | **归档**（视为全链路审核通过） | 原链路成员「已关闭归档」 |
| 经办人 | 待转办人处理 / 待次级转办人填报 / 待转办人提交 | 待督办人提交 | 督办人（新归属）+ 被越过成员「无需再处理」 |
| 转办人 | 待次级转办人填报 | 待经办人提交 | 经办人（新归属）+ 次级转办人「无需再处理」 |
| 次级转办人 | —（链路终点，无下级可代） | 只能正常提交 → 待转办人提交 | 转办人 |

**共同约束**

- 代提仅可在**未归档**节点发起；发起时表单预填最新跟进记录，可修改、可润色（确认后替换）。
- 每次提交（含代提）以提交人身份写入跟进记录——**提交即审核**，被越过层级的审核视为通过，不再另行通知其"待审核"。
- 直迁后仅**新节点归属人**收到「待你查看并提交」；被越过的成员收到「无需再处理」，且该项对其实时转只读。
- 已归档与更高审核态一律只读；全部事件（写入、直迁、通知）全量留痕（时间+操作人+前后节点+协作者）。
