> 5 张指标卡 + 明细列表列清单的业务/技术双口径。原则（D-43）：外层 Dashboard 指标**只基于事项主表字段**统计，不展示跟进记录明细口径的指标（推进中/已填报/逾期未填报/已归档等跟进状态与跟进次数均不进看板指标卡）；跟进记录内容（五要素反馈/进度评价/事项跟进状态/节点状态）仅在行下钻抽屉中展示（GUI-03）。事项状态=完结 的事项**不出现在正常/风险/逾期指标**（仍计入总数）；指标卡始终按筛选后全量计算、与分页无关（GUI-08）。

## 1. 指标卡（5 项，主表口径）

> **字段落点（D-37/D-43）**：事项状态=主表字段（单选 4 值：正常/风险/逾期/完结）；事项跟进状态=跟进记录表字段（推进中/已填报/逾期未填报/已归档），**不参与看板指标卡**，只在台账与下钻抽屉呈现。

### M1 事项总数
- **业务口径**：当前角色可见的全部督办事项总量，**含已完结**（领导/督办人=全表；经办人=本人经办；转办人=本人经办+本人被转办；次级转办人=本人执行+本人被转办）；完结不再被督办、不参与风险/逾期，但仍计入总数。
- **技术口径**：`count(全部可见记录)`（不过滤完结）；先行身份过滤。

### M2 正常
- **业务口径**：未进入截止前 7 天且未完结的事项数（纯时间口径，与是否填报无关）。
- **技术口径**：`count(事项状态 == "正常")`；事项落库默认，回改截止时间后按新锚点重算（状态机 T7 反向）。

### M3 风险
- **业务口径**：当前时间进入**截止时间前 7 天**且未完结的事项数（纯时间口径，与是否填报无关）。
- **技术口径**：`count(事项状态 == "风险")`；BFF 定时判定 `今天 >= 截止 - 7d` 且未完结（状态机 T7）。

### M4 逾期
- **业务口径**：当前时间**晚于截止时间**且未完结的事项数（挂任务完成时限，不挂督办反馈 DDL）。
- **技术口径**：`count(事项状态 == "逾期")`；BFF 定时判定 `今天 > 截止` 且未完结（状态机 T8）。

### M5 完结
- **业务口径**：经上级督办室线下同意后由督办人手动标记完结、终态锁定的事项数。
- **技术口径**：`count(事项状态 == "完结")`；督办人手动修改（D-20），锁定后不再参与风险/逾期计算、不再被督办。

## 2. 明细列表列（主表字段）

列表列 = **主表字段**，顺序与范围按看板清单（D-26）：

任务编号 / 任务名称 / 交办事项 / 责任单位 / 经办人 / 交办时间 / 截止日期 / 预计完成时间 / 事项状态 / 任务来源 / 板块类别 / 事项类别 / 部门负责人 / 部门主管 / 督办人

- 跟进记录口径的内容——部门反馈三要素（落实情况/存在困难/下一步计划）、进度评价、事项跟进状态、节点状态——**不在列表列展示**，统一在行下钻抽屉呈现（GUI-03，含跟进记录时间线，每次填报展示五要素）。
- 不设置「跟进次数」「催办次数」统计列：跟进记录条数已在抽屉时间线标题「倒序 N 条」体现；系统本无催办动作（督办人无催办按钮，D-31），不产生催办计数。

## 3. 口径演算示例（验收用）

原型 TODAY=2026-09-08，mock 11 条（事项状态按锚点赋值，实际由 BFF 按锚点实时判定）：总数 11 / 正常 8 / 风险 1 / 逾期 1 / 完结 1 → 手算与原型展示一一对应。

- 事项 A 截止 09-20 → 正常（09-13 起风险，09-21 起逾期，与是否填报无关）；督办人手动改完结 → 锁定，从正常/风险/逾期移入完结（仍计入总数）。
- 事项 B 截止 09-11 → 09-04 起风险，09-11 后逾期。
- 已填报但临期（先报后超期）的事项照常计入风险/逾期——事项状态与填报完全无关；跟进状态（推进中/已填报/逾期未填报/已归档）不影响本看板任何指标。

**角色视角重算**：指标按身份过滤后实时重算——经办人·詹少鹏（3 项）：总数 3/正常 2/逾期 1；转办人·李良龙（1 项）：总数 1/风险 1；领导/督办人全量：总数 11（含完结 1）/正常 8/风险 1/逾期 1/完结 1。

## 4. 待复核

1. 主表明细列范围与 D-26 看板清单对账——若领导需要在列表速览跟进状态，建议仅在抽屉呈现，不进列表列。
2. 截止时间为空的历史数据量——实现期跑数确认，必要时督办人补录（空值不参与风险/逾期计算，计入总数）。
3. 抽屉跟进记录时间线已含条数小计（「倒序 N 条」），不另设统计列；如需按角色统计跟进轮次再另行立项。
