## 背景与问题

- 督办任务现散落在 Excel 与群消息中：领导看不到全局进展与风险，经办人靠人工催办反馈，无统一台账。
- 龙小督（督办数字员工）已具备 IM 触达能力，需要将「督办台账」产品化为**看板（领导只读）+ 聊内填报（经办/转办）**双端体验。

## 产品目标

1. **督办看板 GUI（领导只读总览）**：指标卡（主表口径 5 张）+ 可组合筛选事项列表 + 点击行下钻跟进记录时间线；GUI 无任何写操作入口。
2. **龙小督台账（聊内逐条填报）**：经办人、转办人、次级转办人在龙小督 DM 右侧扩展 panel「龙小督台账」中按「批次 > 事项编号 > 事项详情」三级层级逐条填报五要素（落实情况/存在困难/下一步计划/预计完成时间/进度评价）；支持单项提交、转办（弹窗选人）、龙小督润色、暂存续填；自然语言口述由龙小督代填预填，用户核对后本人提交。
3. **业务闭环**：任务下发双通道（D-32）= ① 督办人发送 Excel 并提供自然语言描述的反馈 DDL（可新增事项）；② 口头提供一个或多个督办任务编号并提供自然语言描述的反馈 DDL（仅可督办在库事项，不能新增）；两种通道都经解析校验→生成督办批次→落库→启动督办→通知经办人（下发即接收）；全部事项遵循双字段状态机；24h 填报监督；风险/逾期系统自动提醒（仅通知督办人，看板标红，台账不加急，D-44；不加新表单、无需人工点击）；批次 DDL 到达后督办人查收（直接修改/导出 Excel），导出即本轮关闭归档。
4. **数据闭环**：提交只写跟进记录表（记录人=实际填报人），主表反馈字段系统自动同步；状态字段规范化单选；操作全量留痕。
5. **桌面端外壳改造**：功能菜单可收起为 icon bar、聊天列表可收起；聊天列表龙小督条目双徽标（未读红点 + 待办事项数量徽标）。

## 核心口径摘要（研发必读）

- **三字段独立状态机（D-22/D-37/D-38/D-43）**：`事项状态`（正常/风险/逾期/完结）= **主表字段**，仅按当前时间×截止时间计算，**风险/逾期仅通知督办人**；督办人可手动标记**完结**（终态锁定），或**回改截止时间**使风险/逾期事项重算**恢复为正常**（D-40）；`事项跟进状态`（推进中/已填报/逾期未填报/已归档）= **跟进记录表字段**，与跟进记录明细 1-1——督办人督办一批事项即为每个事项创建挂批次 DDL 的跟进记录（初始=推进中），下载批次 Excel 后该批记录转已归档（D-43）；`节点状态`（归档/待经办人处理/…/待督办人提交）= 跟进记录表独立字段，记录创建即待经办人处理、导出 Excel 转归档（原「暂存」更名「归档」）。三字段各自迁移、互不影响；已废弃「紧急」值；「暂存」移出跟进状态值集（表单「暂存」仅为草稿动作），「在库」为派生业务概念（无进行中跟进记录），不作字段值/指标。
- **批次化督办（D-29）**：台账信息层级 = 督办批次（文件来源编号+督办日期+批次 DDL，口头约定默认 36h）> 事项编号 > 事项详情；事项级不再设 DDL（无批次单事项场景保留单事项 DDL，DDL 双轨）；批次按督办日期近→远排序。
- **提交即审核（D-20/D-29）**：系统内不做任何审批，无审核/打回/申请办结按钮；下一级提交即视为上一级审阅通过并上报，提交记录以提交人身份写入跟进记录表；办结审批在上级督办室线下完成，办结后督办人在台账手动将事项状态改为完结。
- **节点状态（D-29/D-38）**：7 值（归档/待经办人处理/待转办人处理/待次级转办人填报/待转办人提交/待经办人提交/待督办人提交），跟进记录表独立字段；提交即审核、逐级通知不跨级、上级可越级代提（D-30）；导出 Excel 后该批跟进记录转归档（终态），下轮创建新记录。
- **操作映射（D-30）**：处理中状态 = 转办（仅经办人/转办人）+ 填报提交；审核中状态 = 编辑+提交；已归档与更高审核态一律只读；表单只含五要素、**无批量操作**；单项提交必填校验，报错「{任务编号} {字段名}不能为空」。
- **台账可见性（D-34）**：批次 > 事项 > 事项详情层级下，所有人可见所有**与自己有关**的批次、事项和事项详情；**仅可修改当前处理节点在自己头上**的督办事项。
- **自动提醒（D-15/D-31/D-37/D-44）**：进入风险窗（截止前 7 天）/逾期（事项状态）= 系统自动判定、**仅通知督办人**，可视化只落在 **GUI 看板**（事项级标红/徽章），**不在龙小督台账面板加急/标红/挂横幅**——台账按批次组织（批次-事项 M:N），事项级风险/逾期与批次无关、重复出现在多个批次卡片会误导（D-44）；不生成新表单。逾期未填报（跟进记录状态，锚定批次 DDL）= 通知经办人 + 督办人跟进，批次级加急可视化保留在台账；**督办人台账无催办按钮**，逾期未填报项由督办人直接修改/代录补正。
- **导出即归档（D-20/D-21/D-43）**：导出入口在督办批次卡片（按批导出），**仅当批内所有跟进记录均为已填报时可用**（存在推进中/逾期未填报则入口置灰，督办人直接修改/代录补正至全部已填报后方可导出）；导出成功后龙小督以文件消息发送至督办人会话；该批次全部跟进记录变更为已归档（终态），节点状态同步归档（D-38）。
- **转办链（D-8）**：最多「经办人→转办人→次级转办人」三级，次级转办人为链路终点（无转办按钮）。
- **任务下发双通道（D-32）**：Excel + 自然语言反馈 DDL（可新增事项）；或口头提供督办任务编号 + 自然语言反馈 DDL（仅限在库事项，不能新增）。两通道同走解析校验与批次链路。
- **逾期仍可填报（D-33）**：逾期未填报事项在表单中仍可填报提交，提交后由逾期未填报改为已填报。
- **加载失败刷新（D-35）**：表单加载失败时插件内提供「刷新」重新加载；持续失败再降级链接卡片。
- **徽标（D-41）**：消息列表龙小督会话行督办待办徽标仅一种形态、不做未读红点——「**待处理事项 N**」，N=该用户在跟进记录表中**当前节点归属人=本人**的未归档跟进记录数（推进中/已填报/逾期未填报，即以其督办人/经办人/转办人/次级转办人任一角色**流转到他头上**、等待处理/提交/查收导出的事项；已填报待导出项归属督办人；由节点状态+归属人字段判定，D-38）；所有人可见，N=0 不显示。
- **责任链路（D-40）**：事项明细表单顶部展示「督办人 → 经办人 →（转办人 → 次级转办人）」链路；无转办人/次级转办人的事项不显示对应环节。
- **界面话术（D-31）**：界面只用业务语言（存档/留痕/通知），不出现 Token/API/落库等技术词。
