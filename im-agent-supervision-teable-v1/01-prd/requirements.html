## 非功能需求

- **身份与安全**：所有操作以本人身份执行与留痕，身份与事项不匹配时拒绝操作；润色仅建议、经用户确认才生效；数据按身份隔离（经办人仅见本人相关事项）。
- **性能**：看板首屏 < 2s；表单预填 < 1s；组合筛选响应快；台账 panel 拖拽流畅。
- **兼容性**：一期桌面端为主；二期移动端直填；降级链接全端可用。
- **持久性**：表单草稿与批次状态服务端保存（D-12），会话中断恢复不丢已填内容。
- **可维护**：状态值集与指标口径集中维护，避免多处口径不一致。
- **审计**：填报（记录人=填报人）、转办、提醒、改评全量留痕（审批在线下完成，不在系统内）。

## 发布标准（验收 checklist）

- [ ] 指标卡（主表口径 5 卡：总数/正常/风险/逾期/完结，D-43；事项状态=完结 不出现在正常/风险/逾期指标）与督办台账人工核对一致；组合筛选正确、表头排序正确；分页正确且指标卡不受分页影响。
- [ ] GUI 无任何写操作入口；经办人仅见本人相关事项。
- [ ] 表单 k/N 导航、单项提交必填校验（报错文案「{编号} {字段}不能为空」）、暂存续填、润色确认替换、转办全链路正确；操作按钮按 D-30 映射矩阵渲染（无批量操作）；提交后事项跟进状态=已填报。
- [ ] 督办人查收/逾期视图无催办按钮；逾期未填报项可直接修改/代录补正并提交（留痕）；经办人侧提醒由系统自动发出。
- [ ] 24h 填报监督触发准确；频控生效（非工作时间延迟、提醒类 ≤2/日）。
- [ ] 提交写入跟进记录（记录人=填报人）、主表自动同步及时；状态字段规范化与历史数据清洗完成。
- [ ] 重复提交安全、越权访问拦截、审计留痕生效。
- [ ] 表单持久化：session 内切换后再回聊天窗口表单仍在，现场（已填/暂存/k-N 位置）完整恢复。

| D-44 | 风险/逾期不进台账 + 批次-事项 M:N | ① 批次-事项为 **M:N**：一个批次含多个事项；同一事项生命周期内（可达一年）可在多个批次被多次督办收集五要素，每轮生成一条跟进记录。② 风险/逾期锚定主表「截止时间」，属**事项级**状态；台账面板按批次组织，同一条事项级风险/逾期会重复出现在多个批次卡片中，无法归因批次且误导填报人——因此风险/逾期的加急可视化**只落在 GUI 看板（事项级标红/徽章），龙小督台账面板不加急、不标红、不挂横幅**；台账内仅保留批次级「逾期未填报」（锚定批次 DDL）的加急可视化；通知口径不变（风险/逾期仅通知督办人 D-37；逾期未填报通知经办人+督办人） |
